  /* =====================================================================
     REGISTRY
     ===================================================================== */
  function blankReg() { return { q: '', region: '', dzo: '', direction: '', status: '', risk: '', period: '', attn: '', resp: '', wf: '', mine: '', funding: '' }; }
  const isMine = (p) => { const u = Core.user; return !!u && (p.createdBy === u.id || p.reviewer === u.id || p.resp.name === u.name); };
  function applyRegFilters() {
    const f = STATE.reg; const q = f.q.trim().toLowerCase();
    const plus30 = DB.addDays(TODAY, 30);
    let list = PROJECTS.filter(p =>
      (!q || (p.name + ' ' + p.code + ' ' + p.resp.short + ' ' + p.dzoName + ' ' + p.region).toLowerCase().includes(q)) &&
      (!f.region || p.region === f.region) && (!f.dzo || p.dzo === f.dzo) && (!f.direction || p.direction === f.direction) &&
      (!f.status || p.status === f.status) && (!f.risk || p.risk === f.risk) &&
      (!f.funding || p.funding === f.funding) && (!f.resp || p.resp.short === f.resp) && (!f.wf || (f.wf === 'CHECK' ? ['SUBMITTED', 'REVIEW'].includes(p.wf) : p.wf === f.wf)) && (!f.mine || isMine(p)) &&
      (!f.period || (f.period === 'overdue' ? p.overdue : f.period === '30' ? (p.status !== 'Завершено' && p.planEnd >= TODAY && p.planEnd <= plus30) : String(p.planEnd.getFullYear()) === f.period))
    );
    if (f.attn) {
      const a = attention();
      const m = { 'Просроченные сроки': a.overdue, 'Высокий риск': a.high, 'Отсутствуют документы': a.docs, 'Требуют решения комиссии': a.commission }[f.attn] || [];
      const ids = new Set(m.map(p => p.id)); list = list.filter(p => ids.has(p.id));
    }
    const key = { risk: 'riskOrder', resp: 'respName', wf: 'wfOrder' }[f.sort] || f.sort;
    list = list.map(p => Object.assign(p, { riskOrder: RISK_ORDER[p.risk], respName: p.resp.short, wfOrder: DB.WF_KEYS.indexOf(p.wf) }));
    return sortRows(list, key, f.dir);
  }
  const REG_COLS = [
    { k: 'id', t: '№', cls: 'nowrap muted', r: p => p.id },
    { k: 'name', t: 'Наименование проекта', cls: 't-name', r: p => `<div>${esc(p.name)}</div><div class="t-sub">${p.code}</div>` },
    { k: 'dzoShort', t: 'ДЗО', cls: 'nowrap', r: p => `<span title="${esc(p.dzoName)}">${p.dzoShort}</span>` },
    { k: 'region', t: 'Регион', cls: '', r: p => shortRegion(p.region) },
    { k: 'direction', t: 'Направление', cls: '', r: p => p.direction },
    { k: 'budget', t: 'Бюджет план', cls: 'r nowrap num', r: p => money(p.budget) },
    { k: 'spent', t: 'Бюджет факт', cls: 'r nowrap num', r: p => money(p.spent) },
    { k: 'progress', t: '% реализации', cls: '', r: p => progressBar(p.progress) },
    { k: 'planEnd', t: 'План. завершение', cls: 'nowrap num', r: p => p.overdue ? `<span class="overdue" title="Просрочено на ${overdueDays(p)} дн.">${fdate(p.planEnd)}</span>` : fdate(p.planEnd) },
    { k: 'resp', t: 'Ответственный', cls: 'nowrap', r: p => p.resp.short },
    { k: 'wf', t: 'Статус workflow', cls: '', r: p => UI.wfBadge(p.wf) },
    { k: 'risk', t: 'Уровень риска', cls: '', r: p => riskBadge(p.risk) }
  ];
  function projects(params) {
    if (params.has('reset')) Object.assign(STATE.reg, blankReg());
    const KEYS = ['status', 'region', 'dzo', 'risk', 'direction', 'period', 'attn', 'resp', 'wf', 'mine', 'funding'];
    KEYS.forEach(k => { if (params.has(k)) { Object.assign(STATE.reg, blankReg()); } });
    KEYS.forEach(k => { if (params.has(k)) STATE.reg[k] = params.get(k); });
    if (params.toString()) { history.replaceState(null, '', '#/projects'); }
    const f = STATE.reg;
    const u = Core.user;
    const years = [...new Set(PROJECTS.map(p => p.planEnd.getFullYear()))].sort().map(String);
    const resps = [...new Set(PROJECTS.map(p => p.resp.short))].sort((a, b) => a.localeCompare(b, 'ru'));
    view().innerHTML = `
      <div class="page-head">
        <div><h1>${f.mine ? 'Мои проекты' : 'Реестр социальных проектов'}</h1><div class="sub">${u.role === 'DZO' ? `Проекты ${DZO_BY_ID[u.dzo].name}` : u.access === 'ALL' ? 'Сквозной реестр проектов всех ДЗО группы КМГ' : `Проекты доступных ДЗО: ${Core.accessLabel(u)}`}</div></div>
        <div class="page-actions">
          <button class="btn" id="btnExport">${icon('download')}Экспорт в Excel (CSV)</button>
          ${Core.user.role === 'ADMIN' ? `<button class="btn" id="btnImport" title="Доступно только администратору">${icon('upload')}Импорт CSV</button>` : ''}
          ${Core.can('create') ? `<button class="btn btn-primary" id="btnNew">${icon('plus')}Новый проект</button>` : ''}
        </div>
      </div>
      <div class="card">
        <div class="filters">
          <div class="field search-field"><label>Поиск</label>${icon('search')}<input class="input" id="fQ" placeholder="Название, код, ответственный…" value="${esc(f.q)}"></div>
          ${DZO.length > 1 ? `<div class="field"><label>ДЗО</label><select class="select" data-f="dzo">${options(DZO.map(z => [z.id, z.short + ' — ' + z.name.replace(/^(АО|ТОО) /, '')]), f.dzo)}</select></div>` : ''}
          <div class="field"><label>Регион</label><select class="select" data-f="region">${options([...new Set(PROJECTS.map(p => p.region))].sort().map(r => [r, shortRegion(r)]), f.region)}</select></div>
          <div class="field"><label>Направление</label><select class="select" data-f="direction">${options(DIRECTIONS, f.direction)}</select></div>
          <div class="field"><label>Статус</label><select class="select" data-f="status">${options(STATUSES, f.status)}</select></div>
          <div class="field"><label>Уровень риска</label><select class="select" data-f="risk">${options(RISKS, f.risk)}</select></div>
          <div class="field"><label>Год завершения</label><select class="select" data-f="period">${options([['30', 'Ближайшие 30 дней'], ['overdue', 'Просроченные'], ...years], f.period, 'Все годы')}</select></div>
          <div class="field"><label>Ответственный</label><select class="select" data-f="resp">${options(resps, f.resp)}</select></div>
          <div class="field"><label>Источник финансирования</label><select class="select" data-f="funding">${options(Object.entries(DB.FUNDING).map(([k, x]) => [k, x.label]), f.funding)}</select></div>
          <div class="field"><label>Статус workflow</label><select class="select" data-f="wf">${options([['CHECK', 'На проверке (все)'], ...DB.WF_KEYS.filter(k => u.role !== 'KMG' || k !== 'DRAFT').map(k => [k, DB.WF[k].label])], f.wf)}</select></div>
          <div class="field f-reset"><label>&nbsp;</label><button class="btn btn-ghost" id="fReset">${icon('x')}Сбросить</button></div>
        </div>
        <div class="chips" id="chips"></div>
        <div class="table-wrap"><table class="tbl" id="regTbl"><thead><tr>
          ${REG_COLS.map(c => `<th class="sortable ${c.cls.includes('r ') || c.cls.startsWith('r') ? 'r' : ''} ${f.sort === c.k ? 'sorted' : ''}" data-sort="${c.k}">${c.t}<span class="sort">${f.sort === c.k ? (f.dir > 0 ? '▲' : '▼') : '↕'}</span></th>`).join('')}
          ${Core.can('delete') ? '<th class="c" title="Доступно только администратору">Удалить</th>' : ''}
        </tr></thead><tbody id="regBody"></tbody></table></div>
        <div class="tbl-foot" id="regFoot"></div>
      </div>`;
    const render = () => {
      const list = applyRegFilters();
      document.getElementById('regBody').innerHTML = list.length
        ? list.map(p => `<tr class="clickable" data-go="#/project/${p.id}">${REG_COLS.map(c => `<td class="${c.cls}">${c.r(p)}</td>`).join('')}${Core.can('delete', p) ? `<td class="c"><button class="icon-btn" style="width:30px;height:30px;color:var(--bad)" title="Удалить проект" data-del="${p.id}">${icon('x')}</button></td>` : ''}</tr>`).join('')
        : `<tr><td colspan="${REG_COLS.length + 1}"><div class="empty">По заданным условиям проекты не найдены</div></td></tr>`;
      document.getElementById('regFoot').innerHTML = `<span>Показано ${list.length} из ${PROJECTS.length} проектов</span>
        <span>Бюджет выборки: план <b class="num">${money(sum(list, 'budget'))}</b> · факт <b class="num">${money(sum(list, 'spent'))}</b> · средняя реализация <b class="num">${list.length ? Math.round(sum(list, 'progress') / list.length) : 0}%</b></span>`;
      const labels = { region: 'Регион', dzo: 'ДЗО', direction: 'Направление', status: 'Статус', risk: 'Риск', period: 'Период', attn: 'Внимание', resp: 'Ответственный', wf: 'Workflow', mine: 'Мои проекты', funding: 'Финансирование' };
      const val = (k, v) => k === 'funding' ? DB.FUNDING[v].short : k === 'mine' ? 'да' : k === 'wf' ? (v === 'CHECK' ? 'На проверке' : DB.WF[v].label) : k === 'dzo' ? DZO_BY_ID[v].short : k === 'period' ? ({ '30': 'Ближайшие 30 дней', overdue: 'Просроченные' }[v] || v) : k === 'region' ? shortRegion(v) : v;
      document.getElementById('chips').innerHTML = Object.keys(labels).filter(k => f[k]).map(k => `<span class="chip">${labels[k]}: ${esc(val(k, f[k]))}<button data-unset="${k}">${icon('x')}</button></span>`).join('');
      document.querySelectorAll('[data-unset]').forEach(b => b.onclick = () => { f[b.dataset.unset] = ''; syncSelects(); render(); });
      document.querySelectorAll('#regBody [data-del]').forEach(b => b.onclick = (e) => {
        e.stopPropagation();
        const p = PROJECTS.find(x => x.id === +b.dataset.del);

      bindGo(document.getElementById('regBody'));

    document.getElementById('fQ').addEventListener('input', (e) => { f.q = e.target.value; render(); });
    document.querySelectorAll('[data-f]').forEach(s => s.onchange = () => { f[s.dataset.f] = s.value; render(); });
    document.getElementById('fReset').onclick = () => { Object.assign(f, blankReg()); document.getElementById('fQ').value = ''; syncSelects(); render(); };
    document.querySelectorAll('[data-sort]').forEach(th => th.onclick = () => {
      const k = th.dataset.sort; if (f.sort === k) f.dir *= -1; else { f.sort = k; f.dir = 1; }

    });
    document.getElementById('btnExport').onclick = () => {

      downloadCSV('reestr_proektov.csv', ['№', 'Код', 'Наименование', 'ДЗО', 'Регион', 'Направление', 'Бюджет план, млн ₸', 'Бюджет факт, млн ₸', '% реализации', 'Плановое завершение', 'Ответственный', 'Статус workflow', 'Уровень риска', 'Источник финансирования'],
        list.map(p => [p.id, p.code, p.name, p.dzoName, p.region, p.direction, p.budget, p.spent, p.progress, fdate(p.planEnd), p.resp.short, p.wfLabel, p.risk, DB.FUNDING[p.funding].label]));
      toast(`Выгружено ${list.length} проектов`);
    };
    const ib = document.getElementById('btnImport'); if (ib) ib.onclick = () => Importer.open();
    const nb = document.getElementById('btnNew');
    if (nb) nb.onclick = () => Pages2.projectForm();
    render();
  }

  function project(id) {
    const p = PROJECTS.find(x => x.id === +id);
    if (!p) { view().innerHTML = '<div class="empty">Проект не найден</div>'; return; }
    const remain = p.budget - p.spent;
    const daysLeft = daysBetween(TODAY, p.planEnd);
    const timePct = Math.max(0, Math.min(100, (TODAY - p.start) / (p.planEnd - p.start) * 100));
    const docs = DOCUMENTS.filter(d => d.projectId === p.id).slice(0, 6);
    const openRisks = p.risks.filter(r => r.status !== 'Устранён').length;
    const statusText = p.status === 'Завершено' ? 'Объект введён в эксплуатацию' : p.overdue ? `Просрочен на ${-daysLeft} дн.` : p.status === 'На контроле' ? 'Работы завершены, идёт приёмка' : `До завершения ${daysLeft} дн.`;

    view().innerHTML = `
      <div class="row mb16"><button class="btn btn-ghost btn-sm" onclick="history.length > 1 ? history.back() : location.hash='#/projects'">${icon('arrowL')}Назад к реестру</button>

              <div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="lbl">Реализация проекта</span><span class="lbl">Истекло времени: ${Math.round(timePct)}%</span></div>
              <div class="big-progress"><span style="width:${p.progress}%"></span><i class="marker" style="left:${timePct}%" title="Истекшее время"></i></div>

          <div><div class="l">${p.infra ? '% строительно-монтажных работ' : '% выполнения мероприятий'}</div><div class="v">${p.infra ? p.smr : p.progress}%</div><div class="s">${p.infra ? 'по данным технадзора' : 'по отчёту исполнителя'}</div></div>
          <div><div class="l">Плановая дата завершения</div><div class="v ${p.overdue ? 'text-bad' : ''}">${fdate(p.planEnd)}</div><div class="s">фактический статус: ${p.status.toLowerCase()}</div></div>

              ${[[p.resp, 'Ответственный за проект, КЦ'], [p.curator, 'Куратор от социального блока'], [p.tech, p.infra ? 'Технический надзор' : 'Мониторинг показателей'], [{ name: DZO_BY_ID[p.dzo].head, short: DZO_BY_ID[p.dzo].head }, `Представитель ${p.dzoShort}`]].map(([x, r]) => `<div class="person"><div class="av">${initials(x.name)}</div><div><div class="nm">${x.name}</div><div class="rl">${r}</div></div></div>`).join('')}
            </div></div></div>
          <div class="card"><div class="card-head"><h3>Финансирование</h3><span class="hint">млн ₸</span></div>
            <div class="card-body"><div class="chart-box short" style="height:180px"><canvas id="pFin"></canvas></div>
            ${legend([[cssVar('--c-plan'), 'План освоения'], [cssVar('--c1'), 'Факт освоения']])}</div></div>
        </div>
      </div>`;

    // financing chart (quarters from start)
    const s = monthIdx(p.start), e = Math.max(monthIdx(p.planEnd), monthIdx(TODAY) > monthIdx(p.planEnd) && p.status !== 'Завершено' ? monthIdx(TODAY) : 0);
    const cnt = e - s + 1;
    const mm = monthly([p], s, cnt);
    let cp = 0, cf = 0;
    const labels = [], plan = [], fact = [];
    for (let i = 0; i < cnt; i++) {
      const mi = s + i; cp += mm.plan[i]; if (mm.fact[i] != null) cf += mm.fact[i];
      labels.push(MONTHS[mi % 12] + ' ' + String(Math.floor(mi / 12)).slice(2));
      plan.push(Math.round(cp * 10) / 10); fact.push(mm.fact[i] == null ? null : Math.round(cf * 10) / 10);
    }
    makeChart('pFin', {
      type: 'line',
      data: { labels, datasets: [
        { label: 'План', data: plan, borderColor: cssVar('--c-plan'), borderWidth: 2, pointRadius: 0, borderDash: [4, 4], tension: .2 },
        { label: 'Факт', data: fact, borderColor: cssVar('--c1'), backgroundColor: cssVar('--c1') + '22', fill: true, borderWidth: 2, pointRadius: 0, tension: .2 }
      ] },
      options: Object.assign(baseOptions(), { interaction: { mode: 'index', intersect: false }, scales: axes({ x: { ticks: { maxTicksLimit: 6, color: cssVar('--text-2'), font: { size: 10 } } } }), plugins: Object.assign(baseOptions().plugins, { tooltip: tooltipMoney() }) })
    });

    view().querySelectorAll('[data-doc]').forEach(tr => tr.onclick = () => docModal(+tr.dataset.doc));
    document.getElementById('pAsk').onclick = () => window.AI && AI.ask(`Проект ${p.code}`);
    document.getElementById('pPrint').onclick = () => { window.print(); };
    document.getElementById('addRisk').onclick = () => {
      openModal({ title: 'Регистрация риска', sub: p.name, body: `
        <div class="grid" style="grid-template-columns:1fr 1fr">
          <div class="field" style="grid-column:1/-1"><label>Описание риска / проблемы</label><input class="input" id="rText" placeholder="Кратко опишите риск"></div>
          <div class="field"><label>Уровень риска</label><select class="select" id="rLevel">${RISKS.map(r => `<option>${r}</option>`).join('')}</select></div>
          <div class="field"><label>Ответственный</label><select class="select" id="rOwner">${DB.PEOPLE.map(x => `<option>${x.short}</option>`).join('')}</select></div>
          <div class="field"><label>Срок устранения</label><input class="input" type="date" id="rDue" value="${DB.addDays(TODAY, 14).toISOString().slice(0, 10)}"></div>
        </div>`,
        foot: `<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="rSave">Добавить</button>` });
      document.getElementById('rSave').onclick = () => {
        const text = document.getElementById('rText').value.trim() || 'Новый риск';
        p.risks.unshift({ text, level: document.getElementById('rLevel').value, owner: document.getElementById('rOwner').value, due: new Date(document.getElementById('rDue').value + 'T00:00:00'), status: 'Открыт' });
        closeModal(); toast('Риск зарегистрирован'); project(id);
      };
    };
    bindGo(view());
    return p;
  }

  function pager(page, pages, total, per) {
    if (pages <= 1) return `<span>Всего: ${total}</span><span></span>`;
    const btns = [];
    for (let i = 1; i <= pages; i++) if (i === 1 || i === pages || Math.abs(i - page) <= 1) btns.push(i); else if (btns[btns.length - 1] !== '…') btns.push('…');
    return `<span>${(page - 1) * per + 1}–${Math.min(page * per, total)} из ${total}</span><span class="row">
      <button class="btn btn-sm" data-page="${Math.max(1, page - 1)}" ${page === 1 ? 'disabled' : ''}>${icon('chevL')}</button>
      ${btns.map(b => b === '…' ? '<span class="text-muted">…</span>' : `<button class="btn btn-sm ${b === page ? 'btn-primary' : ''}" data-page="${b}">${b}</button>`).join('')}
      <button class="btn btn-sm" data-page="${Math.min(pages, page + 1)}" ${page === pages ? 'disabled' : ''}>${icon('chevR')}</button></span>`;
  }
  function charityModal(id) {
    const c = CHARITY.find(x => x.id === id); if (!c) return;
    const rej = c.status === 'Отклонено';
    const steps = CH_STAGES.map((s, i) => {
      let cls = '';
      if (rej) cls = i < c.stage ? 'done' : i === c.stage ? 'rejected' : '';
      else cls = i < c.stage || c.stage >= 8 ? 'done' : i === c.stage ? 'current' : '';
      return `<div class="st ${cls}">Этап ${i + 1}<b>${s}</b></div>`;
    }).join('');
    const hist = [];
    const lim = rej ? c.stage : Math.min(c.stage, 7);
    for (let i = 0; i <= lim; i++) hist.push({ d: DB.addDays(c.date, Math.round(i * 6.5)), t: CH_STAGES[i], cur: i === lim });
    if (rej) hist.push({ d: DB.addDays(c.date, Math.round(c.stage * 6.5) + 3), t: `Отказ: ${c.rejectReason}`, cur: true });
    openModal({
      title: esc(c.org), sub: `${c.id} · ${c.type} помощь · ${c.direction}`, width: 820,
      body: `<div class="section-title">Статус рассмотрения</div><div class="stepper">${steps}</div>
        ${rej ? `<div class="notice bad mt16">${icon('x')}<span><b>Обращение отклонено.</b> ${c.rejectReason}</span></div>` : ''}
        ${!rej && c.stage < 5 && c.deadline < TODAY ? `<div class="notice bad mt16">${icon('clock')}<span><b>Нарушен срок рассмотрения</b> (до ${fdate(c.deadline)})</span></div>` : ''}
        <div class="cols-2 mt16">
          <div><div class="section-title">Сведения об обращении</div><div class="dl">
            <div class="k">Заявитель</div><div class="v">${c.applicant}</div>
            <div class="k">Организация</div><div class="v">${esc(c.org)}</div>
            <div class="k">Цель</div><div class="v">${esc(c.purpose)}</div>
            <div class="k">Регион</div><div class="v">${c.region}</div>
            <div class="k">Запрошенная сумма</div><div class="v">${money(c.amount)}</div>
            <div class="k">Дата обращения</div><div class="v">${fdate(c.date)}</div>
            <div class="k">Решение комиссии</div><div class="v">${c.decision === '—' ? '—' : statusBadge(c.decision)}</div>
            <div class="k">Ответственный</div><div class="v">${c.responsible}</div>
          </div></div>
          <div><div class="section-title">История</div><div class="history">${hist.map(h => `<div class="h ${h.cur ? 'cur' : ''}"><div>${h.t}</div><div class="d">${fdate(h.d)}</div></div>`).join('')}</div></div>
        </div>`,
      foot: `<button class="btn" data-close>Закрыть</button>${!rej && c.stage < 8 ? `<button class="btn btn-primary" id="chNext">Перевести: ${c.stage + 1 < 8 ? CH_STAGES[c.stage + 1] : 'Исполнено'} ${icon('arrowRight')}</button>` : ''}`
    });
    if (window.KBUI) KBUI.appealAnalogs(c); // автоматический поиск исторических аналогов в базе знаний
    const nb = document.getElementById('chNext');
    if (nb) nb.onclick = () => {
      c.stage++; c.status = c.stage >= 8 ? 'Исполнено' : CH_STAGES[c.stage];
      c.decision = c.stage >= 5 ? 'Одобрено' : c.stage === 4 ? 'Ожидает заседания' : '—';
      toast(`Обращение ${c.id}: ${c.status}`); charityModal(id);
      if (location.hash.startsWith('#/charity')) charity();
    };
  }

  function supportModal(id) {
    const s = SUPPORT.find(x => x.id === id); if (!s) return;
    const rej = s.status === 'Отклонено';
    const steps = SUP_STAGES.map((st, i) => `<div class="st ${rej ? (i < s.stage ? 'done' : i === s.stage ? 'rejected' : '') : (i < s.stage || (i === 3 && s.stage === 3) ? 'done' : i === s.stage ? 'current' : '')}">Этап ${i + 1}<b>${rej && i === s.stage ? 'Отклонено' : st}</b></div>`).join('');
    const hist = [];
    for (let i = 0; i <= s.stage; i++) hist.push({ d: DB.addDays(s.date, i * 5), t: rej && i === s.stage ? 'Отказ: не подтверждено основание для выплаты' : ['Обращение зарегистрировано', 'Передано на рассмотрение комиссии ДЗО', 'Согласовано руководством', 'Выплата произведена на карт-счёт работника'][i] });
    openModal({
      title: s.type, sub: `${s.id} · ${fdate(s.date)}`,
      body: `<div class="section-title">Статус обращения</div><div class="stepper">${steps}</div>
        <div class="cols-2 mt16"><div><div class="section-title">Заявитель</div><div class="dl">
          <div class="k">Работник</div><div class="v">${s.employee}</div>

          <div class="k">Ответственный</div><div class="v">${s.responsible}</div>

        <div><div class="section-title">История</div><div class="history">${hist.map((h, i) => `<div class="h ${i === hist.length - 1 ? 'cur' : ''}"><div>${h.t}</div><div class="d">${fdate(h.d)}</div></div>`).join('')}</div></div></div>`,
      foot: `<button class="btn" data-close>Закрыть</button>${!rej && s.stage < 3 ? `<button class="btn btn-primary" id="supNext">Перевести: ${SUP_STAGES[s.stage + 1]} ${icon('arrowRight')}</button>` : ''}`
    });
    const b = document.getElementById('supNext');
    if (b) b.onclick = () => { s.stage++; s.status = SUP_STAGES[s.stage]; toast(`Обращение ${s.id}: ${s.status}`); supportModal(id); if (location.hash.startsWith('#/support')) support(); };
  }

      const byStatus = base.filter(d => !f.cat || d.category === f.cat);
      const list = byCat.filter(d => !f.cat || d.category === f.cat);
      document.getElementById('pipe').innerHTML = DOC_STATUSES.map((s, i) => `<div class="pipe ${f.status === i ? 'active' : ''}" data-st="${i}"><div class="pl">${s}</div><div class="pv">${byStatus.filter(d => d.statusIdx === i).length}</div></div>`).join('');
      document.getElementById('catTabs').innerHTML = `<button class="cat-tab ${!f.cat ? 'active' : ''}" data-cat="">Все <span>${byCat.length}</span></button>` +
        DOC_CATS.map(c => `<button class="cat-tab ${f.cat === c ? 'active' : ''}" data-cat="${c}">${c} <span>${byCat.filter(d => d.category === c).length}</span></button>`).join('');
      document.getElementById('docBody').innerHTML = list.slice(0, 40).map(d => {
        const late = d.statusIdx <= 2 && d.due < TODAY;
        return `<tr class="clickable" data-doc="${d.id}"><td class="nowrap muted num">${d.number}</td>
          <td class="t-name"><div>${esc(d.title)}</div><div class="t-sub">${d.projectId ? PROJECTS.find(p => p.id === d.projectId).code + ' · ' : ''}${DZO_BY_ID[d.dzo].short} · ${d.format}, ${d.size}</div></td>
          <td class="nowrap">${d.category}</td><td class="nowrap num">${fdate(d.date)}</td><td class="nowrap">${d.author}</td>
          <td class="nowrap num ${late ? 'overdue' : ''}">${d.statusIdx <= 2 ? fdate(d.due) : '—'}</td><td>${statusBadge(DOC_STATUSES[d.statusIdx])}</td></tr>`;
      }).join('') || `<tr><td colspan="7"><div class="empty">Документы не найдены</div></td></tr>`;
      const late = list.filter(d => d.statusIdx <= 2 && d.due < TODAY).length;
      document.getElementById('docFoot').innerHTML = `<span>Показано ${Math.min(40, list.length)} из ${list.length}</span><span>${late ? `<span class="text-bad fw6">${late} с истёкшим сроком обработки</span>` : 'Просроченных нет'}</span>`;
      document.querySelectorAll('[data-st]').forEach(el => el.onclick = () => { const i = +el.dataset.st; f.status = f.status === i ? null : i; render(); });
      document.querySelectorAll('[data-cat]').forEach(el => el.onclick = () => { f.cat = el.dataset.cat; render(); });
      document.querySelectorAll('[data-doc]').forEach(tr => tr.onclick = () => docModal(+tr.dataset.doc, render));
    };
    document.getElementById('docQ').oninput = (e) => { f.q = e.target.value; render(); };
    document.getElementById('docDzo').onchange = (e) => { f.dzo = e.target.value; render(); };
    document.getElementById('docReset').onclick = () => { Object.assign(f, { q: '', cat: '', status: null, dzo: '' }); documents(); };
    document.getElementById('docUp').onclick = () => {
      openModal({ title: 'Загрузка документа', body: `<div class="grid" style="grid-template-columns:1fr 1fr">
        <div class="field" style="grid-column:1/-1"><label>Наименование</label><input class="input" id="dTitle" placeholder="Наименование документа"></div>
        <div class="field"><label>Категория</label><select class="select" id="dCat">${DOC_CATS.map(c => `<option>${c}</option>`).join('')}</select></div>
        <div class="field"><label>Проект</label><select class="select" id="dProj"><option value="">— без привязки —</option>${PROJECTS.map(p => `<option value="${p.id}">${p.code} — ${esc(p.name.slice(0, 50))}</option>`).join('')}</select></div>
        <div class="field" style="grid-column:1/-1"><label>Файл</label><input class="input" type="file" style="padding-top:6px"></div></div>`,
        foot: `<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="dSave">Зарегистрировать</button>` });
      document.getElementById('dSave').onclick = () => {
        const pid = +document.getElementById('dProj').value || null;
        const cat = document.getElementById('dCat').value;
        const file = document.querySelector('#modalRoot input[type=file]').files[0];
        const pr = pid ? PROJECTS.find(p => p.id === pid) : null;
        const ok = UI.act(() => Core.addDocument(pr, { title: document.getElementById('dTitle').value.trim() || (file ? file.name : 'Новый документ'), category: cat, format: file ? (file.name.split('.').pop() || 'PDF').toUpperCase() : 'PDF', size: file ? Math.max(1, Math.round(file.size / 1024)) + ' КБ' : '—' }));
        if (ok) { closeModal(); toast('Документ зарегистрирован со статусом «Получен»'); render(); }
      };
    };
    render();
  }
  function docModal(id, onChange) {
    const d = DOCUMENTS.find(x => x.id === id); if (!d) return;
    const p = d.projectId ? PROJECTS.find(x => x.id === d.projectId) : null;
    openModal({
      title: esc(d.title), sub: `${d.number} · ${d.category}`,
      body: `<div class="section-title">Статус документа</div>
        <div class="stepper">${DOC_STATUSES.map((s, i) => `<div class="st ${i < d.statusIdx || (i === 4 && d.statusIdx === 4) ? 'done' : i === d.statusIdx ? 'current' : ''}">${i + 1}<b>${s}</b></div>`).join('')}</div>
        <div class="section-title">Реквизиты</div><div class="dl">
          <div class="k">Регистрационный №</div><div class="v">${d.number}</div>
          <div class="k">Категория</div><div class="v">${d.category}</div>
          <div class="k">Дата регистрации</div><div class="v">${fdate(d.date)}</div>
          <div class="k">Исполнитель</div><div class="v">${d.author}</div>
          <div class="k">Срок обработки</div><div class="v ${d.statusIdx <= 2 && d.due < TODAY ? 'text-bad' : ''}">${fdate(d.due)}</div>
          <div class="k">ДЗО</div><div class="v">${DZO_BY_ID[d.dzo].name}</div>
          <div class="k">Проект</div><div class="v">${p ? `<a href="#/project/${p.id}" data-close>${p.code} — ${esc(p.name)}</a>` : '—'}</div>
          <div class="k">Файл</div><div class="v">${d.format} · ${d.size}</div>
        </div>`,
      foot: `<button class="btn" data-close>Закрыть</button>${d.statusIdx < 4 ? `<button class="btn btn-primary" id="docNext">Перевести: ${DOC_STATUSES[d.statusIdx + 1]} ${icon('arrowRight')}</button>` : ''}`
    });
    const b = document.getElementById('docNext');
    if (b) b.onclick = () => { d.statusIdx++; toast(`${d.number}: ${DOC_STATUSES[d.statusIdx]}`); docModal(id, onChange); onChange && onChange(); };
  }

  /* =====================================================================
     CALENDAR
     ===================================================================== */
  function evItem(e) {
    const color = EVENT_TYPES[e.type].color;
    return `<div class="ev-item ${e.overdue ? 'overdue' : ''}" style="border-left-color:${e.overdue ? 'var(--bad)' : color}" data-ev="${EVENTS.indexOf(e)}">
      <div class="ev-date"><b>${e.date.getDate()}</b><span>${MONTHS[e.date.getMonth()]}</span></div>
      <div><div class="ev-title">${esc(e.title)}</div><div class="ev-meta"><span>${EVENT_TYPES[e.type].label}</span>${e.meta ? `<span>· ${esc(e.meta)}</span>` : ''}${e.overdue ? `<span class="badge b-bad">Просрочено ${daysBetween(e.date, TODAY)} дн.</span>` : e.done ? '<span class="badge b-ok">Выполнено</span>' : ''}</div></div></div>`;
  }
  function bindEvItems(root) {
    root.querySelectorAll('[data-ev]').forEach(el => el.onclick = () => {
      const e = EVENTS[+el.dataset.ev];
      if (e.projectId) go('#/project/' + e.projectId);
      else if (e.charityId) charityModal(e.charityId);
      else if (e.supportId) supportModal(e.supportId);
      else openModal({ title: esc(e.title), sub: `${EVENT_TYPES[e.type].label} · ${fdateLong(e.date)}`, body: `<div class="dl"><div class="k">Дата</div><div class="v">${fdateLong(e.date)}</div><div class="k">Тип</div><div class="v">${EVENT_TYPES[e.type].label}</div><div class="k">Место / ответственные</div><div class="v">${esc(e.meta || '—')}</div><div class="k">Статус</div><div class="v">${e.overdue ? statusBadge('Просрочено') : e.done ? statusBadge('Выполнено') : statusBadge('Запланировано')}</div></div>`, foot: `<button class="btn" data-close>Закрыть</button>${!e.done ? '<button class="btn btn-primary" id="evDone">Отметить выполненным</button>' : ''}` });
      const b = document.getElementById('evDone');
      if (b) b.onclick = () => { e.done = true; e.overdue = false; closeModal(); toast('Событие отмечено выполненным'); if (location.hash.startsWith('#/calendar')) calendar(); };
    });
  }
  function calendar() {
    const c = STATE.cal;
    const visible = EVENTS.filter(e => !c.off[e.type]);
    const overdue = visible.filter(e => e.overdue);
    const first = new Date(c.y, c.m, 1);
    const startDow = (first.getDay() + 6) % 7;
    const gridStart = DB.addDays(first, -startDow);
    const cells = [];
    for (let i = 0; i < 42; i++) cells.push(DB.addDays(gridStart, i));
    const rows = cells[35].getMonth() !== c.m ? 35 : 42;
    const key = (dt) => dt.getFullYear() + '-' + dt.getMonth() + '-' + dt.getDate();
    const byDay = {};
    visible.forEach(e => { const k = key(e.date); (byDay[k] = byDay[k] || []).push(e); });
    const selEvents = byDay[key(c.sel)] || [];
    const monthEvents = visible.filter(e => e.date.getFullYear() === c.y && e.date.getMonth() === c.m);

    view().innerHTML = `
      <div class="page-head"><div><h1>Календарь контроля</h1><div class="sub">Сроки проектов, заседания комиссии, контрольные точки, отчётность и дедлайны по обращениям</div></div>
        <div class="page-actions cal-types">${Object.entries(EVENT_TYPES).map(([k, t]) => `<button class="type-toggle ${c.off[k] ? 'off' : ''}" data-t="${k}"><i style="background:${t.color}"></i>${t.label}</button>`).join('')}</div></div>
      <div class="kpis k4">
        ${kpi({ label: 'Событий в месяце', value: monthEvents.length, ico: 'calendar', color: 'var(--navy-2)' })}
        ${kpi({ label: 'Просрочено', value: overdue.length, ico: 'alert', color: 'var(--bad)', foot: 'требуют реакции' })}
        ${kpi({ label: 'Ближайшие 7 дней', value: visible.filter(e => e.date >= TODAY && e.date <= DB.addDays(TODAY, 7) && !e.done).length, ico: 'clock', color: 'var(--st-ctrl)' })}
        ${kpi({ label: 'Заседание комиссии', value: fdate(EVENTS.find(e => e.type === 'commission' && e.date >= TODAY).date), ico: 'gavel', color: 'var(--c7)', foot: 'ближайшее' })}
      </div>
      <div class="cal-layout">
        <div class="card" style="overflow:hidden">
          <div class="cal-head"><h3>${MONTHS_FULL[c.m]} ${c.y}</h3>
            <div class="cal-nav"><button class="btn btn-sm" id="calToday">Сегодня</button><button class="icon-btn" id="calPrev">${icon('chevL')}</button><button class="icon-btn" id="calNext">${icon('chevR')}</button></div></div>
          <div class="cal-grid">
            ${['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].map(d => `<div class="cal-dow">${d}</div>`).join('')}
            ${cells.slice(0, rows).map(dt => {
              const evs = byDay[key(dt)] || [];
              const cls = [dt.getMonth() !== c.m ? 'other' : '', key(dt) === key(TODAY) ? 'today' : '', key(dt) === key(c.sel) ? 'sel' : ''].join(' ');
              const sorted = evs.slice().sort((a, b) => b.overdue - a.overdue);
              return `<div class="cal-cell ${cls}" data-day="${dt.getTime()}"><div class="cal-day">${dt.getDate()}</div>
                ${sorted.slice(0, 3).map(e => `<span class="cal-ev ${e.overdue ? 'overdue' : ''} ${e.done ? 'done' : ''}" style="border-left-color:${e.overdue ? 'var(--bad)' : EVENT_TYPES[e.type].color}" title="${esc(e.title)}">${esc(e.title.replace(/^(Срок завершения|Промежуточный контроль|Завершён): /, ''))}</span>`).join('')}
                ${evs.length > 3 ? `<div class="cal-more">+${evs.length - 3} ещё</div>` : ''}</div>`;
            }).join('')}
          </div>
        </div>
        <div class="stack">
          <div class="card"><div class="card-head"><h3>${fdateLong(c.sel)}</h3><span class="hint">${selEvents.length} ${plural(selEvents.length, 'событие', 'события', 'событий')}</span></div>
            <div class="card-body"><div class="ev-list">${selEvents.map(evItem).join('') || '<div class="empty" style="padding:20px">Нет событий на выбранную дату</div>'}</div></div></div>
          <div class="card"><div class="card-head"><h3 class="text-bad">Просроченные события</h3><span class="badge b-bad">${overdue.length}</span></div>
            <div class="card-body" style="max-height:420px;overflow-y:auto"><div class="ev-list">${overdue.slice().sort((a, b) => a.date - b.date).map(evItem).join('') || '<div class="empty">Нет просроченных событий</div>'}</div></div></div>
        </div>
      </div>`;
    document.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { c.off[b.dataset.t] = !c.off[b.dataset.t]; calendar(); });
    document.querySelectorAll('[data-day]').forEach(el => el.onclick = () => {
      const dt = new Date(+el.dataset.day); c.sel = dt;
      if (dt.getMonth() !== c.m) { c.m = dt.getMonth(); c.y = dt.getFullYear(); }
      calendar();
    });
    document.getElementById('calPrev').onclick = () => { c.m--; if (c.m < 0) { c.m = 11; c.y--; } calendar(); };
    document.getElementById('calNext').onclick = () => { c.m++; if (c.m > 11) { c.m = 0; c.y++; } calendar(); };
    document.getElementById('calToday').onclick = () => { c.m = TODAY.getMonth(); c.y = TODAY.getFullYear(); c.sel = new Date(TODAY); calendar(); };
    bindEvItems(view());
  }

  /* =====================================================================
     ANALYTICS
     ===================================================================== */
  function analytics() {
    const per = STATE.an.period;
    const Y = per === 'all' ? null : +per;
    const inPeriod = (p) => !Y || (p.start.getFullYear() <= Y && p.planEnd.getFullYear() >= Y);
    const ps = PROJECTS.filter(inPeriod);
    const ch = CHARITY.filter(c => !Y || c.date.getFullYear() === Y);
    const sp = SUPPORT.filter(s => !Y || s.date.getFullYear() === Y);
    const budget = sum(ps, 'budget'), spent = sum(ps, 'spent');
    const periodLabel = Y ? `${Y} год` : '2024–2026';

    view().innerHTML = `
      <div class="page-head"><div><h1>Аналитика</h1><div class="sub">Интерактивная аналитика по портфелю социальных проектов и обращениям · ${periodLabel}</div></div>
        <div class="page-actions"><div class="seg" id="anSeg">${['2024', '2025', '2026', 'all'].map(v => `<button data-p="${v}" class="${per === v ? 'active' : ''}">${v === 'all' ? 'Весь период' : v}</button>`).join('')}</div></div></div>
      <div class="kpis">
        ${kpi({ label: 'Проектов в периоде', value: ps.length, ico: 'folder', color: 'var(--navy-2)', foot: Y ? 'реализуемых в течение года' : 'весь портфель' })}
        ${kpi({ label: 'Бюджет', value: money(budget).replace(/ (млн|млрд) ₸/, ''), unit: budget >= 1000 ? ' млрд ₸' : ' млн ₸', ico: 'wallet', color: 'var(--sky)' })}
        ${kpi({ label: 'Освоение', value: budget ? Math.round(spent / budget * 100) : 0, unit: '%', ico: 'trend', color: 'var(--st-done)', bar: budget ? spent / budget * 100 : 0, foot: money(spent) })}
        ${kpi({ label: 'Благотвор. обращений', value: ch.length, ico: 'heart', color: 'var(--c5)', foot: money(sum(ch.filter(c => c.decision === 'Одобрено'), 'amount')) + ' одобрено' })}
        ${kpi({ label: 'Обращений работников', value: sp.length, ico: 'users', color: 'var(--c7)', foot: money(sum(sp.filter(s => s.status === 'Выплачено'), 'amount')) + ' выплачено' })}
      </div>
      <div class="cols-2 mb16">
        <div class="card"><div class="card-head"><h3>Проекты по регионам</h3><span class="hint">количество</span></div><div class="card-body"><div class="chart-box"><canvas id="aReg"></canvas></div></div></div>
        <div class="card"><div class="card-head"><h3>Проекты по направлениям</h3><span class="hint">количество</span></div><div class="card-body"><div class="chart-box"><canvas id="aDir"></canvas></div></div></div>
      </div>
      <div class="cols-2 mb16">
        <div class="card"><div class="card-head"><h3>Бюджеты и освоение по ДЗО</h3><span class="hint">млн ₸</span></div><div class="card-body"><div class="chart-box"><canvas id="aBud"></canvas></div>${legend([[cssVar('--c-plan'), 'Бюджет'], [cssVar('--c1'), 'Освоено']])}</div></div>
        <div class="card"><div class="card-head"><h3>Уровень освоения по направлениям</h3><span class="hint">% от бюджета</span></div><div class="card-body"><div class="chart-box"><canvas id="aOsv"></canvas></div></div></div>
      </div>
      <div class="card mb16"><div class="card-head"><h3>Динамика реализации</h3><span class="hint">освоение, млн ₸ · ${Y ? 'по месяцам' : 'по кварталам'}</span></div>
        <div class="card-body"><div class="chart-box"><canvas id="aDyn"></canvas></div>${legend([[cssVar('--c-plan'), 'План освоения'], [cssVar('--c1'), 'Факт освоения']])}</div></div>
      <div class="cols-3 mb16">
        <div class="card"><div class="card-head"><h3>Количество обращений</h3><span class="hint">${Y ? 'по месяцам' : 'по кварталам'}</span></div><div class="card-body"><div class="chart-box"><canvas id="aApp"></canvas></div>${legend([[cssVar('--c1'), 'Соц. поддержка работников'], [cssVar('--c2'), 'Благотворительность']])}</div></div>
        <div class="card"><div class="card-head"><h3>Благотворительность по направлениям</h3><span class="hint">одобрено, млн ₸</span></div><div class="card-body"><div class="chart-box short" style="height:190px"><canvas id="aCh"></canvas></div><div id="aChLeg" class="mt16"></div></div></div>
        <div class="card"><div class="card-head"><h3>Количество проектов по ДЗО</h3><span class="hint">по статусам</span></div><div class="card-body"><div class="chart-box"><canvas id="aDzo"></canvas></div>${legend(STATUSES.map(s => [statusColor(s), s]))}</div></div>
      </div>
      <div id="anWf"></div>`;

    document.querySelectorAll('#anSeg button').forEach(b => b.onclick = () => { STATE.an.period = b.dataset.p; analytics(); });

    const byReg = countBy(ps, 'region');
    const regs = Object.keys(byReg).sort((a, b) => byReg[b] - byReg[a]);
    hbar('aReg', regs.map(shortRegion), regs.map(r => byReg[r]), { onClick: (i) => { Object.assign(STATE.reg, blankReg(), { region: regs[i] }); go('#/projects'); } });
    const byDir = countBy(ps, 'direction');
    const dirs = Object.keys(byDir).sort((a, b) => byDir[b] - byDir[a]);
    hbar('aDir', dirs, dirs.map(d => byDir[d]), { color: cssVar('--c1'), onClick: (i) => { Object.assign(STATE.reg, blankReg(), { direction: dirs[i] }); go('#/projects'); } });

    const dz = DZO.map(z => ({ z, b: sum(ps.filter(p => p.dzo === z.id), 'budget'), s: sum(ps.filter(p => p.dzo === z.id), 'spent') })).filter(x => x.b > 0).sort((a, b) => b.b - a.b);
    makeChart('aBud', {
      type: 'bar', data: { labels: dz.map(x => x.z.short), datasets: [
        { label: 'Бюджет', data: dz.map(x => Math.round(x.b * 10) / 10), backgroundColor: cssVar('--c-plan'), ...barStyle },
        { label: 'Освоено', data: dz.map(x => Math.round(x.s * 10) / 10), backgroundColor: cssVar('--c1'), ...barStyle }] },
      options: Object.assign(baseOptions(), { interaction: { mode: 'index', intersect: false }, scales: axes(), plugins: Object.assign(baseOptions().plugins, { tooltip: tooltipMoney() }),
        onClick: (e, els) => { if (els.length) go('#/dzo/' + dz[els[0].index].z.id); } })
    });
    const osv = DIRECTIONS.map(d => { const l = ps.filter(p => p.direction === d); const b = sum(l, 'budget'); return { d, v: b ? Math.round(sum(l, 'spent') / b * 100) : 0, b }; }).filter(x => x.b > 0).sort((a, b) => b.v - a.v);
    hbar('aOsv', osv.map(x => x.d), osv.map(x => x.v), { fmt: (v) => v + '%', max: 100, color: cssVar('--c3') });

    // dynamics
    let labels, plan, fact;
    if (Y) {
      const m = monthly(PROJECTS, Y * 12, 12); labels = MONTHS; plan = m.plan; fact = m.fact;
    } else {
      const m = monthly(PROJECTS, 2024 * 12, 36); plan = quarterize(m.plan); fact = quarterize(m.fact);
      labels = []; for (let y = 2024; y <= 2026; y++) for (let q = 1; q <= 4; q++) labels.push(`${['I', 'II', 'III', 'IV'][q - 1]} кв. ${y}`);
    }
    makeChart('aDyn', {
      type: 'line', data: { labels, datasets: [
        { label: 'План', data: plan, borderColor: cssVar('--c-plan'), borderDash: [5, 4], borderWidth: 2, pointRadius: 3, pointBackgroundColor: cssVar('--c-plan'), tension: .25 },
        { label: 'Факт', data: fact, borderColor: cssVar('--c1'), backgroundColor: cssVar('--c1') + '1f', fill: true, borderWidth: 2, pointRadius: 3, pointBackgroundColor: cssVar('--c1'), tension: .25 }] },
      options: Object.assign(baseOptions(), { interaction: { mode: 'index', intersect: false }, scales: axes(), plugins: Object.assign(baseOptions().plugins, { tooltip: tooltipMoney() }) })
    });

    // appeals
    const bucket = (dt) => Y ? dt.getMonth() : (dt.getFullYear() - 2024) * 4 + Math.floor(dt.getMonth() / 3);
    const nB = Y ? 12 : 12;
    const aS = Array(nB).fill(0), aC = Array(nB).fill(0);
    sp.forEach(s => { const b = bucket(s.date); if (b >= 0 && b < nB) aS[b]++; });
    ch.forEach(c => { const b = bucket(c.date); if (b >= 0 && b < nB) aC[b]++; });
    const aLabels = Y ? MONTHS : labels.map(l => l.replace(' кв. 20', "'"));
    makeChart('aApp', {
      type: 'bar', data: { labels: aLabels, datasets: [
        { label: 'Соц. поддержка', data: aS, backgroundColor: cssVar('--c1'), ...barStyle, maxBarThickness: 12 },

  <script>
/* Карта Казахстана: области (choropleth) + проекты (кластеры) + выбор координат */
(function () {
  'use strict';
  const { money, esc, cssVar, wfBadge, maps } = UI;
  const KZ_BOUNDS = [[40.4, 46.3], [55.6, 87.4]];
  const RAMP = ['#E8F0FB', '#C7DBF6', '#9EC5F4', '#6DA7EC', '#3987E5', '#1C5CAB', '#0D366B'];

  const isDark = () => document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
  function tiles(map) {
    const style = isDark() ? 'dark_all' : 'light_all';
    L.tileLayer(`https://{s}.basemap.cartocdn.com/${style}/{z}/{x}/{y}{r}.png`, {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>',
      subdomains: 'abcd', maxZoom: 18
    }).addTo(map);
  }
  function offline(el) {
    el.innerHTML = '<div class="map-offline">Картографическая библиотека не загружена. Проверьте подключение к интернету и обновите страницу.</div>';
  }
  function pinColor(p) {
    if (p.overdue) return cssVar('--bad');
    return { DRAFT: cssVar('--st-appr'), SUBMITTED: cssVar('--st-appr'), REVIEW: cssVar('--st-appr'), RETURNED: cssVar('--st-appr'), ACCEPTED: cssVar('--sky'), CONTROL: cssVar('--st-ctrl'), IMPL: cssVar('--st-work'), DONE: cssVar('--st-done'), ARCHIVE: cssVar('--muted') }[p.wf];
  }
  function popupHtml(p) {
    return `<div class="pop"><h4>${esc(p.name)}</h4>
      <div class="row2"><span>ДЗО</span><span>${p.dzoShort}</span></div>
      <div class="row2"><span>Регион</span><span>${p.region.replace(' область', ' обл.')}</span></div>
      <div class="row2"><span>Бюджет</span><span>${money(p.budget)}</span></div>
      <div class="row2"><span>Реализация</span><span>${p.progress}%</span></div>
      <div class="row2"><span>Статус</span><span>${wfBadge(p.wf)}</span></div>
      <a class="btn btn-primary btn-sm" href="#/project/${p.id}">Открыть проект</a></div>`;
  }
  function stepFor(v, max) { if (!v) return -1; if (max <= 1) return 3; return Math.min(RAMP.length - 1, Math.floor(v / max * (RAMP.length - 0.01))); }

  /**
   * Карта проектов.
   * opts: { onRegion(name), selectedId, regions: true, points: true, activeRegion }
   */
  function projectsMap(elId, projects, opts = {}) {
    const el = document.getElementById(elId);
    if (!el) return null;
    if (!window.L) { offline(el); return null; }
    const map = L.map(el, { zoomControl: true, scrollWheelZoom: opts.scroll !== false, attributionControl: true, minZoom: 3 });
    maps.push(map);
    tiles(map);
    map.fitBounds(KZ_BOUNDS);

    // --- области
    const byReg = {};
    projects.forEach(p => {
      const r = byReg[p.region] = byReg[p.region] || { n: 0, work: 0, done: 0, ctrl: 0, appr: 0, budget: 0, overdue: 0 };
      r.n++; r.budget += p.budget;
      if (p.status === 'В работе') r.work++; else if (p.status === 'Завершено') r.done++; else if (p.status === 'На контроле') r.ctrl++; else r.appr++;
      if (p.overdue) r.overdue++;
    });
    const max = Math.max(0, ...Object.values(byReg).map(r => r.n));
    const zero = isDark() ? '#1B273A' : '#F1F3F6';
    const regionLayer = L.geoJSON(window.KZ_GEO, {
      style: (f) => {
        const r = byReg[f.properties.name];
        const s = stepFor(r ? r.n : 0, max);
        const active = opts.activeRegion === f.properties.name;
        return { color: active ? cssVar('--navy') : (isDark() ? '#2F405B' : '#FFFFFF'), weight: active ? 2.5 : 1, fillColor: s < 0 ? zero : RAMP[s], fillOpacity: isDark() ? 0.55 : 0.78 };
      },
      onEachFeature: (f, layer) => {
        const name = f.properties.name;
        const r = byReg[name];
        layer.bindTooltip(() => `<b>${name}</b>${r ? `<table>
          <tr><td>Всего проектов</td><td>${r.n}</td></tr><tr><td>В работе</td><td>${r.work}</td></tr>
          <tr><td>Завершено</td><td>${r.done}</td></tr><tr><td>На контроле</td><td>${r.ctrl}</td></tr>
          ${r.appr ? `<tr><td>На согласовании</td><td>${r.appr}</td></tr>` : ''}${r.overdue ? `<tr><td>Просрочено</td><td style="color:var(--bad)">${r.overdue}</td></tr>` : ''}
          <tr><td>Бюджет</td><td>${money(r.budget)}</td></tr></table>` : '<span class="text-muted">Нет доступных проектов</span>'}`, { sticky: true, className: 'reg-tip', direction: 'top', offset: [0, -8] });
        layer.on({
          mouseover: (e) => { e.target.setStyle({ weight: 2.5, color: cssVar('--primary') }); e.target.bringToFront(); },
          mouseout: (e) => regionLayer.resetStyle(e.target),
          click: () => { if (opts.onRegion && r) opts.onRegion(name); }
        });
      }
    });
    // подписи количества проектов в областях
    const labels = L.layerGroup();
    regionLayer.eachLayer(layer => {
      const name = layer.feature.properties.name;
      const r = byReg[name]; if (!r) return;
      const c = DB.REGION_CENTER[name] || [layer.getBounds().getCenter().lat, layer.getBounds().getCenter().lng];
      const short = name.replace(' область', '').replace('Западно-Казахстанская', 'ЗКО');
      L.marker([c[0] - 0.9, c[1]], { interactive: false, keyboard: false, icon: L.divIcon({ className: 'reg-lbl', html: `<div class="reg-lbl-in"><b>${r.n}</b> ${short}</div>`, iconSize: [140, 20], iconAnchor: [70, 10] }) }).addTo(labels);
    });

    // --- точки проектов
    const pts = L.markerClusterGroup ? L.markerClusterGroup({
      showCoverageOnHover: false, maxClusterRadius: 42, spiderfyOnMaxZoom: true,
      iconCreateFunction: (c) => L.divIcon({ html: `<div class="mcluster"><span>${c.getChildCount()}</span></div>`, className: '', iconSize: [40, 40] })
    }) : L.layerGroup();
    const markers = {};
    projects.forEach(p => {
      if (p.lat == null || p.lng == null) return;
      const sel = opts.selectedId === p.id;
      const m = L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: `<div class="pin${sel ? ' sel' : ''}" style="background:${pinColor(p)}"></div>`, iconSize: sel ? [26, 26] : [18, 18], iconAnchor: sel ? [13, 13] : [9, 9] }), title: p.name });
      m.bindPopup(popupHtml(p), { maxWidth: 300 });
      if (opts.onPoint) m.on('click', () => opts.onPoint(p));
      markers[p.id] = m;
      pts.addLayer(m);
    });

    if (opts.regions !== false) { regionLayer.addTo(map); labels.addTo(map); }
    if (opts.points !== false) pts.addTo(map);
    const updLabels = () => { const z = map.getZoom(); if (z <= 6 && opts.regions !== false) { if (!map.hasLayer(labels)) labels.addTo(map); } else if (map.hasLayer(labels)) map.removeLayer(labels); };
    map.on('zoomend', updLabels);
    L.control.layers(null, { 'Области (кол-во проектов)': regionLayer, 'Подписи областей': labels, 'Проекты': pts }, { collapsed: true, position: 'topright' }).addTo(map);

    // легенда
    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = () => {
      const d = L.DomUtil.create('div', 'map-legend');
      d.innerHTML = `<b>Проектов в области</b><div class="scale">${RAMP.map(c => `<i style="background:${c}"></i>`).join('')}</div>
        <div class="scale-l"><span>1</span><span>${max || 1}</span></div>
        <div class="pts"><span><i style="background:${cssVar('--st-work')}"></i>В реализации</span><span><i style="background:${cssVar('--st-ctrl')}"></i>На контроле</span>
        <span><i style="background:${cssVar('--st-done')}"></i>Завершен</span><span><i style="background:${cssVar('--st-appr')}"></i>На согласовании</span><span><i style="background:${cssVar('--bad')}"></i>Просрочен</span></div>`;
      L.DomEvent.disableClickPropagation(d);
      return d;
    };
    legend.addTo(map);
    setTimeout(() => { if (map._container && document.body.contains(map._container)) map.invalidateSize(); }, 60);

    function focus(id, zoom = 11) {
      const m = markers[id]; if (!m) return false;
      if (!map._container || !document.body.contains(map._container) || !map._loaded) return false;
      if (pts.zoomToShowLayer) pts.zoomToShowLayer(m, () => { map.setView(m.getLatLng(), Math.max(map.getZoom(), zoom)); m.openPopup(); });
      else { map.setView(m.getLatLng(), zoom); m.openPopup(); }
      return true;
    }
    return { map, focus, markers };
  }

  /** Мини-карта выбора координат */
  function pickerMap(elId, lat, lng, { editable, onPick } = {}) {
    const el = document.getElementById(elId);
    if (!el) return null;
    if (!window.L) { offline(el); return null; }
    const map = L.map(el, { scrollWheelZoom: false });
    maps.push(map);
    tiles(map);
    map.setView([lat, lng], 12);
    const marker = L.marker([lat, lng], { draggable: !!editable, icon: L.divIcon({ className: '', html: `<div class="pin sel" style="background:${cssVar('--primary')}"></div>`, iconSize: [26, 26], iconAnchor: [13, 13] }) }).addTo(map);
    if (editable) {
      const set = (ll) => { marker.setLatLng(ll); onPick && onPick(Math.round(ll.lat * 100000) / 100000, Math.round(ll.lng * 100000) / 100000); };
      map.on('click', (e) => set(e.latlng));
      marker.on('dragend', () => set(marker.getLatLng()));
    }
    setTimeout(() => { if (map._container && document.body.contains(map._container)) map.invalidateSize(); }, 60);
    return { map, marker, move: (a, b) => { marker.setLatLng([a, b]); map.setView([a, b], map.getZoom()); } };
  }

  window.MapKit = { projectsMap, pickerMap };
})();
