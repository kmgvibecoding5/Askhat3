          ${diffs.map(x => `<tr data-same="${x.same ? 1 : 0}"><td class="fw6 small">п. ${x.k}<div class="t-sub">${KB.CLAUSE_TITLES[x.k]}</div>${x.same ? '' : '<span class="badge plain b-warn">изменён</span>'}</td><td class="small">${x.a || '<span class="text-muted">— пункт отсутствует —</span>'}</td><td class="small">${x.b || '<span class="text-muted">— пункт отсутствует —</span>'}</td></tr>`).join('')}
        </tbody></table></div>
        <div class="tbl-foot"><span>Изменено пунктов: ${diffs.filter(x => !x.same).length} из ${keys.length}</span><span><del>удалено</del> · <ins>добавлено</ins></span></div></div>
      <div class="card"><div class="card-head"><h3>Иные ВНД</h3></div><div class="card-body flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>Документ</th><th>Утверждён</th><th>Дата</th><th>Статус</th></tr></thead><tbody>
        ${other.map(d => `<tr class="clickable" data-go="#/kb/doc/${d.id}"><td class="fw6">${esc(d.title)}</td><td class="small">${esc(d.number)}</td><td class="nowrap">${fdate(d.date)}</td><td>${esc(d.status)}</td></tr>`).join('')}
      </tbody></table></div></div></div>`;
    const sync = () => document.querySelectorAll('#rBody tr').forEach(tr => { tr.style.display = document.getElementById('rOnly').checked && tr.dataset.same === '1' ? 'none' : ''; });
    document.getElementById('rOnly').onchange = sync; sync();
    ['rA', 'rB'].forEach(i => document.getElementById(i).onchange = () => { location.hash = `#/kb/rules?a=${document.getElementById('rA').value}&b=${document.getElementById('rB').value}`; });
    PH.bindGo(view());
  }

  /* ---------------- контроль качества ---------------- */
  const qf = { type: '' };
  function qualityPage() {
    if (!KBE.can('quality')) { Pages2.forbidden('Контроль качества данных доступен специалистам КМГ и администраторам.'); return; }
    const I = KBE.quality();
    const types = {}; I.forEach(x => { types[x.type] = (types[x.type] || 0) + 1; });
    const L = I.filter(x => !qf.type || x.type === qf.type);
    view().innerHTML = `${nav('quality')}
      <div class="page-head"><div><h1>Контроль качества данных</h1><div class="sub">Автоматически выявленные дубли, пробелы и противоречия в базе знаний · ${I.length} ${plural(I.length, 'замечание', 'замечания', 'замечаний')}</div></div>
        <div class="page-actions"><button class="btn" id="kqExp">${icon('download')}Экспорт</button></div></div>
      <div class="cat-tabs mb16">${[['', 'Все', I.length]].concat(Object.entries(types)).map(([k, t, n]) => `<button class="cat-tab ${qf.type === k ? 'active' : ''}" data-qt="${esc(k)}">${esc(k ? k : t)} <span>${k ? t : n}</span></button>`).join('')}</div>
      <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>Важность</th><th>Тип</th><th>Описание</th><th>Кейс</th><th>Документы</th></tr></thead><tbody>
        ${L.map(x => `<tr><td>${x.sev === 3 ? '<span class="badge b-bad">высокая</span>' : x.sev === 2 ? '<span class="badge b-warn">средняя</span>' : '<span class="badge b-gray">инфо</span>'}</td><td class="fw6 small">${esc(x.type)}</td><td><div>${esc(x.title)}</div><div class="t-sub">${esc(x.detail)}</div></td><td class="nowrap">${x.caseId ? `<a href="#/kb/case/${x.caseId}">${x.caseId}</a>` : '—'}</td><td class="small">${x.docIds.filter(id => KBE.canDoc(KBE.doc(id))).map(id => `<a href="#/kb/doc/${id}">${esc(KBE.doc(id).number)}</a>`).join(', ') || '—'}</td></tr>`).join('') || '<tr><td colspan="5"><div class="empty">Замечаний нет</div></td></tr>'}
      </tbody></table></div></div>`;
    document.querySelectorAll('[data-qt]').forEach(b => b.onclick = () => { qf.type = b.dataset.qt; qualityPage(); });
    document.getElementById('kqExp').onclick = () => { downloadCSV('kontrol_kachestva_bz.csv', ['Важность', 'Тип', 'Описание', 'Детали', 'Кейс'], L.map(x => [x.sev, x.type, x.title, x.detail, x.caseId || ''])); toast('Отчёт выгружен'); };
  }

  /* ---------------- источники ---------------- */
  function sourcesPage() {
    if (!KBE.can('sources')) { Pages2.forbidden('Управление источниками базы знаний доступно только администратору.'); return; }
    const I = KBE.idx();
    view().innerHTML = `${nav('sources')}
      <div class="page-head"><div><h1>Источники базы знаний</h1><div class="sub">Подключение, синхронизация и индексация источников документов</div></div>
        <div class="page-actions"><button class="btn btn-primary" id="ksIdx">${icon('refresh')}Переиндексировать</button></div></div>
      <div class="notice mb16">${icon('alert')}<span>Демонстрационный режим: интеграции с СЭД Documentolog и системой ВНД не подключены. Синхронизация проверяет индекс по уже загруженным материалам. Для боевого контура требуется серверная интеграция по API источников.</span></div>
      <div class="kpis k4">${PH.kpi({ label: 'Документов в индексе', value: KB.DOCS.length, ico: 'file', color: 'var(--navy-2)' })}${PH.kpi({ label: 'Кейсов', value: KB.CASES.length, ico: 'folder', color: 'var(--sky)' })}${PH.kpi({ label: 'Терминов в индексе', value: I.df.size.toLocaleString('ru-RU'), ico: 'search', color: 'var(--c3)', foot: `построен за ${I.ms} мс` })}${PH.kpi({ label: 'Последняя индексация', value: KBE.indexedAt() ? UI.ftime(KBE.indexedAt()) : '—', ico: 'clock', color: 'var(--c7)', foot: fdate(KBE.indexedAt()) })}</div>
      <div class="card"><div class="table-wrap"><table class="tbl"><thead><tr><th>Источник</th><th>Категории</th><th class="r">Документов</th><th>Последняя синхронизация</th><th>Статус</th><th></th></tr></thead><tbody>
        ${KB.SOURCES.map(s => `<tr><td class="fw6">${esc(s.name)}</td><td class="small">${esc(KB.CATEGORIES[s.id] || (s.id === 'sed' ? KB.CATEGORIES.sed + '; ' + KB.CATEGORIES.concl + '; ' + KB.CATEGORIES.contract : ''))}</td><td class="r num">${KB.DOCS.filter(d => d.category === s.id || (s.id === 'sed' && ['sed', 'concl', 'contract'].includes(d.category))).length}</td><td class="nowrap">${fdate(s.lastSync)}</td><td><span class="badge b-ok">${esc(s.status)}</span></td><td><button class="btn btn-sm" data-sync="${s.id}">Синхронизировать</button></td></tr>`).join('')}
      </tbody></table></div></div>`;
    document.getElementById('ksIdx').onclick = () => { const r = KBE.reindex(); Core.audit('Переиндексация базы знаний', 'База знаний', null, '', `${r.N} объектов`, null); toast(`Индекс перестроен: ${r.N} объектов за ${r.ms} мс`); sourcesPage(); };
    document.querySelectorAll('[data-sync]').forEach(b => b.onclick = () => { const s = KB.SOURCES.find(x => x.id === b.dataset.sync); s.lastSync = new Date(); Core.audit('Синхронизация источника базы знаний', 'База знаний', null, '', s.name, null); KBE.reindex(); toast(`«${s.name}»: новых документов нет, индекс актуален`); sourcesPage(); });
  }

  /* ---------------- AI-ассистент базы знаний ---------------- */
  const asState = { ctx: '', msgs: [] };
  const AS_EX = ['Покажи все аналогичные обращения по футбольным клубам за 2024–2026 годы', 'Какие решения принимались по обращениям акиматов Мангистауской области?', 'Были ли ранее обращения по этому заявителю?', 'Какие основания для отказа применялись по аналогичным проектам?', 'Какие решения принимались по проектам стоимостью более 100 млн тенге?', 'Какие аналогичные кейсы рассматривала Комиссия?', 'Какие замечания Службы комплаенс встречались в подобных проектах?', 'Какая редакция Правил действовала на дату рассмотрения данного обращения?', 'Какие документы отсутствуют?', 'Сформируй перечень вопросов для заявителя', 'Подготовь материалы для рассмотрения Комиссией', 'Найди противоречия в документах', 'Сравни редакции Правил 2022 и действующую'];
  function assistantPage(params) {
    if (params && params.get('ctx')) asState.ctx = params.get('ctx');
    const cs = KBE.cases().sort((a, b) => b.date - a.date);
    view().innerHTML = `${nav('assistant')}
      <div class="page-head"><div><h1>AI-ассистент базы знаний</h1><div class="sub">Работает исключительно с документами базы знаний в пределах ваших прав доступа; каждый ответ сопровождается ссылками на источники</div></div></div>
      <div class="cols-2-1">
        <div class="card kb-chat"><div class="kb-chat-body" id="kaBody"></div>
          <form class="ai-input" id="kaForm" style="border-top:1px solid var(--border)"><input id="kaText" type="text" placeholder="Вопрос по историческим кейсам, решениям, Правилам…" autocomplete="off"><button type="submit" class="btn btn-primary btn-icon">${icon('send')}</button></form></div>
        <div class="stack">
          <div class="card"><div class="card-head"><h3>Контекст</h3></div><div class="card-body">
            <div class="field"><label>Кейс / обращение для анализа</label><select class="select" id="kaCtx"><option value="">— без контекста —</option>${cs.map(c => `<option value="${c.id}" ${c.id === asState.ctx ? 'selected' : ''}>${c.id} · ${esc(c.status)} · ${esc(c.title.slice(0, 46))}</option>`).join('')}</select></div>
            <div class="small text-muted mt16" id="kaCtxInfo"></div></div></div>
          <div class="card"><div class="card-head"><h3>Примеры запросов</h3></div><div class="card-body"><div class="kb-examples col">${AS_EX.map(e => `<button class="type-toggle" data-ax="${esc(e)}">${esc(e)}</button>`).join('')}</div></div></div>
          <div class="notice info">${icon('shield')}<span>Ассистент не выдумывает документы, решения, суммы и заключения. Если сведений недостаточно, он прямо сообщает: «${KBE.NO_DATA}»</span></div>
        </div>
      </div>`;
    const body = document.getElementById('kaBody');
    const addMsg = (role, html) => { const m = document.createElement('div'); m.className = 'msg ' + role; m.innerHTML = html; body.appendChild(m); body.scrollTop = body.scrollHeight; m.querySelectorAll('[data-brief]').forEach(a => a.onclick = (e) => { e.preventDefault(); const c = KBE.kcase(a.dataset.brief); if (c) briefModal(KBE.toTarget(c)); }); return m; };
    const showCtx = () => { const c = asState.ctx && KBE.kcase(asState.ctx); document.getElementById('kaCtxInfo').innerHTML = c ? `<b>${esc(c.applicant)}</b><br>${esc(c.title)}<br>${fdate(c.date)} · ${mln(c.amountRequested)} · ${esc(c.result)} · ред. Правил ${c.ruleId.slice(1)}<br><a href="#/kb/case/${c.id}">Открыть карточку</a>` : 'Выберите кейс, чтобы задавать вопросы «по этому заявителю», «по данному обращению», запрашивать справку и перечень вопросов.'; };
    showCtx();
    if (!asState.msgs.length) asState.msgs.push(['bot', `<p>Здравствуйте! Я ассистент базы знаний по благотворительной деятельности КМГ и ДЗО. Отвечаю только по документам базы знаний, доступным вашей учётной записи (${Core.ROLE_LABEL[U().role]}), и привожу ссылки на первоисточники.</p><p class="small text-muted">Исторические решения — справочная информация: они принимались по действовавшим тогда Правилам.</p>`]);
    asState.msgs.forEach(([r, h]) => addMsg(r, h));
    const ask = (q) => {
      asState.msgs.push(['user', esc(q)]); addMsg('user', esc(q));
      const t = addMsg('bot', '<div class="typing"><i></i><i></i><i></i></div>');
      setTimeout(() => {
        t.remove();
        let html;
        try { html = KBE.answer(q, asState.ctx || null).html; } catch (e) { console.error(e); html = `<p>${KBE.NO_DATA}</p>`; }
        asState.msgs.push(['bot', html]); addMsg('bot', html);
        Core.audit('Запрос к ассистенту базы знаний', 'База знаний', null, asState.ctx || '', q.slice(0, 120), null);
      }, 350);
    };
    document.getElementById('kaForm').onsubmit = (e) => { e.preventDefault(); const v = document.getElementById('kaText').value.trim(); if (!v) return; document.getElementById('kaText').value = ''; ask(v); };
    document.querySelectorAll('[data-ax]').forEach(b => b.onclick = () => ask(b.dataset.ax));
    document.getElementById('kaCtx').onchange = (e) => { asState.ctx = e.target.value; showCtx(); };
    if (params && params.get('q')) { const q = params.get('q'); history.replaceState(null, '', '#/kb/assistant'); ask(q); }
  }

  /* ---------------- аналитическая справка ---------------- */
  function briefModal(t) {
    if (!KBE.can('brief')) { toastErr('Формирование аналитических справок доступно специалистам КМГ, руководителям и администраторам'); return; }
    const b = KBE.briefing(t);
    Core.audit('Сформирована аналитическая справка', 'База знаний', null, t.id || '', `${t.applicant}: ${t.purpose}`.slice(0, 120), t.dzo || null);
    const html = `<div class="kb-brief">${b.enough ? '' : `<div class="notice">${icon('alert')}<span>${KBE.NO_DATA} Аналогичных кейсов и предыдущих обращений заявителя не найдено — справка содержит только оценку по действующим Правилам.</span></div>`}
      ${b.sections.map(s => `<div class="kb-brief-sec"><h4>${esc(s.title)}</h4>${s.html}</div>`).join('')}
      ${b.sources.render()}
      <div class="lock-note">${icon('shield')}Справка сформирована автоматически ${fdate(new Date())} по данным базы знаний. Исторические кейсы — справочная информация; окончательное решение принимает уполномоченный орган КМГ в соответствии с действующими ВНД.</div></div>`;
    openModal({ title: 'Аналитическая справка по обращению', sub: `${esc(t.applicant)} · ${mln(t.amountRequested)}${t.id ? ' · ' + t.id : ''}`, width: 1000, body: html,
      foot: `<button class="btn" data-close>Закрыть</button><button class="btn" id="kbPrint">${icon('file')}Печать</button><button class="btn btn-primary" id="kbDl">${icon('download')}Скачать (.doc)</button>` });
    document.getElementById('kbDl').onclick = () => {
      const doc = `<html><head><meta charset="utf-8"><title>Аналитическая справка</title><style>body{font-family:Arial;font-size:11pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:4px;font-size:10pt}h4{margin:14px 0 6px}</style></head><body><h2>Аналитическая справка по обращению</h2><p>${esc(t.applicant)} · ${mln(t.amountRequested)} · сформирована ${fdate(new Date())}</p>${document.querySelector('.kb-brief').innerHTML}</body></html>`;
      const blob = new Blob(['﻿' + doc], { type: 'application/msword' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `Справка_${(t.id || 'обращение')}.doc`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
      toast('Справка сохранена');
    };
    document.getElementById('kbPrint').onclick = () => { const w = window.open('', '_blank'); if (!w) { toastErr('Разрешите всплывающие окна для печати'); return; } w.document.write(`<html><head><meta charset="utf-8"><title>Справка</title><style>body{font-family:Arial;font-size:11pt;margin:24px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #999;padding:4px}</style></head><body>${document.querySelector('.kb-brief').innerHTML}</body></html>`); w.document.close(); w.print(); };
  }
  function newAppealForm() {
    openModal({ title: 'Анализ нового обращения', sub: 'Система найдёт исторические аналоги и сформирует аналитическую справку', width: 820, body: `<div class="form-grid">
      <div class="field"><label>Заявитель *</label><input class="input" id="naApp" placeholder="Например: ОО «Футбольный клуб «Каспий»"></div>
      <div class="field"><label>Тип заявителя</label><select class="select" id="naType">${['Акимат', 'Фонд', 'Некоммерческая организация', 'Государственное учреждение', 'Физическое лицо', 'Коммерческая организация'].map(x => `<option>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Получатель</label><input class="input" id="naRec" placeholder="если отличается от заявителя"></div>
      <div class="field"><label>Категория получателя</label><select class="select" id="naCat">${['Спортивные организации', 'Медицинские учреждения', 'Образовательные учреждения', 'Социально уязвимые', 'НКО', 'Государственное учреждение', 'Культура'].map(x => `<option>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Направление</label><select class="select" id="naDir">${DB.DIRECTIONS.map(x => `<option>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Вид помощи</label><select class="select" id="naAid"><option>Благотворительная</option><option>Спонсорская</option></select></div>
      <div class="field"><label>Регион</label><select class="select" id="naReg">${DB.REGIONS.map(x => `<option>${x}</option>`).join('')}</select></div>
      <div class="field"><label>Сумма, млн ₸ *</label><input class="input" type="number" id="naSum" step="0.1"></div>
      <div class="field full"><label>Цель обращения *</label><textarea class="input" id="naPur" placeholder="Например: спонсорская поддержка футбольного клуба на сезон 2027 года"></textarea></div></div>`,
      foot: `<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="naGo">Найти аналоги и сформировать справку</button>` });
    document.getElementById('naGo').onclick = () => {
      const g = (i) => document.getElementById(i).value.trim();
      if (!g('naApp') || !g('naPur') || !(+g('naSum') > 0)) { toastErr('Заполните заявителя, цель и сумму'); return; }
      closeModal();
      briefModal({ applicant: g('naApp'), applicantType: g('naType'), recipient: g('naRec') || g('naApp'), recipientCat: g('naCat'), direction: g('naDir'), aidType: g('naAid'), region: g('naReg'), amountRequested: +g('naSum'), purpose: g('naPur'), date: new Date(), dzo: U().dzo || null });
    };
  }

  // Блок «Найденные аналогичные кейсы» для текущего обращения на благотворительность
  const ORG_TYPE = (o) => /^акимат/i.test(o) ? 'Акимат' : /^(оф|фонд)/i.test(o) ? 'Фонд' : /^(кгп|гккп|кгу|гкп|нао|гу)/i.test(o) ? 'Государственное учреждение' : /^тоо/i.test(o) ? 'Коммерческая организация' : 'Некоммерческая организация';
  const DIR_CAT = { 'Спорт': 'Спортивные организации', 'Здравоохранение': 'Медицинские учреждения', 'Образование': 'Образовательные учреждения', 'Поддержка уязвимых групп': 'Социально уязвимые', 'Культура': 'Культура', 'Экология': 'НКО' };
  function appealTarget(c) { return { applicant: c.org, applicantType: ORG_TYPE(c.org), recipient: c.org, recipientCat: DIR_CAT[c.direction] || 'НКО', direction: c.direction, aidType: c.type, region: c.region, amountRequested: c.amount, purpose: c.purpose, date: c.date, dzo: c.dzo }; }
  function appealAnalogs(c) {
    const body = document.querySelector('#modalRoot .modal-body'); if (!body || !c) return;
    const t = appealTarget(c);
    const sim = KBE.similar(t, 3);
    const box = document.createElement('div');
    box.innerHTML = `<div class="section-title">Найденные аналогичные кейсы · база знаний</div>${simBlock(sim)}
      ${KBE.can('brief') ? `<button class="btn btn-sm mt16" id="apBrief">${icon('file')}Сформировать аналитическую справку</button>` : ''}`;
    body.appendChild(box);
    const b = document.getElementById('apBrief'); if (b) b.onclick = () => briefModal(t);
  }

  window.KBUI = { page, appealAnalogs, briefModal };
})();

</script>
  <script>
/* AI-помощник: разбор вопросов на естественном языке и ответы по данным системы */
(function () {
  'use strict';
  const { PROJECTS, DZO, DZO_BY_ID, CHARITY, SUPPORT, DOCUMENTS, DOC_STATUSES, EVENTS, TODAY } = DB;
  const { money, num, fdate, esc, plural, statusBadge, riskBadge, progressBar, daysBetween, icon } = UI;
  const sum = (a, f) => a.reduce((s, x) => s + (typeof f === 'function' ? f(x) : x[f]), 0);
  const short = (r) => r.replace(' область', ' обл.');

  const REGION_KEYS = [
    ['мангист', 'Мангистауская область'], ['атырау', 'Атырауская область'], ['костан', 'Костанайская область'],
    ['абай', 'Абайская область'], ['семей', 'Абайская область'], ['павлодар', 'Павлодарская область'], ['актюб', 'Актюбинская область'], ['актоб', 'Актюбинская область'],
    ['кызылорд', 'Кызылординская область'], ['западно', 'Западно-Казахстанская область'], ['зко', 'Западно-Казахстанская область'],
    ['туркестан', 'Туркестанская область'], ['жамбыл', 'Жамбылская область'], ['тараз', 'Жамбылская область'],
    ['шымкент', 'г. Шымкент'], ['астан', 'г. Астана']
  ];
  const DZO_KEYS = [
    ['озенмунай', 'omg'], ['омг', 'omg'], ['мангистаумунай', 'mmg'], ['ммг', 'mmg'], ['эмбамунай', 'emg'], ['эмба', 'emg'], ['эмг', 'emg'],
    ['казтрансойл', 'kto'], ['кто', 'kto'], ['атырауский нпз', 'anpz'], ['анпз', 'anpz'], ['павлодарский нхз', 'pnhz'], ['пнхз', 'pnhz'],
    ['каражанбас', 'kbm'], ['кбм', 'kbm'], ['пкоп', 'pkop'], ['петроказахстан', 'pkop'], ['шымкентский нпз', 'pkop'], ['казахтуркмунай', 'ktm'], ['ктм', 'ktm']
  ];
  const DIR_KEYS = [['образован', 'Образование'], ['школ', 'Образование'], ['здравоохр', 'Здравоохранение'], ['медиц', 'Здравоохранение'], ['больниц', 'Здравоохранение'],
    ['спорт', 'Спорт'], ['инфраструкт', 'Социальная инфраструктура'], ['культур', 'Культура'], ['благоустр', 'Благоустройство'], ['уязвим', 'Поддержка уязвимых групп'], ['эколог', 'Экология']];

  function detect(q) {
    let s = ' ' + q.toLowerCase().replace(/ё/g, 'е') + ' ';
    let dzo = null;
    for (const [k, id] of DZO_KEYS) {
      const re = k.length <= 4 ? new RegExp('[^а-яa-z]' + k + '[^а-яa-z]') : null;
      if (re ? re.test(s) : s.includes(k)) { dzo = id; s = s.replace(k, ' '); break; }
    }
    let region = null;
    for (const [k, r] of REGION_KEYS) if (s.includes(k)) { region = r; break; }
    let direction = null;
    for (const [k, d] of DIR_KEYS) if (s.includes(k)) { direction = d; break; }
    const pctM = s.match(/(?:ниже|меньше|менее|<)\s*(\d{1,3})\s*%?/);
    const pctAbove = s.match(/(?:выше|больше|более|>)\s*(\d{1,3})\s*%/);
    const daysM = s.match(/(\d{1,3})\s*(?:дн|день|дня)/);
    const code = q.match(/СП-\d{2}-\d{3}/i);
    const yearM = q.match(/\b(20[2-3]\d)\b/);
    const analysis = /проанализ|анализ|ход реализ|прогноз|проблем|реши|рекоменд|что делать|вывод|как дела|состояни|отслед|динамик|темп/.test(s);
    let p = null;
    if (code) p = PROJECTS.find(x => x.code === code[0].toUpperCase()) || null;
    else if (analysis) p = matchProject(s);
    return { s, dzo, region, direction, lessPct: pctM ? +pctM[1] : null, morePct: pctAbove ? +pctAbove[1] : null, days: daysM ? +daysM[1] : null, code: code ? code[0].toUpperCase() : null, p, analysis, year: yearM ? +yearM[1] : null };
  }
  // поиск проекта по фрагментам названия (редкие слова имеют больший вес)
  function matchProject(s) {
    const stems = [...new Set((s.match(/[а-яa-z0-9]{5,}/g) || []).map(w => w.slice(0, 6)))];
    const names = PROJECTS.map(p => p.name.toLowerCase().replace(/ё/g, 'е'));
    let best = null, bestScore = 0;
    const df = Object.fromEntries(stems.map(st => [st, names.filter(n => n.includes(st)).length]));
    PROJECTS.forEach((p, i) => {
      const sc = stems.reduce((acc, st) => acc + (df[st] && df[st] <= 6 && names[i].includes(st) ? 1 / df[st] : 0), 0);
      if (sc > bestScore) { bestScore = sc; best = p; }
    });
    return bestScore >= 0.9 ? best : null;
  }

  function table(rows, cols) {
    if (!rows.length) return '';
    return `<div class="table-wrap"><table class="tbl"><thead><tr>${cols.map(c => `<th class="${c.r ? 'r' : ''}">${c.t}</th>`).join('')}</tr></thead><tbody>
      ${rows.map(r => `<tr class="${r.id && r.name ? 'clickable' : ''}" ${r.id && r.name ? `data-pid="${r.id}"` : ''}>${cols.map(c => `<td class="${c.r ? 'r nowrap num' : ''} ${c.cls || ''}">${c.v(r)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`;
  }
  const C = {
    name: { t: 'Проект', cls: 't-name', v: p => esc(p.name) },
    region: { t: 'Регион', cls: 'nowrap', v: p => short(p.region) },
    dzo: { t: 'ДЗО', v: p => p.dzoShort },
    prog: { t: '%', r: true, v: p => p.progress + '%' },
    end: { t: 'Срок', cls: 'nowrap', v: p => `<span class="${p.overdue ? 'text-bad fw6' : ''}">${fdate(p.planEnd)}</span>` },
    budget: { t: 'Бюджет', r: true, v: p => money(p.budget) },
    risk: { t: 'Риск', v: p => riskBadge(p.risk) },
    status: { t: 'Статус', v: p => statusBadge(p.status) }
  };
  const kpis = (arr) => `<div class="ai-kpis">${arr.map(([l, v]) => `<div class="ai-kpi"><span>${l}</span><b>${v}</b></div>`).join('')}</div>`;
  const concl = (t) => `<div class="conclusion"><b>Вывод:</b> ${t}</div>`;
  const scope = (d) => [d.region ? short(d.region) : '', d.dzo ? DZO_BY_ID[d.dzo].short : '', d.direction || ''].filter(Boolean).join(', ');
  function filterScope(list, d) {
    return list.filter(p => (!d.region || p.region === d.region) && (!d.dzo || p.dzo === d.dzo) && (!d.direction || p.direction === d.direction));
  }
  const active = (l) => l.filter(p => p.status !== 'Завершено');

  /* ---------- аналитические ответы ---------- */
  const probBlock = (title, detail, actions, sev, extra = '') => `<div class="ai-prob sev${sev}"><div class="t">${title}</div>${detail ? `<div class="d">${detail}</div>` : ''}${extra}<div class="lbl">Пути решения:</div><ol>${actions.map(a => `<li>${esc(a)}</li>`).join('')}</ol></div>`;
  function projectAnalysis(p) {
    const a = Insights.project(p);
    const fc = a.forecast;
    const hist = a.history.slice(-6);
    return `<p><b>${esc(p.name)}</b><br><span class="small text-muted">${p.code} · ${p.dzoShort} · ${p.region}</span> ${UI.wfBadge(p.wf)}</p>
      ${kpis([['Индекс состояния', `${a.health} · ${a.label.toLowerCase()}`], ['Реализация / срок', `${p.progress}% / ${Math.round(a.metrics.timePct)}%`], ['Освоено', `${Math.round(a.metrics.spentPct)}% бюджета`]])}
      <p>${a.summary}</p>
      ${hist.length ? `<p class="fw6" style="margin-top:10px">Ход реализации</p><div class="table-wrap"><table class="tbl"><thead><tr><th>Дата</th><th class="r">Было</th><th class="r">Стало</th><th>Кто обновил</th></tr></thead><tbody>
        ${hist.map(h => { const au = DB.AUDIT.find(x => x.projectId === p.id && x.at === h.at); return `<tr><td class="nowrap num">${fdate(h.at)}</td><td class="r">${h.from}%</td><td class="r fw6">${h.v}%</td><td class="nowrap">${au ? Core.userLabel(au.user) : '—'}</td></tr>`; }).join('')}
        </tbody></table></div><p class="small text-muted">Темп за последние 3 месяца: <b>${a.metrics.pace} п.п. в месяц</b>${fc && fc.date ? ` · прогноз завершения ${fdate(fc.date)}` : ''}.</p>` : ''}
      <p class="fw6" style="margin-top:10px">Проблемы и пути решения</p>
      ${a.findings.slice(0, 6).map(f => probBlock(esc(f.title), esc(f.detail), f.actions, f.sev)).join('')}
      ${concl(a.findings[0] && a.findings[0].sev ? `приоритетное действие — ${a.findings[0].actions[0].charAt(0).toLowerCase() + a.findings[0].actions[0].slice(1)}.` : 'проект в норме, достаточно планового мониторинга.')}
      <button class="btn btn-sm mt16" data-pid="${p.id}">Открыть карточку проекта</button>`;
  }
  function portfolioProblems(d) {
    const L = filterScope(PROJECTS, d);
    const P = Insights.portfolio(L);
    const top = P.cats.slice(0, 5);
    return `<p>Проанализировано <b>${P.res.length}</b> активных ${plural(P.res.length, 'проект', 'проекта', 'проектов')}${scope(d) ? ` (${scope(d)})` : ''}: в критическом состоянии — <b>${P.critical.length}</b>, требуют внимания — <b>${P.attention.length}</b>.</p>
      <p class="fw6">Ключевые проблемы реализации и пути решения</p>
      ${top.map(c => probBlock(`${esc(c.cat)} — ${c.n} ${plural(c.n, 'проект', 'проекта', 'проектов')}`, c.projects.slice(0, 3).map(p => `<a href="#/project/${p.id}">${esc(p.name.split(',')[0])}</a>`).join(' · ') + (c.n > 3 ? ` и ещё ${c.n - 3}` : ''), c.actions, c.sev)).join('')}
      ${P.critical.length ? `<p class="fw6" style="margin-top:10px">Проекты в критическом состоянии</p>${table(P.critical.slice(0, 8).map(r => Object.assign(Object.create(r.p), { _h: r.health, _f: r.findings[0] })), [C.name, C.dzo, { t: 'Индекс', r: true, v: x => x._h }, { t: 'Главная проблема', v: x => esc(x._f ? x._f.title : '—') }])}` : ''}
      ${concl(top.length ? `наиболее массовая проблема — «${top[0].cat.toLowerCase()}» (${top[0].n} ${plural(top[0].n, 'проект', 'проекта', 'проектов')}). Рекомендуется рассмотреть её системно на совещании с ДЗО и закрепить меры в протоколе. Для разбора конкретного проекта спросите: «Проанализируй проект СП-25-001».` : 'существенных проблем не выявлено.')}`;
  }
  function portfolioForecast(d) {
    const L = filterScope(PROJECTS, d).filter(p => ['IMPL', 'CONTROL', 'ACCEPTED'].includes(p.wf) && Insights.forecast(p) !== null || p.overdue);
    const rows = L.map(p => ({ p, f: Insights.forecast(p) })).filter(x => x.f && (x.f.date === null || x.f.lag > 30)).sort((a, b) => (b.f.lag ?? 9999) - (a.f.lag ?? 9999));
    const ok = L.length - rows.length;
    return `<p>Отслежен ход реализации <b>${L.length}</b> ${plural(L.length, 'проекта', 'проектов', 'проектов')}${scope(d) ? ` (${scope(d)})` : ''}: в графике или с опережением — <b>${ok}</b>, с прогнозом срыва срока — <b>${rows.length}</b>.</p>
      ${table(rows.slice(0, 12).map(x => Object.assign(Object.create(x.p), { _f: x.f })), [C.name, C.prog, { t: 'Темп', r: true, v: x => x._f.pace + ' п.п./мес' }, { t: 'План', cls: 'nowrap', v: x => fdate(x.planEnd) }, { t: 'Прогноз', cls: 'nowrap', v: x => x._f.date ? `<span class="text-bad fw6">${fdate(x._f.date)}</span>` : '<span class="text-bad">нет динамики</span>' }])}
      ${concl(rows.length ? `по ${rows.length} ${plural(rows.length, 'проекту', 'проектам', 'проектам')} текущий темп не позволяет завершить работы в срок. Рекомендуется: запросить у ДЗО графики ликвидации отставания, по проектам без динамики провести выездные совещания, по отставанию более 60 дн. — заранее вынести вопрос о сроках на Комиссию.` : 'все проекты идут в графике.')}`;
  }
  function limitAnswer(d) {
    const Y = d.year || Finance.curY();
    if (!DB.FIN.limits[Y]) return `<p>Лимит на благотворительность на ${Y} год не установлен.</p>`;
    const s = Finance.limitStatus(Y);
    const cs = Finance.ceoSummary(Y);
    const partial = Core.user.access !== 'ALL';
    const rec = [];
    if (s.status.label === 'Отставание от графика') rec.push('ускорить выплаты по одобренным благотворительным обращениям и приёмку работ по проектам в рамках лимита', `перераспределить неиспользуемый лимит ФГД (${money(Math.max(0, cs.allocated - cs.used))}) в пользу ДЗО с подтверждённой потребностью`);
    if (s.status.label === 'Риск превышения' || s.status.label === 'Лимит превышен') rec.push('приостановить принятие новых обязательств в рамках лимита до решения КМГ', 'перевести часть проектов на финансирование «вне лимита» или перенести на следующий год');
    if (cs.exceeded.length) rec.push(`урегулировать превышение лимита ФГД по ${cs.exceeded.map(r => r.z.short).join(', ')}`);
    if (!rec.length) rec.push('продолжить ежемесячный мониторинг освоения лимита');
    return `<p>Лимит на благотворительность на <b>${Y}</b> год — <b>${money(s.limit)}</b>. Статус освоения: <span class="badge ${s.status.cls}">${s.status.label}</span>${partial ? ' <span class="small text-muted">(суммы использования — по доступным вам ДЗО)</span>' : ''}</p>
      ${kpis([['Распределено', `${money(s.committed)} · ${Math.round(s.commitPct * 100)}%`], ['Освоено', `${money(s.fact)} · ${Math.round(s.pct * 100)}%`], ['Остаток', money(s.remaining)]])}
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Направление</th><th class="r">Распределено</th><th class="r">Освоено</th></tr></thead><tbody>
        <tr><td>Фонд генеральных директоров</td><td class="r nowrap">${money(s.ceoPlan)}</td><td class="r nowrap">${money(s.ceoFact)}</td></tr>
        <tr><td>Проекты в рамках лимита</td><td class="r nowrap">${money(s.projPlan)}</td><td class="r nowrap">${money(s.projFact)}</td></tr>
        <tr><td>Благотворительные обращения</td><td class="r nowrap">${money(s.chPlan)}</td><td class="r nowrap">${money(s.chFact)}</td></tr>
        <tr><td class="text-muted">Справочно: вне лимита</td><td class="r nowrap text-muted">${money(s.outPlan)}</td><td class="r nowrap text-muted">${money(s.outFact)}</td></tr></tbody></table></div>
      ${concl(`${s.status.hint ? s.status.hint + '. ' : ''}Рекомендуется: ${rec.join('; ')}.`)}
      <a class="btn btn-sm mt16" href="#/finance">Открыть раздел «Лимит и ФГД»</a>`;
  }
  function ceoAnswer(d) {
    const Y = d.year || Finance.curY();
    const cs = Finance.ceoSummary(Y);
    const unused = Math.max(0, cs.allocated - cs.used);
    const rec = [];
    if (cs.notUsing.length) rec.push(`запросить у ${cs.notUsing.map(r => r.z.short).join(', ')} план использования ФГД; при отсутствии потребности — перераспределить ${money(sum(cs.notUsing, 'alloc'))} другим ДЗО`);
    if (cs.exceeded.length) rec.push(`по ${cs.exceeded.map(r => r.z.short).join(', ')} — приостановить новые обязательства за счёт ФГД и рассмотреть увеличение лимита решением КМГ либо перевод расходов в лимит на благотворительность`);
    const weak = cs.rows.filter(r => r.status.label === 'Слабо использует');
    if (weak.length) rec.push(`${weak.map(r => r.z.short).join(', ')} используют ФГД медленно — напомнить о сроках освоения до конца года`);
    if (!rec.length) rec.push('лимиты ФГД используются в пределах выделенных сумм');
    return `<p>Фонд генеральных директоров на <b>${Y}</b> год: ${Core.user.access === 'ALL' ? `фонд <b>${money(cs.fund)}</b>, распределено по ДЗО <b>${money(cs.allocated)}</b>, ` : ''}использовано <b>${money(cs.used)}</b>.</p>
      ${kpis([['Используют', cs.using.length], ['Не используют', cs.notUsing.length], ['Превысили лимит', cs.exceeded.length]])}
      <div class="table-wrap"><table class="tbl"><thead><tr><th>ДЗО</th><th class="r">Лимит</th><th class="r">Использовано</th><th>Статус</th></tr></thead><tbody>
        ${cs.rows.map(r => `<tr><td class="fw6">${r.z.short}</td><td class="r nowrap">${r.alloc ? money(r.alloc) : '—'}</td><td class="r nowrap">${money(r.fact)}${r.alloc ? ` · ${Math.round(r.pct * 100)}%` : ''}</td><td><span class="badge ${r.status.cls}">${r.status.label}</span></td></tr>`).join('')}
      </tbody></table></div>
      ${concl(`${unused > 0 ? `неиспользованный остаток ФГД — ${money(unused)}. ` : ''}Рекомендуется: ${rec.join('; ')}.`)}
      <a class="btn btn-sm mt16" href="#/finance">Открыть раздел «Лимит и ФГД»</a>`;
  }
  function fundingAnswer(d) {
    const L = filterScope(PROJECTS, d);
    const rows = Object.entries(DB.FUNDING).map(([k, f]) => { const l = L.filter(p => p.funding === k); return { f, n: l.length, b: sum(l, 'budget'), s: sum(l, 'spent') }; });
    return `<p>Проекты ${scope(d) ? `(${scope(d)}) ` : ''}по источникам финансирования:</p>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Источник</th><th class="r">Проектов</th><th class="r">Бюджет</th><th class="r">Освоено</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${r.f.label}</td><td class="r">${r.n}</td><td class="r nowrap">${money(r.b)}</td><td class="r nowrap">${money(r.s)}</td></tr>`).join('')}</tbody></table></div>
      ${concl('проекты «в рамках лимита» и ФГД расходуют годовой лимит на благотворительность; проекты «вне лимита» финансируются из иных источников и в освоение лимита не входят.')}`;
  }

  const INTENTS = [
    // анализ конкретного проекта
    { test: d => d.code || d.p, run: d => d.p ? projectAnalysis(d.p) : `<p>Проект ${d.code} не найден в пределах вашего доступа.</p>` },
    { test: d => /фгд|фонд генеральн|генеральных директор/.test(d.s), run: ceoAnswer },
    { test: d => /лимит/.test(d.s), run: limitAnswer },
    { test: d => /источник|вне лимит/.test(d.s), run: fundingAnswer },
    { test: d => /проблем|пути реш|что делать|рекоменд|как исправ|решени[ея] проблем/.test(d.s), run: portfolioProblems },
    { test: d => /ход реализ|прогноз|отслед|темп|динамик реализ|сорвут|не успе/.test(d.s), run: portfolioForecast },
    // согласование / workflow
    { test: d => /на провер|проверк|согласован|доработ|возвращ|черновик|входящ|workflow/.test(d.s) && !/документ/.test(d.s), run: d => {
      const L = filterScope(PROJECTS, d);
      const rev = L.filter(p => ['SUBMITTED', 'REVIEW'].includes(p.wf)), ret = L.filter(p => p.wf === 'RETURNED'), dr = L.filter(p => p.wf === 'DRAFT');
      const late = rev.filter(Core.reviewLate);
      const focus = /доработ|возвращ/.test(d.s) ? ret : /черновик/.test(d.s) ? dr : rev;
      const title = /доработ|возвращ/.test(d.s) ? 'возвращены на доработку' : /черновик/.test(d.s) ? 'находятся в черновиках' : 'находятся на проверке в КМГ';
      return `<p>${scope(d) ? `<b>${scope(d)}</b>: ` : ''}<b>${focus.length}</b> ${plural(focus.length, 'проект', 'проекта', 'проектов')} ${title}.</p>
        ${kpis([['На проверке', rev.length], ['На доработке', ret.length], ['Просрочена проверка', late.length]])}
        ${table(focus, [C.name, C.dzo, { t: 'Статус', v: p => UI.wfBadge(p.wf) }, { t: 'Срок', cls: 'nowrap', v: p => p.reviewDue && ['SUBMITTED', 'REVIEW'].includes(p.wf) ? `<span class="${Core.reviewLate(p) ? 'text-bad fw6' : ''}">${fdate(p.reviewDue)}</span>` : '—' }])}
        ${concl(late.length ? `${late.length} ${plural(late.length, 'проект ожидает', 'проекта ожидают', 'проектов ожидают')} проверки дольше нормативных ${DB.SETTINGS.slaDays} дн. — требуется решение проверяющего.` : ret.length ? `по ${ret.length} проектам ДЗО устраняют замечания КМГ; после повторной отправки они вернутся во «Входящие».` : 'нарушений сроков согласования нет.')}`;
    } },
    { test: d => /задач|что мне сделать|мои дела/.test(d.s), run: () => {
      const G = Core.tasks().filter(g => g.items.length);
      return `<p>Ваших задач, требующих действий: <b>${Core.taskCount()}</b>.</p>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Задача</th><th class="r">Кол-во</th></tr></thead><tbody>${G.map(g => `<tr><td><a href="#/tasks?g=${g.key}">${g.title}</a></td><td class="r">${g.items.length}</td></tr>`).join('')}</tbody></table></div>
        ${concl(G.length ? `начните с «${G[0].title.toLowerCase()}» — это ${G[0].items.length} ${plural(G[0].items.length, 'проект', 'проекта', 'проектов')}.` : 'задач нет.')}`;
    } },
    // завершение в ближайшие N дней
    { test: d => /ближайш|в течение|до конца|должн[ыа] заверш|истека|срок.*(наступ|подход)/.test(d.s) || (d.days && /заверш|срок/.test(d.s)), run: d => {
      const n = d.days || 30; const lim = DB.addDays(TODAY, n);
      const list = filterScope(active(PROJECTS), d).filter(p => p.planEnd >= TODAY && p.planEnd <= lim).sort((a, b) => a.planEnd - b.planEnd);
      const sc = scope(d);
      if (!list.length) return `<p>В ближайшие ${n} дн. ${sc ? `(${sc}) ` : ''}проектов с плановым завершением нет.</p>` + (d.region ? (() => {
        const next = filterScope(active(PROJECTS), d).filter(p => p.planEnd >= TODAY).sort((a, b) => a.planEnd - b.planEnd)[0];
        return next ? `<p>Ближайший срок: <b>${esc(next.name)}</b> — ${fdate(next.planEnd)}.</p>` : '';
      })() : '');
      const lag = list.filter(p => p.progress < 90);
      return `<p>В ближайшие <b>${n} дн.</b> ${sc ? `(${sc}) ` : ''}должны завершиться <b>${list.length}</b> ${plural(list.length, 'проект', 'проекта', 'проектов')} на сумму ${money(sum(list, 'budget'))}.</p>
        ${table(list, [C.name, ...(d.region ? [C.dzo] : [C.region]), C.prog, C.end])}
        ${concl(lag.length ? `${lag.length} из ${list.length} имеют реализацию ниже 90% — высокая вероятность срыва срока: ${lag.map(p => esc(p.name.split(',')[0])).slice(0, 2).join('; ')}.` : 'все проекты близки к завершению, существенных рисков срыва не выявлено.')}`;
    } },
    // ДЗО с просрочкой
    { test: d => /дзо|дочерн/.test(d.s) && /просроч|сорван|нарушен/.test(d.s), run: () => {
      const rows = DZO.map(z => { const s = AGG.dzoStats(z); return { z, s, list: s.ps.filter(p => p.overdue) }; }).filter(x => x.list.length).sort((a, b) => b.list.length - a.list.length);
      const total = sum(rows, x => x.list.length);
      return `<p>Просроченные проекты имеются у <b>${rows.length}</b> ${plural(rows.length, 'ДЗО', 'ДЗО', 'ДЗО')} из ${DZO.length}, всего <b>${total}</b> ${plural(total, 'проект', 'проекта', 'проектов')}.</p>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>ДЗО</th><th class="r">Просрочено</th><th>Проекты</th></tr></thead><tbody>
        ${rows.map(x => `<tr><td class="nowrap fw6">${x.z.short}</td><td class="r">${x.list.length}</td><td>${x.list.map(p => `<a href="#/project/${p.id}">${esc(p.name.split(',')[0])}</a> <span class="text-bad">(−${daysBetween(p.planEnd, TODAY)} дн.)</span>`).join('<br>')}</td></tr>`).join('')}
        </tbody></table></div>
        ${concl(`наибольшая концентрация просрочек — ${rows[0].z.name} (${rows[0].list.length}). Рекомендуется запросить у ДЗО обновлённые графики и вынести вопрос на заседание Комиссии.`)}`;
    } },
    // реализация ниже N%
    { test: d => d.lessPct != null || /отста/.test(d.s), run: d => {
      const n = d.lessPct ?? 50;
      const list = filterScope(active(PROJECTS), d).filter(p => p.progress < n).sort((a, b) => a.progress - b.progress);
      const sc = scope(d);
      return `<p>Активных проектов ${sc ? `(${sc}) ` : ''}с реализацией ниже <b>${n}%</b>: <b>${list.length}</b> на сумму ${money(sum(list, 'budget'))}.</p>
        ${table(list.slice(0, 15), [C.name, C.region, C.prog, C.end, C.risk])}
        ${list.length > 15 ? `<p class="small text-muted">Показаны 15 из ${list.length}.</p>` : ''}
        ${list.length ? concl(`${list.filter(p => p.overdue).length} из них уже просрочены, ${list.filter(p => p.risk === 'Высокий').length} — с высоким риском. Средняя реализация группы — ${Math.round(sum(list, 'progress') / list.length)}%.`) : ''}`;
    } },
    // высокий риск
    { test: d => /риск/.test(d.s), run: d => {
      const lvl = /средн/.test(d.s) ? 'Средний' : /низк/.test(d.s) ? 'Низкий' : 'Высокий';
      const list = filterScope(active(PROJECTS), d).filter(p => p.risk === lvl).sort((a, b) => a.progress - b.progress);
      const sc = scope(d);
      const topRisks = list.flatMap(p => p.risks.filter(r => r.status !== 'Устранён' && r.level === 'Высокий'));
      return `<p>Сейчас <b>${list.length}</b> ${plural(list.length, 'активный проект', 'активных проекта', 'активных проектов')} ${sc ? `(${sc}) ` : ''}с уровнем риска «${lvl.toLowerCase()}» на сумму ${money(sum(list, 'budget'))}.</p>
        ${table(list, [C.name, C.region, C.prog, C.end])}
        ${list.length ? concl(`${list.filter(p => p.overdue).length} ${plural(list.filter(p => p.overdue).length, 'проект уже просрочен', 'проекта уже просрочены', 'проектов уже просрочены')}; открытых рисков высокого уровня — ${topRisks.length}. Типичные причины: отставание подрядчиков от графика СМР и удорожание материалов.`) : ''}`;
    } },
    // просроченные
    { test: d => /просроч/.test(d.s), run: d => {
      const list = filterScope(PROJECTS, d).filter(p => p.overdue).sort((a, b) => a.planEnd - b.planEnd);
      return `<p>Просроченных проектов ${scope(d) ? `(${scope(d)}) ` : ''}: <b>${list.length}</b>, бюджет ${money(sum(list, 'budget'))}.</p>
        ${table(list, [C.name, C.dzo, C.prog, { t: 'Просрочка', r: true, v: p => daysBetween(p.planEnd, TODAY) + ' дн.' }])}
        ${list.length ? concl(`средняя просрочка — ${Math.round(sum(list, p => daysBetween(p.planEnd, TODAY)) / list.length)} дн. Необходимо инициировать продление сроков через Комиссию или применить штрафные санкции к подрядчикам.`) : ''}`;
    } },
    // освоение / бюджет
    { test: d => /освоен|освоил|потрач|израсход|бюджет|средств|финанс|сколько денег/.test(d.s) && !/благотвор|спонсор/.test(d.s), run: d => {
      const list = filterScope(PROJECTS, d);
      const b = sum(list, 'budget'), s = sum(list, 'spent');
      const byDir = [...new Set(list.map(p => p.direction))].map(dn => { const l = list.filter(p => p.direction === dn); return { dn, b: sum(l, 'budget'), s: sum(l, 'spent') }; }).sort((x, y) => y.b - x.b);
      const low = byDir.slice().sort((x, y) => x.s / x.b - y.s / y.b)[0];
      return `<p>По социальным проектам ${scope(d) ? `(${scope(d)}) ` : ''}освоено <b>${money(s)}</b> из ${money(b)} — <b>${Math.round(s / b * 100)}%</b> бюджета.</p>
        ${kpis([['Бюджет', money(b)], ['Освоено', money(s)], ['Остаток', money(b - s)]])}
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Направление</th><th class="r">Бюджет</th><th class="r">Освоено</th><th class="r">%</th></tr></thead><tbody>
        ${byDir.map(x => `<tr><td>${x.dn}</td><td class="r nowrap num">${money(x.b)}</td><td class="r nowrap num">${money(x.s)}</td><td class="r num">${Math.round(x.s / x.b * 100)}%</td></tr>`).join('')}
        </tbody></table></div>
        ${concl(`наименьший уровень освоения — «${low.dn}» (${Math.round(low.s / low.b * 100)}%). Незавершённые проекты требуют освоения ещё ${money(sum(active(list), p => p.budget - p.spent))}.`)}`;
    } },
    // благотворительность
    { test: d => /благотвор|спонсор|обращени.*(фонд|организац)|комисси.*обращ/.test(d.s), run: d => {
      const list = CHARITY.filter(c => !d.region || c.region === d.region);
      const appr = list.filter(c => c.decision === 'Одобрено'), rej = list.filter(c => c.status === 'Отклонено');
      const byDir = [...new Set(appr.map(c => c.direction))].map(dn => ({ dn, n: appr.filter(c => c.direction === dn).length, s: sum(appr.filter(c => c.direction === dn), 'amount') })).sort((a, b) => b.s - a.s);
      const late = EVENTS.filter(e => e.charityId && e.overdue).length;
      return `<p>Всего обращений на благотворительную и спонсорскую помощь${d.region ? ` (${short(d.region)})` : ''}: <b>${list.length}</b>.</p>
        ${kpis([['Одобрено', appr.length], ['Отклонено', rej.length], ['Сумма помощи', money(sum(appr, 'amount'))]])}
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Направление</th><th class="r">Обращений</th><th class="r">Сумма</th></tr></thead><tbody>
        ${byDir.map(x => `<tr><td>${x.dn}</td><td class="r">${x.n}</td><td class="r nowrap num">${money(x.s)}</td></tr>`).join('')}</tbody></table></div>
        ${concl(`лидирует направление «${byDir[0]?.dn}». ${late ? `${late} ${plural(late, 'обращение рассматривается', 'обращения рассматриваются', 'обращений рассматриваются')} с нарушением 30-дневного срока.` : 'Нарушений сроков рассмотрения нет.'}`)}`;
    } },
    // соц поддержка работников
    { test: d => /работник|сотрудник|материальн|социальн.*поддерж|оздоровл/.test(d.s), run: () => {
      const paid = SUPPORT.filter(s => s.status === 'Выплачено');
      const y = TODAY.getFullYear();
      const byType = [...new Set(SUPPORT.map(s => s.type))].map(t => ({ t, n: SUPPORT.filter(s => s.type === t).length, a: sum(paid.filter(s => s.type === t), 'amount') })).sort((a, b) => b.n - a.n).slice(0, 5);
      const inWork = SUPPORT.filter(s => s.stage < 3 && s.status !== 'Отклонено');
      return `<p>Обращений работников за весь период: <b>${SUPPORT.length}</b>, в ${y} г. — <b>${SUPPORT.filter(s => s.date.getFullYear() === y).length}</b>.</p>
        ${kpis([['Выплачено', money(sum(paid, 'amount'))], ['В работе', inWork.length], ['Отклонено', SUPPORT.filter(s => s.status === 'Отклонено').length]])}
        <div class="table-wrap"><table class="tbl"><thead><tr><th>Вид поддержки</th><th class="r">Обращений</th><th class="r">Выплачено</th></tr></thead><tbody>
        ${byType.map(x => `<tr><td>${x.t}</td><td class="r">${x.n}</td><td class="r nowrap num">${money(x.a)}</td></tr>`).join('')}</tbody></table></div>
        ${concl(`наиболее востребованы «${byType[0].t.toLowerCase()}» и «${byType[1].t.toLowerCase()}». ${inWork.filter(s => daysBetween(s.date, TODAY) > 15).length} обращений в работе дольше 15 дней.`)}`;
    } },
    // документы
    { test: d => /документ|договор|акт|отчет/.test(d.s), run: () => {
      const miss = PROJECTS.filter(p => p.docsMissing);
      const late = DOCUMENTS.filter(x => x.statusIdx <= 2 && x.due < TODAY);
      const onAppr = DOCUMENTS.filter(x => x.statusIdx === 2).length;
      return `<p>По <b>${miss.length}</b> проектам отсутствуют обязательные документы:</p>
        ${table(miss, [C.name, { t: 'Недостающие документы', v: p => esc(p.docsMissing) }])}
        <p>На согласовании — <b>${onAppr}</b> ${plural(onAppr, 'документ', 'документа', 'документов')}, с истёкшим сроком обработки — <b class="text-bad">${late.length}</b>.</p>
        ${concl('рекомендуется направить в ДЗО запросы о предоставлении документов до ближайшего заседания Комиссии.')}`;
    } },
    // комиссия
    { test: d => /комисси|заседан|решени/.test(d.s), run: () => {
      const list = PROJECTS.filter(p => p.commission);
      const next = EVENTS.find(e => e.type === 'commission' && e.date >= TODAY);
      const chPend = CHARITY.filter(c => c.stage === 4 && c.status !== 'Отклонено');
      return `<p>Ближайшее заседание Комиссии — <b>${fdate(next.date)}</b> (через ${daysBetween(TODAY, next.date)} дн.).</p>
        <p>Проекты, требующие решения (${list.length}):</p>
        ${table(list, [C.name, { t: 'Вопрос', v: p => esc(p.commission) }])}
        <p>Кроме того, решения ожидают <b>${chPend.length}</b> ${plural(chPend.length, 'обращение', 'обращения', 'обращений')} на благотворительность на сумму ${money(sum(chPend, 'amount'))}.</p>
        ${concl('повестку заседания целесообразно сформировать не позднее чем за 5 рабочих дней.')}`;
    } },
    // статистика по статусам / количество
    { test: d => /сколько|статус|количеств|всего|сводк|общ(ая|ий|ее)/.test(d.s) || d.region || d.dzo || d.direction, run: d => {
      const list = filterScope(PROJECTS, d);
      const sc = scope(d);
      if (!list.length) return `<p>По запросу ${sc ? `(${sc}) ` : ''}проекты не найдены.</p>`;
      const st = (s) => list.filter(p => p.status === s).length;
      const top = list.slice().sort((a, b) => b.budget - a.budget).slice(0, 5);
      const hi = active(list).filter(p => p.risk === 'Высокий').length, od = list.filter(p => p.overdue).length;
      return `<p>${sc ? `<b>${sc}</b>: ` : 'Портфель социальных проектов: '}<b>${list.length}</b> ${plural(list.length, 'проект', 'проекта', 'проектов')} на сумму <b>${money(sum(list, 'budget'))}</b>, освоено ${Math.round(sum(list, 'spent') / sum(list, 'budget') * 100)}%.</p>
        ${kpis([['В работе', st('В работе')], ['Завершено', st('Завершено')], ['На контроле', st('На контроле')]])}
        <p>Крупнейшие проекты:</p>${table(top, [C.name, C.budget, C.prog, C.status])}
        ${concl(od || hi ? `внимания требуют ${od} ${plural(od, 'просроченный проект', 'просроченных проекта', 'просроченных проектов')} и ${hi} ${plural(hi, 'проект', 'проекта', 'проектов')} с высоким риском.` : 'просроченных проектов и проектов с высоким риском нет.')}`;
    } }
  ];

  function answer(q) {
    const d = detect(q);
    for (const it of INTENTS) if (it.test(d)) return it.run(d);
    return `<p>Я анализирую данные KMG Social Hub: проекты, бюджеты, риски, ДЗО, благотворительность, обращения работников, документы и календарь контроля.</p>
      <p>Попробуйте спросить, например:</p><ul>
      <li>«Какие проекты сейчас имеют высокий риск?»</li><li>«Сколько средств освоено по социальным проектам?»</li>
      <li>«Какие ДЗО имеют просроченные проекты?»</li><li>«Проекты Атырауской области»</li><li>«Что вынести на комиссию?»</li></ul>`;
  }

  const SUGGEST = [
    'Какие проблемы в реализации проектов и пути решения?',
    'Проанализируй ход реализации проекта СП-25-001',
    'Какие проекты не успеют завершиться в срок?',
    'Статус освоения лимита на благотворительность',
    'Кто не использует или превысил лимит ФГД?',
    'Какие проекты сейчас имеют высокий риск?',
    'Какие проекты в Мангистауской области должны завершиться в ближайшие 30 дней?',
    'Сколько средств освоено по социальным проектам?',
    'Какие ДЗО имеют просроченные проекты?',
    'Покажи проекты, где реализация ниже 70%.',
    'Какие проекты на проверке в КМГ?',
    'Какие у меня задачи?',
    'Сводка по благотворительности',
    'Что вынести на заседание комиссии?',
    'По каким проектам нет документов?'
  ];

  const body = () => document.getElementById('aiBody');
  function add(role, html) {
    const m = document.createElement('div');
    m.className = 'msg ' + role;
    m.innerHTML = html;
    body().appendChild(m);
    m.querySelectorAll('[data-pid]').forEach(tr => tr.onclick = () => { location.hash = '#/project/' + tr.dataset.pid; if (innerWidth < 760) close(); });
    m.querySelectorAll('a[href^="#/"]').forEach(a => a.addEventListener('click', () => { if (innerWidth < 760) close(); }));
    body().scrollTop = body().scrollHeight;
    return m;
  }
  function greet() {
    body().innerHTML = '';
    const a = AGG.attention();
    const u = Core.user;
    const rev = PROJECTS.filter(p => ['SUBMITTED', 'REVIEW'].includes(p.wf)).length, ret = PROJECTS.filter(p => p.wf === 'RETURNED').length;
    add('bot', `<p>Здравствуйте, ${esc(u ? u.name.split(' ')[1] || u.name : '')}! Я AI-помощник KMG Social Hub. Отвечаю на вопросы по проектам, бюджетам, рискам, согласованию, ДЗО и обращениям — <b>только в пределах вашего доступа</b> (${esc(u ? (u.role === 'DZO' ? DZO_BY_ID[u.dzo].short : Core.accessLabel(u)) : '')}).</p>
      <p>Коротко на сегодня: <b>${a.overdue.length}</b> просроченных проектов, <b>${a.high.length}</b> с высоким риском, <b>${rev}</b> на проверке в КМГ, <b>${ret}</b> на доработке. Ваших задач: <b>${Core.taskCount()}</b>.</p>`);
  }
  function ask(q) {
    open();
    add('user', esc(q));
    const t = add('bot', '<div class="typing"><i></i><i></i><i></i></div>');
    setTimeout(() => {
      t.remove();
      let html;
      try { html = answer(q); } catch (e) { console.error(e); html = '<p>Не удалось обработать запрос. Попробуйте переформулировать вопрос.</p>'; }
      add('bot', html);
    }, 550 + Math.random() * 400);
  }
  function open() {
    document.getElementById('aiPanel').classList.add('open');
    document.getElementById('aiFab').classList.add('hidden');
    if (!body().children.length) greet();
    setTimeout(() => document.getElementById('aiText').focus(), 50);
  }
  function close() {
    document.getElementById('aiPanel').classList.remove('open');
    document.getElementById('aiFab').classList.remove('hidden');
  }
  function init() {
    document.getElementById('aiFab').onclick = open;
    document.getElementById('aiClose').onclick = close;
    document.getElementById('aiClear').onclick = greet;
    document.getElementById('aiSuggest').innerHTML = SUGGEST.map(s => `<button type="button">${s}</button>`).join('');
    document.querySelectorAll('#aiSuggest button').forEach(b => b.onclick = () => ask(b.textContent));
    document.getElementById('aiForm').onsubmit = (e) => {
      e.preventDefault();
      const v = document.getElementById('aiText').value.trim();
      if (!v) return;
      document.getElementById('aiText').value = '';
      ask(v);
    };
  }
  function reset() { if (body()) body().innerHTML = ''; }
  window.AI = { init, ask, open, close, answer, reset };
})();

</script>
  <script>
/* Оболочка приложения: авторизация, навигация по ролям, профиль, демо-режим, маршрутизация */
(function () {
  'use strict';
  const { PROJECTS, DZO, DZO_BY_ID, CHARITY, DOCUMENTS, EVENTS, USERS, TODAY } = DB;
  const { icon, hydrateIcons, esc, initials, destroyCharts, destroyMaps, openModal, closeDrawer, toast, toastErr } = UI;

  const NAV = [
    { sep: 'Мониторинг' },
    { id: 'dashboard', label: 'Dashboard', ico: 'dashboard', href: '#/dashboard' },
    { id: 'projects', label: 'Проекты', ico: 'list', href: '#/projects', badge: () => PROJECTS.filter(p => p.overdue).length },
    { id: 'inbox', label: 'Входящие', ico: 'inbox', href: '#/inbox', roles: ['ADMIN', 'KMG'], badge: () => PROJECTS.filter(p => ['SUBMITTED', 'REVIEW'].includes(p.wf)).length, tone: 'warn' },
    { id: 'tasks', label: 'Мои задачи', ico: 'check', href: '#/tasks', badge: () => Core.taskCount(), tone: 'info' },
    { id: 'map', label: 'Карта', ico: 'pin', href: '#/map' },
    { id: 'analytics', label: 'Аналитика', ico: 'chart', href: '#/analytics' },
    { sep: 'Социальная сфера' },
    { id: 'kb', label: 'База знаний', ico: 'folder', href: '#/kb' },
    { id: 'finance', label: 'Лимит и ФГД', ico: 'wallet', href: '#/finance' },
    { id: 'charity', label: 'Благотворительность', ico: 'heart', href: '#/charity' },
    { id: 'support', label: 'Социальная поддержка', ico: 'users', href: '#/support' },
    { id: 'dzo', label: 'ДЗО', ico: 'building', href: '#/dzo' },
    { sep: 'Контроль' },
    { id: 'documents', label: 'Документы', ico: 'file', href: '#/documents', badge: () => DOCUMENTS.filter(d => d.statusIdx <= 2 && d.due < TODAY).length },
    { id: 'calendar', label: 'Календарь контроля', ico: 'calendar', href: '#/calendar', badge: () => EVENTS.filter(e => e.overdue).length },
    { id: 'notifications', label: 'Уведомления', ico: 'bell', href: '#/notifications', badge: () => Core.unreadCount(), tone: 'info' },
    { id: 'admin', label: 'Администрирование', ico: 'shield', href: '#/admin/users', roles: ['ADMIN'] }
  ];
  const TITLES = { kb: 'База знаний', finance: 'Лимит и ФГД', dashboard: 'Dashboard', projects: 'Проекты', project: 'Карточка проекта', inbox: 'Входящие', tasks: 'Мои задачи', map: 'Карта', analytics: 'Аналитика', charity: 'Благотворительность', support: 'Социальная поддержка', dzo: 'ДЗО', documents: 'Документы', calendar: 'Календарь контроля', notifications: 'Уведомления', audit: 'Журнал изменений', admin: 'Администрирование', profile: 'Мой профиль' };
  const DEMO = [['u1', 'ADMIN', 'Администратор', '#C93838'], ['u15', 'Руководитель', 'только просмотр', '#B87800'], ['u3', 'КМГ', 'КМГ · все ДЗО', '#1D5FBF'], ['u4', 'КМГ', 'КМГ · 3 ДЗО', '#3FA2F7'], ['u6', 'ДЗО №1', 'Озенмунайгаз', '#178A4E'], ['u7', 'ДЗО №2', 'Эмбамунайгаз', '#1BAF7A']];

  function renderNav(active) {
    const role = Core.user.role;
    const items = NAV.filter(n => !n.roles || n.roles.includes(role));
    document.getElementById('nav').innerHTML = items.map((n, i) => {
      if (n.sep) return items[i + 1] && !items[i + 1].sep ? `<div class="nav-sep">${n.sep}</div>` : '';
      const b = n.badge ? n.badge() : 0;
      return `<a href="${n.href}" class="${n.id === active ? 'active' : ''}">${icon(n.ico)}<span>${n.label}</span>${b ? `<span class="badge-count" ${n.tone ? `style="background:${n.tone === 'warn' ? 'rgba(224,161,0,.95)' : 'rgba(63,162,247,.9)'}"` : ''}>${b}</span>` : ''}</a>`;
    }).join('');
    const u = Core.user;
    document.getElementById('sidebarFoot').innerHTML = `<div class="sidebar-foot-title">${u.role === 'DZO' ? esc(DZO_BY_ID[u.dzo].short) + ' · ' : ''}${Core.ROLE_LABEL[u.role]}</div>
      <div class="sidebar-foot-sub">Доступ: ${esc(Core.accessLabel(u))}</div><div class="sidebar-foot-ver">MVP · демо-данные · v2.0</div>`;
  }
  function crumbs(parts) {
    document.getElementById('crumbs').innerHTML = parts.map((p, i) => i < parts.length - 1 ? `<a href="${p[1]}">${esc(p[0])}</a><span>/</span>` : `<b>${esc(p[0])}</b>`).join('');
  }

  /* ---------------- шапка ---------------- */
  function renderProfile() {
    const u = Core.user;
    const unread = Core.unreadCount();
    const box = document.getElementById('profileBox');
    box.innerHTML = `<div class="avatar">${initials(u.name)}</div>
      <div class="profile-text"><div class="profile-name">${esc(Core.shortName(u))} <span class="role-chip ${Core.ROLE_CLS[u.role]}">${u.role}</span></div><div class="profile-role">${esc(u.org)}</div></div>
      <div class="menu" id="profileMenu">
        <div class="mh"><b>${esc(u.name)}</b><span>${esc(u.position || '')}</span><span>${esc(u.org)} · ${Core.ROLE_LABEL[u.role]}</span></div>
        <a href="#/profile">${icon('users')}Мой профиль</a>
        <a href="#/projects?mine=1">${icon('folder')}Мои проекты</a>
        <a href="#/notifications">${icon('bell')}Уведомления${unread ? `<span class="cnt">${unread}</span>` : ''}</a>
        <a href="#/profile" data-settings>${icon('refresh')}Настройки</a>
        <div class="sep"></div>
        <button class="danger" id="logoutBtn">${icon('arrowL')}Выйти</button>
      </div>`;
    box.onclick = (e) => {
      if (e.target.closest('.menu a, .menu button')) { document.getElementById('profileMenu').classList.remove('open'); return; }
      if (e.target.closest('.menu')) return;
      document.getElementById('demoMenu')?.classList.remove('open');
      document.getElementById('profileMenu').classList.toggle('open');
    };
    box.querySelector('[data-settings]').onclick = () => setTimeout(() => { const s = document.getElementById('settings'); s && s.scrollIntoView({ behavior: 'smooth' }); }, 150);
    document.getElementById('logoutBtn').onclick = (e) => { e.stopPropagation(); logout(); };
    document.getElementById('bellDot').style.display = unread ? '' : 'none';
    document.getElementById('bellBtn').title = unread ? `Непрочитанных уведомлений: ${unread}` : 'Уведомления';
  }
  function renderDemo() {
    const u = Core.user;
    const el = document.getElementById('demoSwitch');
    el.innerHTML = `<button class="demo-btn" id="demoBtn" title="Режим демонстрации: быстрое переключение пользователя">${icon('users')}<span class="lbl">Демо: ${DEMO.find(d => d[0] === u.id)?.[1] || u.role}</span></button>
      <div class="menu demo-menu" id="demoMenu"><div class="mh"><b>Режим демонстрации</b><span>Интерфейс и данные будут показаны с правами выбранного пользователя</span></div>
      ${DEMO.map(([id, lbl, sub, color]) => { const x = USERS.find(z => z.id === id); if (!x) return ''; return `<button class="dm ${id === u.id ? 'cur' : ''}" data-du="${id}"><span class="av" style="background:${color}">${lbl === 'Руководитель' ? 'РК' : lbl.replace('ДЗО ', '').replace('№', '')}</span><span><b style="font-size:13px">${lbl}</b> <small>${esc(x.email)} · ${sub}</small></span>${id === u.id ? icon('check') : ''}</button>`; }).join('')}</div>`;
    document.getElementById('demoBtn').onclick = (e) => { e.stopPropagation(); document.getElementById('profileMenu')?.classList.remove('open'); document.getElementById('demoMenu').classList.toggle('open'); };
    el.querySelectorAll('[data-du]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      const r = Core.demoSwitch(b.dataset.du);
      if (r.error) { toastErr(r.error); return; }
      document.getElementById('demoMenu').classList.remove('open');
      resetStates();
      toast(`Вы вошли как ${esc(r.user.name)} (${r.user.role})`);
      if (location.hash === '#/dashboard') route(); else location.hash = '#/dashboard';
      refreshChrome();
    });
  }
  document.addEventListener('click', (e) => { if (!e.target.closest('#profileBox, #demoSwitch')) document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open')); });
  function refreshChrome() {
    if (!Core.user) return;
    renderProfile(); renderDemo();
    const cur = (location.hash.replace(/^#\/?/, '').split(/[/?]/)[0]) || 'dashboard';
    renderNav(cur === 'project' ? 'projects' : cur);
    applyThemeIcon();
    const s = document.getElementById('aiSub'); if (s) s.textContent = `Данные в пределах доступа: ${Core.user.role === 'DZO' ? DZO_BY_ID[Core.user.dzo].short : Core.accessLabel(Core.user)}`;
  }
  function resetStates() {
    const S = window.STATE;
    Object.assign(S.reg, Pages.blankReg());
    ['dash', 'map'].forEach(k => { if (S[k]) Object.keys(S[k]).forEach(x => S[k][x] = ''); });
    if (window.AI && AI.reset) AI.reset();
  }

  /* ---------------- маршрутизация ---------------- */
  function route() {
    if (!Core.user) { showLogin(); return; }
    const raw = location.hash.replace(/^#\/?/, '') || 'dashboard';
    const [path, qs] = raw.split('?');
    const [page, id] = path.split('/');
    const params = new URLSearchParams(qs || '');
    destroyCharts(); destroyMaps();
    UI.closeModal(); closeDrawer();
    closeSidebar();
    document.querySelectorAll('.menu.open').forEach(m => m.classList.remove('open'));
    const nav = page === 'project' ? 'projects' : page;
    renderNav(nav);
    try {
      switch (page) {
        case 'projects': Pages.projects(params); crumbs([['Dashboard', '#/dashboard'], [params.get('mine') || STATE.reg.mine ? 'Мои проекты' : 'Проекты']]); break;
        case 'project': { const p = Pages2.project(id, params); crumbs([['Проекты', '#/projects'], [p ? p.code : 'Проект']]); break; }
        case 'inbox': Pages2.inbox(); crumbs([['Dashboard', '#/dashboard'], ['Входящие на проверку']]); break;
        case 'tasks': Pages2.tasksPage(params); crumbs([['Dashboard', '#/dashboard'], ['Мои задачи']]); break;
        case 'map': Pages2.mapPage(params); crumbs([['Dashboard', '#/dashboard'], ['Карта проектов']]); break;
        case 'kb': { const parts = path.split('/'); KBUI.page(parts[1] || '', parts[2], params); crumbs([['База знаний', '#/kb'], [{ '': 'Обзор и поиск', cases: 'Реестр кейсов', case: parts[2] || 'Кейс', docs: 'Документы', doc: 'Документ', rules: 'Правила и ВНД', quality: 'Контроль качества', sources: 'Источники', assistant: 'AI-ассистент' }[parts[1] || ''] || 'База знаний']]); break; }
        case 'finance': Finance.page(params); crumbs([['Dashboard', '#/dashboard'], ['Лимит на благотворительность и ФГД']]); break;
        case 'charity': Pages.charity(); crumbs([['Dashboard', '#/dashboard'], ['Благотворительность']]); break;
        case 'support': Pages.support(); crumbs([['Dashboard', '#/dashboard'], ['Социальная поддержка']]); break;
        case 'dzo':
          if (id) { const z = Pages.dzoPage(id); crumbs([['ДЗО', '#/dzo'], [z ? z.short : 'ДЗО']]); }
          else if (Core.user.role === 'DZO') { location.replace('#/dzo/' + Core.user.dzo); return; }
          else { Pages.dzoList(); crumbs([['Dashboard', '#/dashboard'], ['ДЗО']]); }
          break;
        case 'documents': Pages.documents(); crumbs([['Dashboard', '#/dashboard'], ['Документы']]); break;
        case 'calendar': Pages.calendar(); crumbs([['Dashboard', '#/dashboard'], ['Календарь контроля']]); break;
        case 'analytics': Pages.analytics(); crumbs([['Dashboard', '#/dashboard'], ['Аналитика']]); break;
        case 'notifications': Pages2.notifications(); crumbs([['Dashboard', '#/dashboard'], ['Уведомления']]); break;
        case 'audit': location.replace(Core.can('admin') ? '#/admin/audit' : '#/projects'); return;
        case 'admin': Admin.page(id); crumbs([['Администрирование', '#/admin/users'], [{ users: 'Пользователи', dzo: 'ДЗО', roles: 'Роли и права', audit: 'Системный журнал', dirs: 'Справочники', settings: 'Настройки' }[id] || 'Пользователи']]); break;
        case 'profile': Pages2.profile(); crumbs([['Dashboard', '#/dashboard'], ['Мой профиль']]); break;
        default: Pages2.dashboard(); crumbs([['Dashboard']]); renderNav('dashboard');
      }
    } catch (e) {
      console.error(e);
      document.getElementById('view').innerHTML = `<div class="empty">Ошибка отображения страницы: ${esc(e.message)}</div>`;
    }
    renderProfile();
    document.title = `${TITLES[page] || 'Dashboard'} · KMG Social Hub`;
    if (page !== 'project' || !params.get('keep')) window.scrollTo(0, 0);
  }
  function showLogin() {
    destroyCharts(); destroyMaps();
    document.getElementById('view').innerHTML = '';
    document.title = 'Вход · KMG Social Hub';
    Pages2.login(() => { resetStates(); refreshChrome(); if (location.hash !== '#/dashboard') location.hash = '#/dashboard'; else route(); toast(`Добро пожаловать, ${esc(Core.user.name.split(' ')[1] || Core.user.name)}`); });
  }
  function logout() {
    Core.logout();
    if (window.AI) AI.close();
    location.hash = '#/login';
    showLogin();
  }

  // Sidebar (mobile)
  const sb = () => document.getElementById('sidebar');
  const bd = () => document.getElementById('sidebarBackdrop');
  function closeSidebar() { sb().classList.remove('open'); bd().classList.remove('open'); }

  // Theme
  function applyThemeIcon() {
    const dark = document.documentElement.dataset.theme === 'dark' || (!document.documentElement.dataset.theme && matchMedia('(prefers-color-scheme: dark)').matches);
    document.getElementById('themeBtn').innerHTML = icon(dark ? 'sun' : 'moon');
    return dark;
  }
  function initTheme() {
    try { const t = localStorage.getItem('kmg-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) { }
    applyThemeIcon();
    document.getElementById('themeBtn').onclick = () => {
      const next = applyThemeIcon() ? 'light' : 'dark';
      document.documentElement.dataset.theme = next;
      try { localStorage.setItem('kmg-theme', next); } catch (e) { }
      applyThemeIcon();
      route();
    };
  }

  // Global search — ищет только в данных, доступных пользователю
  function initSearch() {
    const input = document.getElementById('globalSearch');
    const box = document.getElementById('searchResults');
    const run = () => {
      const q = input.value.trim().toLowerCase();
      if (q.length < 2 || !Core.user) { box.classList.remove('open'); return; }
      const res = [];
      PROJECTS.filter(p => (p.name + p.code + p.region).toLowerCase().includes(q)).slice(0, 6).forEach(p => res.push({ t: `Проект · ${p.code} · ${p.wfLabel}`, n: p.name, h: '#/project/' + p.id }));
      DZO.filter(z => (z.name + z.short).toLowerCase().includes(q)).forEach(z => res.push({ t: 'ДЗО', n: z.name, h: '#/dzo/' + z.id }));
      CHARITY.filter(c => (c.org + c.id + c.applicant).toLowerCase().includes(q)).slice(0, 4).forEach(c => res.push({ t: 'Обращение · ' + c.id, n: c.org, ch: c.id }));
      DOCUMENTS.filter(d => (d.title + d.number).toLowerCase().includes(q)).slice(0, 3).forEach(d => res.push({ t: 'Документ · ' + d.number, n: d.title, doc: d.id }));
      if (Core.can('admin')) USERS.filter(u => (u.name + u.email).toLowerCase().includes(q)).slice(0, 3).forEach(u => res.push({ t: 'Пользователь · ' + u.role, n: `${u.name} (${u.email})`, h: '#/admin/users' }));
      box.innerHTML = res.length ? res.map((r, i) => `<div class="sr-item" data-i="${i}"><div class="sr-type">${r.t}</div><div>${esc(r.n)}</div></div>`).join('') : '<div class="sr-empty">Ничего не найдено в пределах вашего доступа</div>';
      box.classList.add('open');
      box.querySelectorAll('[data-i]').forEach(el => el.onmousedown = (e) => {
        e.preventDefault();
        const r = res[+el.dataset.i];
        box.classList.remove('open'); input.value = ''; input.blur();
        if (r.h) location.hash = r.h; else if (r.ch) Pages.charityModal(r.ch); else if (r.doc) Pages.docModal(r.doc);
      });
    };
    input.addEventListener('input', run);
    input.addEventListener('focus', run);
    input.addEventListener('blur', () => setTimeout(() => box.classList.remove('open'), 150));
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const first = box.querySelector('[data-i]'); if (first) first.dispatchEvent(new MouseEvent('mousedown')); } });
  }

  function init() {
    Core.load();
    hydrateIcons();
    document.getElementById('menuBtn').innerHTML = icon('menu');
    document.getElementById('bellBtn').insertAdjacentHTML('afterbegin', icon('bell'));
    const d = new Date();
    const wd = d.toLocaleDateString('ru-RU', { weekday: 'long' });
    document.getElementById('todayLabel').innerHTML = `${wd[0].toUpperCase() + wd.slice(1)}, <b>${d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' })}</b>`;
    document.getElementById('menuBtn').onclick = () => { sb().classList.add('open'); bd().classList.add('open'); };
    bd().onclick = closeSidebar;
    document.getElementById('bellBtn').onclick = () => Pages2.notifDrawer();
    initTheme(); initSearch(); AI.init();
    window.addEventListener('hashchange', () => { if (location.hash === '#/login' && Core.user) { location.hash = '#/dashboard'; return; } route(); });
    matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', () => { if (!document.documentElement.dataset.theme) { applyThemeIcon(); route(); } });
    if (Core.restore()) {
      document.body.classList.remove('auth-off');
      refreshChrome();
      if (location.hash === '#/login') location.hash = '#/dashboard'; else route();
    } else showLogin();
    window.addEventListener('beforeunload', () => Core.save());
  }
  window.App = { refreshChrome, route, logout };
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();

</script>
</body>
</html>
