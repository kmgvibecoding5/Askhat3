  /* =====================================================================
     АНАЛИТИКА: workflow
     ===================================================================== */
  function analyticsWorkflow(ps, Y) {
    const el = document.getElementById('anWf'); if (!el) return;
    const inY = (d) => !Y || d.getFullYear() === Y;
    const cycles = [];
    PROJECTS.forEach(p => {
      let sub = null;
      p.wfHistory.forEach(h => {
        if (h.wf === 'SUBMITTED') sub = h.at;
        if ((h.wf === 'ACCEPTED' || h.wf === 'RETURNED') && sub) { if (inY(h.at)) cycles.push({ days: (h.at - sub) / 86400000, res: h.wf }); sub = null; }
      });
    });
    const avg = cycles.length ? sum(cycles, 'days') / cycles.length : 0;
    const returnsN = cycles.filter(c => c.res === 'RETURNED').length;
    const accepted = PROJECTS.filter(p => p.wfHistory.some(h => h.wf === 'ACCEPTED' && inY(h.at)));
    const firstTime = accepted.filter(p => !p.wfHistory.some(h => h.wf === 'RETURNED')).length;
    const overdue = ps.filter(p => p.overdue).length;
    const aud = Core.visibleAudit().filter(a => inY(a.at) && a.action !== 'Вход в систему');
    const K = H().kpi;
    el.innerHTML = `
      <div class="page-head" style="margin-top:28px"><div><h1 style="font-size:20px">Согласование и активность</h1><div class="sub">Workflow проектов, скорость проверки КМГ и активность участников · ${Y || 'весь период'}</div></div></div>
      <div class="kpis k4">
        ${K({ label: 'Среднее время проверки', value: avg.toFixed(1).replace('.', ','), unit: ' дн.', ico: 'clock', color: 'var(--st-ctrl)', foot: `норматив ${DB.SETTINGS.slaDays} дн. · ${cycles.length} циклов проверки` })}
        ${K({ label: 'Возвратов на доработку', value: returnsN, ico: 'refresh', color: 'var(--c2)', foot: `${cycles.length ? Math.round(returnsN / cycles.length * 100) : 0}% решений КМГ` })}
        ${K({ label: 'Принято с первого раза', value: firstTime, ico: 'check', color: 'var(--st-done)', bar: accepted.length ? firstTime / accepted.length * 100 : 0, foot: `${accepted.length ? Math.round(firstTime / accepted.length * 100) : 0}% из ${accepted.length} принятых` })}
        ${K({ label: 'Просроченных проектов', value: overdue, ico: 'alert', color: 'var(--bad)', foot: `${ps.length ? Math.round(overdue / ps.length * 100) : 0}% портфеля периода` })}
      </div>
      <div class="cols-2 mb16">
        <div class="card"><div class="card-head"><h3>Проекты по статусам workflow</h3><span class="hint">количество</span></div><div class="card-body"><div class="chart-box"><canvas id="aWf"></canvas></div></div></div>
        <div class="card"><div class="card-head"><h3>Динамика реализации проектов</h3><span class="hint">${Y ? 'по месяцам' : 'по кварталам'}</span></div><div class="card-body"><div class="chart-box"><canvas id="aSD"></canvas></div>${H().legend([[cssVar('--c1'), 'Начата реализация'], [cssVar('--st-done'), 'Завершено']])}</div></div>
      </div>
      <div class="cols-3">
        <div class="card"><div class="card-head"><h3>Активность ДЗО</h3><span class="hint">действий в системе</span></div><div class="card-body"><div class="chart-box"><canvas id="aActD"></canvas></div></div></div>
        <div class="card"><div class="card-head"><h3>Активность пользователей</h3><span class="hint">топ-8 по действиям</span></div><div class="card-body"><div class="chart-box"><canvas id="aActU"></canvas></div></div></div>
        <div class="card"><div class="card-head"><h3>Динамика изменения бюджета</h3><span class="hint">утверждённый портфель, млн ₸</span></div><div class="card-body"><div class="chart-box"><canvas id="aBudD"></canvas></div></div></div>
      </div>`;
    const wfKeys = WF_KEYS.filter(k => ps.some(p => p.wf === k));
    makeChart('aWf', { type: 'bar', data: { labels: wfKeys.map(k => WF[k].label), datasets: [{ data: wfKeys.map(k => ps.filter(p => p.wf === k).length), backgroundColor: wfKeys.map(WF_COLOR), ...barStyle, maxBarThickness: 18 }] },
      options: Object.assign(baseOptions(), { indexAxis: 'y', scales: axes({ x: { grid: { color: cssVar('--grid') }, border: { display: false }, ticks: { precision: 0 } }, y: { grid: { display: false }, ticks: { autoSkip: false, font: { size: 11 } } } }),
        onClick: (e, els) => { if (els.length) go('#/projects?wf=' + wfKeys[els[0].index]); } }) });
    // старт / завершение
    const nB = 12, bucket = (d) => Y ? (d.getFullYear() === Y ? d.getMonth() : -1) : (d.getFullYear() - 2024) * 4 + Math.floor(d.getMonth() / 3);
    const st = Array(nB).fill(0), dn = Array(nB).fill(0);
    PROJECTS.forEach(p => p.wfHistory.forEach(h => { const b = bucket(h.at); if (b < 0 || b >= nB) return; if (h.wf === 'IMPL') st[b]++; if (h.wf === 'DONE') dn[b]++; }));
    const labels = Y ? MONTHS : ['I', 'II', 'III', 'IV'].flatMap(() => []).concat(...[2024, 2025, 2026].map(y => ['I', 'II', 'III', 'IV'].map(q => `${q}'${String(y).slice(2)}`)));
    makeChart('aSD', { type: 'bar', data: { labels, datasets: [{ label: 'Начата реализация', data: st, backgroundColor: cssVar('--c1'), ...barStyle, maxBarThickness: 14 }, { label: 'Завершено', data: dn, backgroundColor: cssVar('--st-done'), ...barStyle, maxBarThickness: 14 }] },
      options: Object.assign(baseOptions(), { interaction: { mode: 'index', intersect: false }, scales: axes({ y: { ticks: { precision: 0 }, grid: { color: cssVar('--grid') }, border: { display: false }, beginAtZero: true } }) }) });
    // активность ДЗО
    const byD = DZO.map(z => ({ z, n: aud.filter(a => a.dzo === z.id).length })).filter(x => x.n).sort((a, b) => b.n - a.n);
    H().hbar('aActD', byD.map(x => x.z.short), byD.map(x => x.n), { color: cssVar('--c1') });
    const byU = {}; aud.forEach(a => { byU[a.user] = (byU[a.user] || 0) + 1; });
    const topU = Object.entries(byU).filter(([id]) => Core.userById(id)).sort((a, b) => b[1] - a[1]).slice(0, 8);
    H().hbar('aActU', topU.map(([id]) => Core.shortName(Core.userById(id)) + ' · ' + Core.userById(id).role), topU.map(x => x[1]), { color: cssVar('--c7') });
    // бюджет портфеля по мере принятия проектов
    const pts = [];
    const periods = Y ? MONTHS.map((m, i) => new Date(Y, i + 1, 1)) : [2024, 2025, 2026].flatMap(y => [3, 6, 9, 12].map(mm => new Date(y, mm, 1)));
    periods.forEach(end => {
      const v = sum(PROJECTS.filter(p => { const acc = p.wfHistory.find(h => h.wf === 'ACCEPTED'); return acc && acc.at < end; }), 'budget');
      pts.push(end > addDays(new Date(), 31) ? null : Math.round(v * 10) / 10);
    });
    makeChart('aBudD', { type: 'line', data: { labels, datasets: [{ label: 'Портфель', data: pts, borderColor: cssVar('--c1'), backgroundColor: cssVar('--c1') + '1f', fill: true, borderWidth: 2, pointRadius: 3, pointBackgroundColor: cssVar('--c1'), tension: .25 }] },
      options: Object.assign(baseOptions(), { scales: axes({ y: { beginAtZero: false, grid: { color: cssVar('--grid') }, border: { display: false } } }), plugins: Object.assign(baseOptions().plugins, { tooltip: Object.assign(H().tooltipMoney(), { callbacks: { label: (c) => ' ' + money(c.raw) } }) }) }) });
  }

  window.Pages2 = { login, forbidden, notFound, dashboard, project, projectForm, inbox, tasksPage, mapPage, notifications, notifDrawer, auditPage, profile, analyticsWorkflow, confirmBox, scopePill, auditRow };
})();

</script>

  /* ---------------- Пользователи ---------------- */

  function users() {

          <button class="icon-btn" title="Сбросить пароль" data-ua="reset" data-id="${u.id}">${icon('refresh')}</button>
          ${u.status === 'Активен' ? `<button class="icon-btn" title="Заблокировать" data-ua="block" data-id="${u.id}" style="color:var(--bad)">${icon('x')}</button>` : `<button class="icon-btn" title="Разблокировать" data-ua="unblock" data-id="${u.id}" style="color:var(--ok)">${icon('check')}</button>`}
        </div></td></tr>`).join('') || '<tr><td colspan="9"><div class="empty">Пользователи не найдены</div></td></tr>';
      document.querySelectorAll('[data-ua]').forEach(b => b.onclick = () => {
        const u = USERS.find(x => x.id === b.dataset.id);
        const a = b.dataset.ua;
        if (a === 'open') userCard(u);
        if (a === 'edit') userForm(u);
        if (a === 'access') userForm(u, true);
        if (a === 'reset') Pages2.confirmBox('Сбросить пароль?', `Для <b>${esc(u.email)}</b> будет сгенерирован временный пароль и отправлен на корпоративную почту. В демо-режиме пароль сбрасывается на <b>demo123</b>.`, 'Сбросить', 'btn-primary', () => { if (act(() => Core.resetPassword(u), 'Временный пароль отправлен пользователю')) render(); });

      <div class="seg" id="ufRole">${['ADMIN', 'KMG', 'HEAD', 'DZO'].map(r => `<button type="button" data-r="${r}" class="${v.role === r ? 'active' : ''}">${r} · ${Core.ROLE_LABEL[r]}</button>`).join('')}</div>
      <div class="section-title" style="margin-top:22px" id="ufAccTitle">Доступ к ДЗО</div>
      <label class="check" id="ufAllWrap"><input type="checkbox" id="ufAll" ${isAll ? 'checked' : ''}> <b>Все ДЗО</b> <span class="text-muted">— включая ДЗО, добавленные в будущем</span></label>
      <div class="dzo-checks ${isAll ? 'disabled' : ''}" id="ufDzo">${allDzo.map(z => `<label class="check"><input type="${v.role === 'DZO' ? 'radio' : 'checkbox'}" name="ufd" value="${z.id}" ${!isAll && Array.isArray(v.access) && v.access.includes(z.id) ? 'checked' : ''}> ${z.short} — ${esc(z.name)}</label>`).join('')}</div>
      <div class="lock-note" id="ufNote"></div>`,
      foot: `<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="ufSave">${isNew ? 'Создать' : 'Сохранить'}</button>` });
    let role = v.role;
    const sync = () => {
      document.querySelectorAll('#ufRole [data-r]').forEach(b => b.classList.toggle('active', b.dataset.r === role));
      const allCb = document.getElementById('ufAll');
      if (role === 'ADMIN') { allCb.checked = true; allCb.disabled = true; }
      else if (role === 'DZO') { allCb.checked = false; allCb.disabled = true; }
      else allCb.disabled = false;
      document.querySelectorAll('#ufDzo input').forEach(i => { const was = i.checked; i.type = role === 'DZO' ? 'radio' : 'checkbox'; i.checked = was; });
      if (role === 'DZO') { const ch = [...document.querySelectorAll('#ufDzo input')].filter(i => i.checked); ch.slice(1).forEach(i => i.checked = false); }
      document.getElementById('ufDzo').classList.toggle('disabled', allCb.checked);
      document.getElementById('ufNote').innerHTML = icon('shield') + (role === 'ADMIN' ? 'Администратор имеет полный доступ ко всем ДЗО.' : role === 'DZO' ? 'Пользователь ДЗО видит только проекты своего ДЗО — выберите одно ДЗО.' : 'Пользователь КМГ видит проекты выбранных ДЗО сквозным образом (черновики ДЗО не видны).');
    };
    document.querySelectorAll('#ufRole [data-r]').forEach(b => b.onclick = () => { role = b.dataset.r; sync(); });
    document.getElementById('ufAll').onchange = sync;
    document.getElementById('ufGen').onclick = () => {
      const abc = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789';
      const a = new Uint32Array(10); crypto.getRandomValues(a);
      document.getElementById('ufPwd').value = [...a].map(x => abc[x % abc.length]).join('') + '!';
      document.getElementById('ufPwd').classList.remove('err');
    };
    sync();
    if (focusAccess) setTimeout(() => document.getElementById('ufAccTitle').scrollIntoView({ block: 'center' }), 50);
    document.getElementById('ufSave').onclick = () => {
      const name = document.getElementById('ufName').value.trim(), email = document.getElementById('ufEmail').value.trim();
      if (!name || !/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) { toastErr('Укажите ФИО и корректный e-mail'); return; }
      const sel = [...document.querySelectorAll('#ufDzo input:checked')].map(i => i.value);
      const access = document.getElementById('ufAll').checked ? 'ALL' : sel;
      if (access !== 'ALL' && !access.length) { toastErr('Выберите хотя бы одно ДЗО'); return; }
      if (role === 'DZO' && access.length !== 1) { toastErr('Пользователю ДЗО назначается ровно одно ДЗО'); return; }
      const org = document.getElementById('ufOrg').value.trim() || (role === 'DZO' ? DZO_BY_ID[access[0]].name : 'АО НК «КазМұнайГаз»');
      const data = { name, email, org, position: document.getElementById('ufPos').value.trim(), phone: document.getElementById('ufPhone').value.trim() };
      const pwd = document.getElementById('ufPwd').value.trim();
      const active = document.getElementById('ufActive').checked;
      if ((isNew || pwd) && pwd.length < 6) { document.getElementById('ufPwd').classList.add('err'); toastErr('Пароль должен содержать не менее 6 символов'); return; }
      if (isNew) {
        const nu = act(() => Core.createUser(Object.assign(data, { role, access, pwd, status: active ? 'Активен' : 'Заблокирован' })));
        if (nu) { closeModal(); toast(`Учётная запись ${esc(nu.email)} создана`); users(); }
        return;
      }
      if (u === Core.user && role !== 'ADMIN') { toastErr('Нельзя понизить роль собственной учётной записи'); return; }
      const ok = act(() => {
        Core.updateUser(u, Object.assign(data, { role, access }));
        if (pwd) Core.setPassword(u, pwd);
        if ((u.status === 'Активен') !== active) Core.setUserStatus(u, active ? 'Активен' : 'Заблокирован');
      });
      if (ok) { closeModal(); toast('Изменения сохранены'); users(); window.App && App.refreshChrome(); }
    };
  }

  /* ---------------- ДЗО ---------------- */
  function dzoPage() {
    view().innerHTML = `${nav('dzo')}

    const v = z || { id: '', name: '', short: '', city: '', region: DB.REGIONS[0], head: '', programs: 0, staff: 0 };
    openModal({ title: z ? 'Редактирование ДЗО' : 'Новое ДЗО', width: 680, body: `<div class="form-grid">

      <div class="field"><label>Регион</label><select class="select" id="zReg">${DB.REGIONS.map(r => `<option ${r === v.region ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div class="field"><label>Руководитель соц. направления</label><input class="input" id="zHead" value="${esc(v.head)}"></div>
      <div class="field"><label>Социальных программ</label><input class="input" type="number" id="zProg" value="${v.programs}"></div>
      <div class="field"><label>Численность работников</label><input class="input" type="number" id="zStaff" value="${v.staff}"></div></div>`,
      foot: `<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="zSave">Сохранить</button>` });
    document.getElementById('zSave').onclick = () => {
      const g = (i) => document.getElementById(i).value.trim();
      if (!g('zName') || !g('zShort')) { toastErr('Заполните наименование и код'); return; }
      const data = { name: g('zName'), short: g('zShort'), city: g('zCity'), region: g('zReg'), head: g('zHead'), programs: +g('zProg') || 0, staff: +g('zStaff') || 0 };
      if (z) {
        Object.entries(data).forEach(([k, val]) => { if (z[k] !== val) { Core.audit('Изменены данные ДЗО', 'ДЗО', null, `${z.short}: ${z[k]}`, val, z.id); z[k] = val; } });
        ALL.projects.filter(p => p.dzo === z.id).forEach(p => { p.dzoName = z.name; p.dzoShort = z.short; });
      } else {
        const id = 'z' + Date.now().toString(36);
        const nz = Object.assign({ id }, data);
        ALL.dzo.push(nz); DZO_BY_ID[id] = nz;
        Core.audit('Добавлено ДЗО', 'ДЗО', null, '', `${nz.short} — ${nz.name}`, id);
      }
      Core.applyScope(); closeModal(); toast('ДЗО сохранено'); dzoPage();
    };
  }

  function roles() {

    view().innerHTML = `${nav('roles')}

        ${rows.map(r => `<tr><td class="fw6">${r[0]}</td>${r.slice(1).map(c => `<td>${c.startsWith('<') ? c : `<span class="small text-2">${c}</span>`}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div></div>

        ${T.map(t => `<tr><td>${t[0]}</td><td class="muted">→</td><td class="fw6">${t[1]}</td><td>${t[2]}</td><td class="small text-2">${t[3]}</td></tr>`).join('')}</tbody></table></div></div></div>
      <div class="card"><div class="card-head"><h3>Статусы workflow</h3></div><div class="card-body"><div class="row">${DB.WF_KEYS.map(k => UI.wfBadge(k)).join('')}</div>

      <div class="card"><div class="card-head"><h3>${d.title}</h3><span class="hint">${d.items.length} значений</span></div>

        <div class="card-body flush">${d.items.map((it, i) => `<div class="dir-item"><span>${esc(it)}</span><button class="icon-btn" style="width:28px;height:28px" title="Удалить" data-di="${i}">${icon('x')}</button></div>`).join('')}</div></div></div>`;

      d.items.push(v); Core.audit('Добавлено значение справочника', 'Справочник', null, d.title, v, null); toast('Значение добавлено'); dirs();
    };
    document.querySelectorAll('[data-di]').forEach(b => b.onclick = () => {
      const it = d.items[+b.dataset.di];

      if (used) { toastErr(`Значение «${it}» используется в данных и не может быть удалено`); return; }
      d.items.splice(+b.dataset.di, 1); Core.audit('Удалено значение справочника', 'Справочник', null, `${d.title}: ${it}`, '', null); toast('Значение удалено'); dirs();

  }

        </div></div>

      </div>
      <div class="card mt16"><div class="card-head"><h3>Демонстрационные данные</h3></div><div class="card-body"><div class="set-row"><div class="l"><b>Сбросить к исходным демо-данным</b><span>Все изменения, сделанные в браузере (проекты, пользователи, журнал), будут удалены. Сессия сохранится.</span></div><button class="btn btn-danger" id="stReset">${icon('refresh')}Сбросить данные</button></div></div></div>`;
    document.querySelectorAll('[data-s]').forEach(el => el.onchange = () => {
      const k = el.dataset.s;
      const val = el.type === 'checkbox' ? el.checked : el.type === 'number' ? Math.max(+el.min || 0, Math.min(+el.max || 999, +el.value)) : el.value;
      Core.audit('Изменена настройка', 'Настройки', null, `${k}: ${S[k]}`, String(val), null);
      S[k] = val; toast('Настройка сохранена');
    });
    document.getElementById('stReset').onclick = () => Pages2.confirmBox('Сбросить демо-данные?', 'Все изменения будут потеряны, система вернётся к исходному демонстрационному набору.', 'Сбросить', 'btn-danger', () => Core.resetDemo());
  }

  window.Admin = { page, nav };
})();

</script>
  <script>
/* Движок базы знаний: доступ, индексация, полнотекстовый и смысловой поиск, аналоги, редакции Правил,
   контроль качества, аналитика, аналитическая справка и ассистент. Все выводы строятся только по данным базы. */
(function () {
  'use strict';
  const KB = DB.KB;
  const TODAY = new Date();
  const fdate = (dt) => dt ? dt.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit', year: 'numeric' }) : '—';
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const mln = (m) => m == null ? '—' : m >= 1000 ? (m / 1000).toFixed(2).replace('.', ',') + ' млрд ₸' : (Math.round(m * 10) / 10).toLocaleString('ru-RU') + ' млн ₸';
  const NO_DATA = 'В базе знаний недостаточно данных для формирования достоверного вывода.';

  /* ---------------- разграничение доступа ---------------- */
  const CLEAR = { ADMIN: 3, HEAD: 3, KMG: 2, DZO: 1 };
  function canDoc(doc, u = Core.user) {
    if (!u || !doc) return false;
    if ((doc.conf || 0) > (CLEAR[u.role] ?? 0)) return false;
    if (u.role === 'DZO') return doc.dzo === u.dzo || (!doc.dzo && (doc.conf || 0) === 0);
    if (doc.dzo && !Core.hasDzo(doc.dzo, u)) return false;
    return true;
  }
  function canCase(c, u = Core.user) {
    if (!u || !c) return false;
    if ((c.conf || 0) > (CLEAR[u.role] ?? 0)) return false;
    if (u.role === 'DZO') return c.dzo === u.dzo;
    if (c.dzo && !Core.hasDzo(c.dzo, u)) return false;
    return true;
  }
  const docs = () => KB.DOCS.filter(d => canDoc(d));
  const cases = () => KB.CASES.filter(c => canCase(c));
  const doc = (id) => KB.DOCS.find(d => d.id === id);
  const kcase = (id) => KB.CASES.find(c => c.id === id);
  const can = (a) => {
    const r = Core.user && Core.user.role;
    return { add: ['ADMIN', 'KMG', 'DZO'], brief: ['ADMIN', 'KMG', 'HEAD'], quality: ['ADMIN', 'KMG'], sources: ['ADMIN'], analytics: ['ADMIN', 'KMG', 'HEAD', 'DZO'] }[a].includes(r);
  };

  /* ---------------- текст: токены, основы, синонимы ---------------- */
  const ENDINGS = ['иями', 'ями', 'ами', 'ого', 'его', 'ому', 'ему', 'ыми', 'ими', 'ией', 'иях', 'ах', 'ях', 'ий', 'ый', 'ой', 'ая', 'яя', 'ое', 'ее', 'ые', 'ие', 'ов', 'ев', 'ам', 'ям', 'ом', 'ем', 'ую', 'юю', 'ия', 'ья', 'ей', 'ии', 'ию', 'ть', 'ы', 'и', 'а', 'я', 'о', 'е', 'у', 'ю', 'ь'];
  const STOP = new Set(['и', 'в', 'во', 'на', 'по', 'для', 'с', 'со', 'о', 'об', 'от', 'за', 'из', 'к', 'до', 'при', 'не', 'что', 'как', 'это', 'или', 'ли', 'был', 'были', 'было', 'все', 'всех', 'ранее', 'также', 'году', 'годы', 'год', 'годов', 'покажи', 'какие', 'какая', 'какой', 'каких', 'кто', 'где', 'есть', 'был', 'которые', 'которым', 'этому', 'этот', 'этой', 'данного', 'данному', 'подобных', 'аналогичные', 'аналогичных', 'аналогичным', 'похожие', 'тенге', 'млн', 'млрд', 'сумма', 'стоимостью', 'стоимость', 'стоимости', 'благотворительная', 'благотворительной', 'благотворительную', 'благотворительности', 'благотворительные', 'помощь', 'помощи', 'проекты', 'проектам', 'проектов', 'проекту', 'обращения', 'обращениям', 'обращений', 'обращению', 'кейсы', 'кейсов', 'решения', 'данного', 'покажи', 'найди', 'принимались', 'применялись', 'встречались', 'рассматривала', 'запрашивалась']);
  const stem = (w) => { if (w.length <= 4) return w; for (const e of ENDINGS) if (w.endsWith(e) && w.length - e.length >= 4) return w.slice(0, -e.length); return w; };
  const tokens = (s) => (String(s || '').toLowerCase().replace(/ё/g, 'е').match(/[a-zа-яәғқңөұүһі0-9]+/g) || []).filter(t => t.length >= 2 && !STOP.has(t)).map(stem);
  const SYN = [
    ['футбол', 'фк', 'клуб', 'спорт', 'спортивн', 'команд', 'академ', 'секци'],
    ['бокс', 'шахмат', 'турнир', 'чемпионат', 'соревнован'],
    ['медицин', 'больниц', 'поликлин', 'здравоохранен', 'клиник', 'медучрежден', 'лечен', 'онколог', 'скор'],
    ['акимат', 'госорган', 'государствен', 'исполнительн'],
    ['отказ', 'отклон', 'отказа'],
    ['содержан', 'коммунальн', 'заработн', 'зарплат', 'текущ'],
    ['школ', 'образован', 'интернат', 'учебн', 'учащ', 'гимназ', 'обучен'],
    ['паводк', 'паводок', 'наводнен', 'чрезвычайн', 'пострада'],
    ['комплаенс', 'аффилирован', 'конфликт', 'благонадежн', 'репутац'],
    ['договор', 'соглашен', 'контракт'],
    ['отчет', 'отчетн', 'целев'],
    ['фонд', 'оф', 'некоммерческ'],
    ['многодетн', 'малообеспечен', 'уязвим', 'пожил', 'семь']
  ];
  const SYN_CANON = {};
  SYN.forEach(g => g.forEach(s => { SYN_CANON[s] = g[0]; }));
  const canon = (t) => { if (SYN_CANON[t]) return SYN_CANON[t]; for (const k in SYN_CANON) if (k.length >= 4 && t.startsWith(k)) return SYN_CANON[k]; return t; };
  // термин → вес; origin — исходное слово запроса (для оценки полноты совпадения смысла)
  const ORIGIN = new Map();
  function expand(qTokens) {
    const out = new Map();
    ORIGIN.clear();
    qTokens.forEach(t => {
      out.set(t, Math.max(out.get(t) || 0, 1)); ORIGIN.set(t, t);
      SYN.forEach(g => { if (g.some(s => t.startsWith(s) || (t.length >= 4 && s.startsWith(t)))) g.forEach(s => { if (!out.has(s)) { out.set(s, 0.55); ORIGIN.set(s, t); } }); });
    });
    return out;
  }

  /* ---------------- индекс ---------------- */
  let INDEX = null, indexedAt = null;
  const caseText = (c) => [c.title, c.purpose, c.description, c.applicant, c.applicantType, c.recipient, c.recipientCat, c.direction, c.aidType, c.region, c.locality, c.refusalText, c.org, ...(c.conclusions || []).map(x => x.text), ...(c.decisions || []).map(x => x.text), ...(c.keywords || [])].join(' ');
  const docText = (d) => [d.title, d.type, d.org, d.number, d.text, ...(d.sections || []).map(s => s.title + ' ' + s.text), ...(d.keywords || [])].join(' ');
  function buildIndex() {
    const t0 = performance.now();
    const items = [];
    KB.CASES.forEach(c => items.push({ kind: 'case', id: c.id, toks: tokens(caseText(c)) }));
    KB.DOCS.forEach(d => items.push({ kind: 'doc', id: d.id, toks: tokens(docText(d)) }));
    const dfm = new Map();
    items.forEach(it => { it.tf = new Map(); it.toks.forEach(t => it.tf.set(t, (it.tf.get(t) || 0) + 1)); it.len = it.toks.length; it.tf.forEach((v, t) => dfm.set(t, (dfm.get(t) || 0) + 1)); });
    const avg = items.reduce((s, x) => s + x.len, 0) / Math.max(1, items.length);
    INDEX = { items, df: dfm, N: items.length, avg, ms: Math.round(performance.now() - t0) };
    indexedAt = new Date();
    return INDEX;
  }
  const idx = () => INDEX || buildIndex();
  function score(item, q) {
    const I = idx(); let s = 0; const hit = [];
    q.forEach((w, t) => {
      let tf = item.tf.get(t) || 0;
      if (!tf && t.length >= 4) item.tf.forEach((v, k) => { if (k.startsWith(t)) tf += v; });
      if (!tf) return;
      const df = I.df.get(t) || 1;
      const idf = Math.log(1 + (I.N - df + 0.5) / (df + 0.5));
      s += w * idf * (tf * 2.2) / (tf + 1.2 * (0.25 + 0.75 * item.len / I.avg));
      hit.push(t);
    });
    return { s, hit };
  }

  /* ---------------- разбор запроса ---------------- */
  const REGION_STEMS = () => DB.REGIONS.map(r => [r.toLowerCase().replace('г. ', '').slice(0, 6), r]);
  function parseQuery(q) {
    const s = ' ' + q.toLowerCase().replace(/ё/g, 'е') + ' ';
    const f = {};
    let m = s.match(/(20\d\d)\s*[–—-]\s*(20\d\d)/);
    if (m) f.years = [+m[1], +m[2]];
    else { const ys = [...s.matchAll(/\b(20\d\d)\b/g)].map(x => +x[1]); if (ys.length) f.years = [Math.min(...ys), Math.max(...ys)]; }
    m = s.match(/(более|свыше|больше|от|выше)\s*([\d\s.,]+)\s*(млрд|млн|тыс)?/);
    if (m) { const v = parseFloat(m[2].replace(/\s/g, '').replace(',', '.')); if (v) f.minAmount = m[3] === 'млрд' ? v * 1000 : m[3] === 'тыс' ? v / 1000 : m[3] === 'млн' ? v : v >= 1e5 ? v / 1e6 : v; }
    m = s.match(/(менее|меньше|до|ниже)\s*([\d\s.,]+)\s*(млрд|млн|тыс)/);
    if (m) { const v = parseFloat(m[2].replace(/\s/g, '').replace(',', '.')); f.maxAmount = m[3] === 'млрд' ? v * 1000 : m[3] === 'тыс' ? v / 1000 : v; }
    for (const [st, r] of REGION_STEMS()) if (st.length >= 5 && s.includes(st)) { f.region = r; break; }
    const dz = DB.ALL.dzo.find(z => s.includes(' ' + z.short.toLowerCase() + ' ') || s.includes(z.name.toLowerCase().replace(/^(ао|тоо) /, '').replace(/[«»]/g, '').slice(0, 8)));
    if (dz) f.dzo = dz.id;
    if (/совет[а-я]* директор/.test(s)) f.body = 'Совет директоров'; else if (/правлени/.test(s)) f.body = 'Правление'; else if (/комисси/.test(s)) f.body = 'Комиссия';
    if (/отказ|отклон/.test(s)) f.result = 'refused'; else if (/одобрен|согласован/.test(s)) f.result = 'approved';
    if (/акимат/.test(s)) f.applicantType = 'Акимат'; else if (/физическ/.test(s)) f.applicantType = 'Физическое лицо'; else if (/\bфонд/.test(s)) f.applicantType = 'Фонд';
    if (/спонсор/.test(s)) f.aidType = 'Спонсорская';
    if (/комплаенс/.test(s)) f.concl = 'Заключение Службы комплаенс'; else if (/дучр/.test(s)) f.concl = 'Заключение ДУЧР'; else if (/риск-подраздел|управлени[яю] риск|риск подраздел/.test(s)) f.concl = 'Заключение подразделения по управлению рисками';
    if (/судеб/.test(s)) f.court = true;
    let text = s;
    ['более', 'свыше', 'больше', 'менее', 'меньше', 'акимат', 'комисси', 'правлен', 'совет', 'директор', 'отказ', 'одобрен', 'решени', 'основани', 'замечани', 'служб', 'редакци', 'правил', 'дату', 'рассмотрени', 'проект', 'кейс', 'обращени'].forEach(w => { text = text.replace(new RegExp(w + '[а-я]*', 'g'), ' '); });
    text = text.replace(/20\d\d|[\d.,]+\s*(млрд|млн|тыс)?/g, ' ');
    if (f.region) text = text.replace(new RegExp(f.region.toLowerCase().slice(0, 6) + '[а-я]*', 'g'), ' ').replace(/област[а-я]*/g, ' ');
    f.text = text.trim();
    return f;
  }
  function filterCases(list, f) {
    return list.filter(c => (!f.years || (c.year >= f.years[0] && c.year <= f.years[1])) && (!f.minAmount || c.amountRequested > f.minAmount) && (!f.maxAmount || c.amountRequested < f.maxAmount)
      && (!f.region || c.region === f.region) && (!f.dzo || c.dzo === f.dzo) && (!f.body || c.decisions.some(x => x.body === f.body))
      && (!f.result || (f.result === 'refused' ? c.result === 'Отказано' : /Одобрено/.test(c.result))) && (!f.applicantType || c.applicantType === f.applicantType) && (!f.aidType || c.aidType === f.aidType)
      && (!f.court || c.courtFlag));
  }

  /* ---------------- поиск ---------------- */
  const hasFilters = (f) => !!(f.years || f.minAmount || f.maxAmount || f.region || f.dzo || f.body || f.result || f.applicantType || f.aidType || f.concl || f.court);
  function search(query, opts = {}) {
    const f = parseQuery(query);
    const orig = [...new Set(tokens(f.text))];
    const qt = expand(orig);
    const vc = new Set(cases().map(c => c.id)), vd = new Set(docs().map(d => d.id));
    const run = (useText) => {
      const res = [];
      idx().items.forEach(it => {
        if (it.kind === 'case' ? !vc.has(it.id) : !vd.has(it.id)) return;
        if (!useText) { res.push({ kind: it.kind, id: it.id, score: 0.01, hit: [] }); return; }
        const { s, hit } = score(it, qt);
        const covered = new Set(hit.map(h => ORIGIN.get(h) || h));
        const coverage = orig.length ? orig.filter(o => covered.has(o)).length / orig.length : 1;
        if (s < 0.35 || coverage < (orig.length >= 3 ? 0.5 : 1)) return;
        res.push({ kind: it.kind, id: it.id, score: s * (0.5 + coverage), hit });
      });
      const max = Math.max(0, ...res.map(r => r.score));
      return useText ? res.filter(r => r.score >= 0.3 * max) : res;
    };
    let res = run(orig.length > 0);
    let cs = res.filter(r => r.kind === 'case').map(r => Object.assign(r, { obj: kcase(r.id) })).filter(r => filterCases([r.obj], f).length);
    void hasFilters;
    let ds = res.filter(r => r.kind === 'doc').map(r => Object.assign(r, { obj: doc(r.id) }));
    if (f.years) ds = ds.filter(r => r.obj.date.getFullYear() >= f.years[0] && r.obj.date.getFullYear() <= f.years[1]);
    if (f.concl) ds = ds.filter(r => r.obj.type === f.concl);
    if (f.region || f.applicantType || f.body || f.result || f.minAmount) { const ok = new Set(cs.map(r => r.id)); ds = ds.filter(r => !r.obj.caseId || ok.has(r.obj.caseId)); }
    const sorter = (a, b) => b.score - a.score || (b.obj.date - a.obj.date);
    cs.sort(sorter); ds.sort(sorter);
    return { filters: f, cases: cs.slice(0, opts.limit || 50), docs: ds.slice(0, opts.limit || 50), terms: [...qt.keys()] };
  }
  function snippet(text, terms, len = 220) {
    const t = String(text || '');
    const low = t.toLowerCase().replace(/ё/g, 'е');
    let pos = -1;
    for (const w of terms) { const p = low.indexOf(w.slice(0, Math.max(4, w.length))); if (p >= 0 && (pos < 0 || p < pos)) pos = p; }
    const start = Math.max(0, pos - 60);
    let s = (start > 0 ? '…' : '') + t.slice(start, start + len) + (start + len < t.length ? '…' : '');
    s = esc(s);
    terms.filter(w => w.length >= 4).forEach(w => { s = s.replace(new RegExp('(' + w.slice(0, Math.max(4, w.length)).replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '[а-яa-z]*)', 'gi'), '<mark>$1</mark>'); });
    return s;
  }

  /* ---------------- аналогичные кейсы ---------------- */
  const vec = (text) => { const m = new Map(); tokens(text).forEach(t => { const c = canon(t); m.set(c, (m.get(c) || 0) + 1); }); return m; };
  const cos = (a, b) => { let dot = 0, na = 0, nb = 0; a.forEach((v, k) => { na += v * v; if (b.has(k)) dot += v * b.get(k); }); b.forEach(v => { nb += v * v; }); return na && nb ? dot / Math.sqrt(na * nb) : 0; };
  const normName = (s) => String(s || '').toLowerCase().replace(/[«»"()]/g, '').replace(/\s+/g, ' ').trim();
  function similar(target, n = 6) {
    const tv = vec([target.purpose, target.recipient, target.recipientCat, target.direction].join(' '));
    const out = [];
    cases().forEach(c => {
      if (c.id === target.id) return;
      const reasons = [];
      let s = 0;
      if (target.applicant && normName(c.applicant) === normName(target.applicant)) { s += 0.18; reasons.push('тот же заявитель'); }
      if (target.recipient && normName(c.recipient) === normName(target.recipient) && normName(c.recipient) !== normName(c.applicant)) { s += 0.06; reasons.push('тот же получатель'); }
      if (c.direction === target.direction) { s += 0.14; reasons.push('то же направление'); }
      if (c.recipientCat === target.recipientCat) { s += 0.08; reasons.push('та же категория получателя'); }
      if (c.aidType === target.aidType) { s += 0.05; reasons.push('тот же вид помощи'); }
      if (c.region === target.region) { s += 0.09; reasons.push('тот же регион'); }
      if (c.applicantType === target.applicantType) { s += 0.04; }
      if (target.amountRequested && c.amountRequested) { const r = 1 - Math.min(1, Math.abs(Math.log(target.amountRequested / c.amountRequested)) / Math.log(10)); s += 0.08 * r; if (r > 0.7) reasons.push('близкая сумма'); }
      const cs = cos(tv, vec([c.purpose, c.recipient, c.recipientCat, c.direction].join(' ')));
      s += 0.28 * cs; if (cs > 0.35) reasons.push('схожая цель проекта');
      if (s >= 0.3) out.push({ c, sim: Math.min(0.99, s), reasons });
    });
    return out.sort((a, b) => b.sim - a.sim).slice(0, n);
  }

  /* ---------------- Правила ---------------- */
  const current = () => KB.RULES.find(r => !r.to) || KB.RULES[KB.RULES.length - 1];
  const ruleAt = KB.ruleAt;
  const ruleById = (id) => KB.RULES.find(r => r.id === id);
  function ruleNotice(date) {
    const then = ruleAt(date), now = current();
    return then.id === now.id ? `На дату рассмотрения (${fdate(date)}) действовала текущая редакция Правил от ${fdate(now.from)}.` : `На дату рассмотрения кейса действовала редакция Правил от ${fdate(then.from)}. В настоящее время действует редакция от ${fdate(now.from)}.`;
  }
  function wordDiff(a, b) {
    const A = String(a || '').split(/(\s+)/), B = String(b || '').split(/(\s+)/);
    const n = A.length, m = B.length;
    const dp = Array.from({ length: n + 1 }, () => new Int16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = A[i] === B[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0; const outA = [], outB = [];
    while (i < n && j < m) {
      if (A[i] === B[j]) { outA.push(esc(A[i])); outB.push(esc(B[j])); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { outA.push(`<del>${esc(A[i])}</del>`); i++; }
      else { outB.push(`<ins>${esc(B[j])}</ins>`); j++; }
    }
    while (i < n) outA.push(`<del>${esc(A[i++])}</del>`);
    while (j < m) outB.push(`<ins>${esc(B[j++])}</ins>`);
    return { a: outA.join(''), b: outB.join(''), same: a === b };
  }

  /* ---------------- оценка обращения на соответствие Правилам ---------------- */
  const DIR_IN_RULES = { 'Образование': 'образование', 'Здравоохранение': 'здравоохранение', 'Спорт': 'спорт', 'Культура': 'культура', 'Поддержка уязвимых групп': 'уязвимых', 'Экология': 'экология', 'Социальная инфраструктура': 'инфраструктуры', 'Благоустройство': null };
  function assess(t) {
    const r = current(), then = t.date ? ruleAt(t.date) : r;
    const checks = [];
    const rd = r.docId;
    const cite = (cl) => ({ docId: rd, section: 'п. ' + cl });
    const key = DIR_IN_RULES[t.direction];
    if (key && r.clauses['2.1'].toLowerCase().includes(key)) checks.push({ ok: true, clause: '2.1', text: `Направление «${t.direction}» предусмотрено Правилами.`, cite: cite('2.1') });
    else checks.push({ ok: null, clause: '2.1', text: `Направление «${t.direction}» прямо не названо в п. 2.1; требуется оценить отнесение к «развитию социальной инфраструктуры в регионах присутствия».`, cite: cite('2.1') });
    const purpose = String(t.purpose || '').toLowerCase();
    if (/содержан|коммунальн|заработн|текущ[а-я]* расход|оплат[а-я]* труд/.test(purpose) && /государствен|учрежден|больниц|поликлин|школ|акимат/.test((t.recipient + ' ' + t.recipientCat + ' ' + t.applicantType).toLowerCase()))
      checks.push({ ok: false, clause: '3.1', text: 'Цель обращения содержит признаки финансирования содержания (текущих расходов, оплаты труда, коммунальных услуг) государственного учреждения — это ограничение п. 3.1.', cite: cite('3.1') });
    if (t.applicantType === 'Коммерческая организация' || /^тоо /i.test(t.recipient || '')) checks.push({ ok: false, clause: '3.1', text: 'Получатель имеет признаки коммерческой организации — помощь коммерческим организациям не оказывается (п. 3.1).', cite: cite('3.1') });
    if (/концерт|праздн|шоу|развлек/.test(purpose)) checks.push({ ok: null, clause: '3.1', text: 'Мероприятие может иметь развлекательный характер — требуется подтверждение социального эффекта (п. 3.1).', cite: cite('3.1') });
    const regionOk = r.clauses['2.2'].includes((t.region || '').replace(' область', ''));
    checks.push({ ok: regionOk ? true : null, clause: '2.2', text: regionOk ? `Регион «${t.region}» относится к приоритетным.` : `Регион «${t.region}» не входит в перечень приоритетных регионов п. 2.2 — обращение не запрещено, но приоритет не применяется.`, cite: cite('2.2') });
    const [t1, t2] = r.thresholds;
    const body = t.amountRequested <= t1 ? 'Комиссия' : t.amountRequested <= t2 ? 'Правление' : 'Совет директоров';
    checks.push({ ok: true, clause: '5.1', text: `Сумма ${mln(t.amountRequested)} — решение в компетенции: ${body} (п. 5.1: до ${t1} млн — Комиссия, до ${t2} млн — Правление, свыше — Совет директоров).`, cite: cite('5.1'), body });
    checks.push({ ok: true, clause: '6.1', text: 'Комплаенс-проверка получателя обязательна до вынесения на Комиссию (п. 6.1).', cite: cite('6.1') });
    let missing = [];
    if (t.docTypes) { missing = r.required.filter(x => !t.docTypes.includes(x)); checks.push({ ok: missing.length ? false : true, clause: '4.1', text: missing.length ? `Не представлены обязательные документы: ${missing.join(', ')} (п. 4.1).` : 'Пакет документов соответствует п. 4.1.', cite: cite('4.1') }); }
    else checks.push({ ok: null, clause: '4.1', text: `Требуется проверить наличие документов по п. 4.1: ${r.required.join(', ')}.`, cite: cite('4.1') });
    return { rule: r, then, checks, body, missing };
  }

  /* ---------------- история заявителя ---------------- */
  const history = (t) => cases().filter(c => c.id !== t.id && normName(c.applicant) === normName(t.applicant)).sort((a, b) => a.date - b.date);

  /* ---------------- контроль качества ---------------- */
  function quality() {
    const I = [];
    const add = (type, sev, title, detail, caseId, docIds = []) => I.push({ type, sev, title, detail, caseId, docIds });
    const vis = cases(), vdocs = docs();
    // дубли документов
    const groups = {};
    vdocs.filter(d => d.category === 'sed').forEach(d => { const k = d.type + '|' + normName(d.title) + '|' + (d.caseId || ''); (groups[k] = groups[k] || []).push(d); });
    Object.values(groups).filter(g => g.length > 1).forEach(g => add('Дубль документа', 2, `Документ зарегистрирован ${g.length} раза под разными номерами`, g.map(d => `${d.number} от ${fdate(d.date)}`).join('; '), g[0].caseId, g.map(d => d.id)));
    // повторные обращения и дубли кейсов
    const byApp = {};
    vis.forEach(c => { (byApp[normName(c.applicant)] = byApp[normName(c.applicant)] || []).push(c); });
    Object.values(byApp).filter(g => g.length > 1).forEach(g => {
      add('Повторное обращение', 1, `${g[0].applicant}: ${g.length} обращения`, g.map(c => `${c.id} (${c.year}, ${c.result.toLowerCase()})`).join('; '), g[g.length - 1].id);
      for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) if (g[i].year === g[j].year && cos(vec(g[i].purpose), vec(g[j].purpose)) > 0.8) add('Дубль проекта', 2, 'Возможный дубль кейса', `${g[i].id} и ${g[j].id}: одинаковые заявитель, год и цель`, g[j].id);
    });
    vis.forEach(c => {
      const cd = c.docs.map(doc).filter(Boolean);
      const types = typesOf(c.docs);
      if (c.status !== 'На рассмотрении') {
        const miss = ruleById(c.ruleId).required.filter(x => !types.includes(x));
        if (miss.length) add('Отсутствуют обязательные документы', 2, `Нет документов, требуемых п. 4.1 Правил (ред. ${c.ruleId.slice(1)})`, miss.join(', '), c.id);
      }
      const k = c.contractId && doc(c.contractId);
      if (k && c.amountApproved && Math.abs(k.amount - c.amountApproved) > 0.05) add('Расхождение сумм', 3, 'Сумма договора не совпадает с решением органа управления', `решение — ${mln(c.amountApproved)}, договор — ${mln(k.amount)}`, c.id, [k.id]);
      if (c.registry && c.amountApproved && c.registry.amount !== c.amountApproved && c.amountApproved) add('Расхождение между реестром и документами', 2, 'Сумма в реестре не совпадает с документами', `реестр — ${mln(c.registry.amount)}, решение — ${mln(c.amountApproved)}`, c.id);
      if (c.registry && c.registry.status !== c.result && !(c.registry.status === c.result) && c.registry.status === 'Исполнено' && !types.includes('Платёжное поручение')) add('Несоответствие статусов', 3, 'В реестре статус «Исполнено», но нет платёжных документов', `статус по документам — ${c.status}`, c.id);
      const lastDec = c.decisions.length ? c.decisions[c.decisions.length - 1] : null;
      if (k && lastDec && k.date < lastDec.date) add('Несоответствие дат', 3, 'Договор датирован раньше решения органа управления', `договор — ${fdate(k.date)}, решение (${lastDec.body}) — ${fdate(lastDec.date)}`, c.id, [k.id, lastDec.docId]);
      if (/Одобрено/.test(c.result) && c.status !== 'На рассмотрении' && !c.contractId) add('Отсутствует договор', 3, 'Решение об одобрении принято, договор в базе отсутствует', `одобрено ${mln(c.amountApproved)} (${lastDec ? lastDec.body + ', ' + fdate(lastDec.date) : '—'})`, c.id);
      const pays = cd.filter(d => d.type === 'Платёжное поручение');
      if (pays.length && !c.hasReport) {
        const due = new Date(pays[0].date); const days = +(ruleById(c.ruleId).clauses['7.1'].match(/(\d+) календарных/) || [0, 60])[1]; due.setDate(due.getDate() + days);
        if (due < TODAY && c.status !== 'Реализуется') add('Отсутствует отчёт', 3, 'Отчёт о целевом использовании средств не представлен', `срок по п. 7.1 (ред. ${c.ruleId.slice(1)}) истёк ${fdate(due)}; перечислено ${mln(c.amountPaid)}`, c.id);
      }
    });
    vdocs.forEach(d => {
      if (d.ruleRef) { const r = ruleById(d.ruleRef); if (r && r.to && d.date > r.to) add('Ссылка на отменённый ВНД', 2, 'Документ ссылается на редакцию Правил, не действовавшую на дату документа', `${d.title} (${fdate(d.date)}) ссылается на ред. ${r.id.slice(1)}, действовавшую до ${fdate(r.to)}`, d.caseId, [d.id]); }
      if (d.category === 'vnd' && d.status !== 'Действующий') add('Устаревший документ', 1, `${d.status} ВНД`, `${d.title}${d.ruleId && ruleById(d.ruleId).to ? ' — действовал до ' + fdate(ruleById(d.ruleId).to) : ''}`, null, [d.id]);
    });
    return I.sort((a, b) => b.sev - a.sev);
  }

  /* ---------------- аналитика ---------------- */
  function analytics() {
    const L = cases();
    const cnt = (f) => L.filter(f).length;
    const by = (key) => { const m = {}; L.forEach(c => { const k = typeof key === 'function' ? key(c) : c[key]; m[k] = (m[k] || 0) + 1; }); return m; };
    const grounds = {};
    L.forEach(c => c.decisions.forEach(dd => (dd.text.match(/п\. \d\.\d/g) || []).forEach(g => { grounds[g] = (grounds[g] || 0) + 1; })));
    const reasons = {}; L.filter(c => c.refusal).forEach(c => { reasons[c.refusalText] = (reasons[c.refusalText] || 0) + 1; });
    const years = [...new Set(L.map(c => c.year))].sort();
    return {
      total: L.length, approved: cnt(c => /Одобрено/.test(c.result)), refused: cnt(c => c.result === 'Отказано'), pending: cnt(c => c.status === 'На рассмотрении'),
      requested: L.reduce((s, c) => s + c.amountRequested, 0), provided: L.reduce((s, c) => s + c.amountPaid, 0), approvedSum: L.reduce((s, c) => s + c.amountApproved, 0),
      repeat: cnt(c => c.repeatOf || L.some(x => x !== c && normName(x.applicant) === normName(c.applicant) && x.date < c.date)),
      compliance: cnt(c => c.conclusions.some(x => x.type === 'Заключение Службы комплаенс' && x.position !== 'Поддерживает')),
      risks: cnt(c => c.conclusions.some(x => x.type === 'Заключение подразделения по управлению рисками' && x.position !== 'Поддерживает')),
      noReport: cnt(c => c.amountPaid > 0 && !c.hasReport),
      byRegion: by('region'), byDirection: by('direction'), byDzo: by(c => c.dzo ? DB.DZO_BY_ID[c.dzo].short : 'КЦ КМГ'), byType: by('recipientCat'),
      byYear: years.map(y => ({ y, a: cnt(c => c.year === y && /Одобрено/.test(c.result)), r: cnt(c => c.year === y && c.result === 'Отказано'), p: cnt(c => c.year === y && c.status === 'На рассмотрении'), req: L.filter(c => c.year === y).reduce((s, c) => s + c.amountRequested, 0), paid: L.filter(c => c.year === y).reduce((s, c) => s + c.amountPaid, 0) })),
      reasons, grounds
    };
  }

  /* ---------------- цитирование ---------------- */
  function citer() {
    const list = [];
    const cite = (docId, section) => {
      const d = doc(docId); if (!d || !canDoc(d)) return '';
      let i = list.findIndex(x => x.id === docId && x.section === section);
      if (i < 0) { list.push({ id: docId, section }); i = list.length - 1; }
      return `<a class="cite" href="#/kb/doc/${docId}" title="${esc(d.title)}">[${i + 1}]</a>`;
    };
    const render = () => list.length ? `<div class="kb-sources"><div class="lbl">Источники</div><ol>${list.map(x => { const d = doc(x.id); return `<li><a href="#/kb/doc/${d.id}">${esc(d.title)}</a> · № ${esc(d.number)} · ${fdate(d.date)} · ${esc(d.source)}${x.section ? ' · ' + esc(x.section) : ''}</li>`; }).join('')}</ol></div>` : '';
    return { cite, render, list };
  }

  /* ---------------- аналитическая справка ---------------- */
  function briefing(t) {
    const C = citer();
    const a = assess(t);
    const sim = similar(t, 8);
    const hist = history(t);
    const S = [];
    const sec = (title, html) => S.push({ title, html: html || `<p class="text-muted">Сведения в базе знаний отсутствуют.</p>` });
    const caseLink = (c) => `<a href="#/kb/case/${c.id}">${c.id}</a>`;
    const appealDoc = t.docs ? t.docs.map(doc).find(d => d && /Обращение|Письмо/.test(d.type)) : null;
    sec('1. Краткое описание обращения', `<p>${esc(t.applicant)} (${esc(t.applicantType)}) обращается за ${esc((t.aidType || '').toLowerCase())} помощью: ${esc(t.purpose)}. Получатель — ${esc(t.recipient)}; регион — ${esc(t.region)}${t.date ? `; дата обращения — ${fdate(t.date)}` : ''}.${appealDoc ? ' ' + C.cite(appealDoc.id) : ''}</p>`);
    sec('2. Запрашиваемая помощь', `<p>Вид помощи: ${esc(t.aidType)}; направление: ${esc(t.direction)}; сумма: <b>${mln(t.amountRequested)}</b> (KZT).${t.dzo ? ' Инициатор/ДЗО: ' + esc(DB.DZO_BY_ID[t.dzo].name) + '.' : ''}</p>`);
    sec('3. Соответствие действующим Правилам', `<p class="small text-muted">${esc(ruleNotice(t.date || TODAY))} Оценка ниже выполнена по действующей редакции от ${fdate(a.rule.from)}.</p><ul>${a.checks.map(ch => `<li class="${ch.ok === false ? 'text-bad' : ''}">${ch.ok === true ? '✓' : ch.ok === false ? '✗' : '?'} ${esc(ch.text)} ${C.cite(ch.cite.docId, ch.cite.section)}</li>`).join('')}</ul>`);
    const flags = a.checks.filter(c => c.ok === false).map(c => esc(c.text) + ' ' + C.cite(c.cite.docId, c.cite.section));
    const prevRef = hist.filter(c => c.result === 'Отказано'), prevNoRep = hist.filter(c => c.amountPaid > 0 && !c.hasReport);
    prevRef.forEach(c => { const dd = c.decisions[c.decisions.length - 1]; flags.push(`Ранее заявителю отказано (${caseLink(c)}, ${c.year}): ${esc(c.refusalText)} ${dd ? C.cite(dd.docId) : ''}`); });
    prevNoRep.forEach(c => flags.push(`По предыдущему обращению ${caseLink(c)} не представлен отчёт о целевом использовании средств`));
    hist.filter(c => c.courtFlag).forEach(c => flags.push(`По заявителю имеется судебная практика (${caseLink(c)}) ${c.court.map(id => C.cite(id)).join(' ')}`));
    sec('4. Выявленные ограничения и риски', flags.length ? `<ul>${flags.map(f => `<li>${f}</li>`).join('')}</ul>` : '<p>Ограничений по данным базы знаний не выявлено. Окончательная оценка — по результатам комплаенс-проверки и заключений подразделений.</p>');
    sec('5. Аналогичные исторические кейсы', sim.length ? `<table class="tbl"><thead><tr><th>Кейс</th><th>Сходство</th><th>Дата</th><th class="r">Сумма</th><th>Решение</th><th>Редакция Правил</th></tr></thead><tbody>${sim.map(x => { const dd = x.c.decisions[x.c.decisions.length - 1]; return `<tr><td>${caseLink(x.c)} ${esc(x.c.title)}<div class="t-sub">${esc(x.reasons.join(', '))}</div></td><td class="num">${Math.round(x.sim * 100)}%</td><td class="nowrap">${fdate(x.c.date)}</td><td class="r nowrap">${mln(x.c.amountRequested)}</td><td>${esc(x.c.result)}${dd ? ' ' + C.cite(dd.docId) : ''}</td><td class="nowrap">ред. ${x.c.ruleId.slice(1)}</td></tr>`; }).join('')}</tbody></table><p class="small text-muted">Исторические решения приняты по редакциям Правил, действовавшим на дату рассмотрения, и используются как справочная информация.</p>` : '');
    const practice = (body) => {
      const L = sim.map(x => x.c).filter(c => c.decisions.some(d => d.body === body && d.result !== 'Рекомендовано'));
      if (!L.length) return '';
      return `<ul>${L.map(c => { const d = c.decisions.find(x => x.body === body && x.result !== 'Рекомендовано'); return `<li>${caseLink(c)} (${fdate(d.date)}): ${esc(d.text)} ${C.cite(d.docId)}</li>`; }).join('')}</ul>`;
    };
    sec('6. Практика решений Комиссии', practice('Комиссия'));
    sec('7. Практика решений Правления', practice('Правление'));
    sec('8. Практика решений Совета директоров', practice('Совет директоров'));
    const positions = (type) => {
      const L = sim.map(x => x.c).flatMap(c => c.conclusions.filter(k => k.type === type).map(k => ({ c, k }))).filter(x => canDoc(doc(x.k.docId)));
      if (!L.length) return '';
      return `<ul>${L.slice(0, 6).map(({ c, k }) => `<li>${caseLink(c)} — <b>${esc(k.position)}</b>: ${esc(k.text)} ${C.cite(k.docId)}</li>`).join('')}</ul>`;
    };
    sec('9. Позиции ДУЧР', positions('Заключение ДУЧР'));
    sec('10. Позиции Службы комплаенс', positions('Заключение Службы комплаенс'));
    sec('11. Позиции риск-подразделения', positions('Заключение подразделения по управлению рисками'));
    const appr = sim.map(x => x.c).filter(c => /Одобрено/.test(c.result));
    sec('12. Договорная и отчётная практика по аналогичным проектам', appr.length ? `<ul>${appr.map(c => { const k = c.contractId && doc(c.contractId); return `<li>${caseLink(c)}: ${k ? `договор № ${esc(k.number)} от ${fdate(k.date)} на ${mln(k.amount)} ${C.cite(k.id)}` : 'договор в базе отсутствует'}; перечислено ${mln(c.amountPaid)}; отчёт — ${c.hasReport ? 'представлен ' + (c.docs.map(doc).filter(d => d && d.type === 'Отчёт получателя').map(d => C.cite(d.id)).join(' ')) : '<span class="text-bad">не представлен</span>'}</li>`; }).join('')}</ul>` : '');
    const courtCases = [...new Set([...sim.map(x => x.c), ...hist])].filter(c => c.courtFlag);
    sec('13. Судебная практика', courtCases.length ? `<ul>${courtCases.map(c => `<li>${caseLink(c)}: ${c.court.map(id => { const d = doc(id); return d && canDoc(d) ? `${esc(d.title)} № ${esc(d.number)} от ${fdate(d.date)} ${C.cite(id)}` : ''; }).filter(Boolean).join('; ')}</li>`).join('')}</ul>` : '<p class="text-muted">Судебная практика по аналогичным кейсам в базе знаний отсутствует.</p>');
    const questions = [];
    a.missing.forEach(m => questions.push(`Представить документ: ${m} (п. 4.1 Правил).`));
    if (!t.docTypes) questions.push(`Подтвердить наличие полного пакета документов по п. 4.1: ${a.rule.required.join(', ')}.`);
    questions.push('Сведения о конечных бенефициарах получателя и отсутствии аффилированности с работниками КМГ/ДЗО (п. 3.2, 4.1).');
    if (a.checks.some(c => c.clause === '3.1' && c.ok === false && /содержан/.test(c.text))) questions.push('Возможно ли переориентировать запрос с текущего содержания на приобретение оборудования или капитальные вложения?');
    if (t.amountRequested >= 100) questions.push('Возможность поэтапного финансирования и софинансирования со стороны заявителя или местного бюджета.');
    questions.push('Измеримые показатели социального эффекта и план использования средств с календарным графиком.');
    if (prevNoRep.length) questions.push('Представить отчёт о целевом использовании средств по предыдущему обращению.');
    sec('15. Вопросы, требующие дополнительного уточнения', `<ol>${questions.map(q => `<li>${esc(q)}</li>`).join('')}</ol>`);
    // 14 — перечень документов (после сбора всех ссылок)
    S.splice(13, 0, { title: '14. Перечень выявленных документов', html: C.list.length ? `<ol>${C.list.map(x => { const d = doc(x.id); return `<li><a href="#/kb/doc/${d.id}">${esc(d.title)}</a> — № ${esc(d.number)}, ${fdate(d.date)}, ${esc(d.source)}</li>`; }).join('')}</ol>` : '<p class="text-muted">Документы не выявлены.</p>' });
    return { sections: S, sources: C, assess: a, similar: sim, history: hist, enough: sim.length > 0 || hist.length > 0 };
  }

  /* ---------------- ассистент базы знаний ---------------- */
  function caseRow(c, C) { const dd = c.decisions[c.decisions.length - 1]; return `<tr><td><a href="#/kb/case/${c.id}">${c.id}</a><div class="t-sub">${esc(c.title)}</div></td><td class="nowrap">${fdate(c.date)}</td><td class="r nowrap">${mln(c.amountRequested)}</td><td>${esc(c.result)}${dd ? ' ' + C.cite(dd.docId) : ''}</td></tr>`; }
  const caseTable = (L, C) => `<div class="table-wrap"><table class="tbl"><thead><tr><th>Кейс</th><th>Дата</th><th class="r">Запрошено</th><th>Решение</th></tr></thead><tbody>${L.map(c => caseRow(c, C)).join('')}</tbody></table></div>`;
  const typesOf = (ids) => { const t = ids.map(doc).filter(Boolean).map(d => d.type); if (t.includes('Письмо акимата')) t.push('Обращение'); return t; };
  function toTarget(c) { return Object.assign({}, c, { docTypes: c.docs ? typesOf(c.docs) : null }); }
  function answer(q, ctxId) {
    const C = citer();
    const s = q.toLowerCase().replace(/ё/g, 'е');
    const ctx = ctxId ? kcase(ctxId) : null;
    if (ctx && !canCase(ctx)) return { html: `<p>${NO_DATA}</p>`, C };
    const wrap = (html) => ({ html: html + C.render(), C });
    const noData = () => ({ html: `<p>${NO_DATA}</p><p class="small text-muted">Уточните формулировку, период, заявителя или выберите кейс в поле «Контекст».</p>`, C });
    // редакция Правил
    if (/редакц|действовал[аи]? .*правил|правил.*действовал/.test(s)) {
      const dm = q.match(/(\d{2})\.(\d{2})\.(20\d\d)/);
      const date = dm ? new Date(+dm[3], +dm[2] - 1, +dm[1]) : ctx ? ctx.date : null;
      if (/сравн|различ|отлич|изменени/.test(s)) {
        const [A, B] = [ruleById((s.match(/20(16|19|22|24)/g) || [])[0] ? 'R' + s.match(/20(16|19|22|24)/g)[0] : 'R2022'), current()];
        const rows = Object.keys(KB.CLAUSE_TITLES).filter(k => (A.clauses[k] || '') !== (B.clauses[k] || '')).map(k => `<tr><td class="nowrap">п. ${k} ${KB.CLAUSE_TITLES[k]}</td><td class="small">${esc(A.clauses[k] || '—')} ${A.clauses[k] ? C.cite(A.docId, 'п. ' + k) : ''}</td><td class="small">${esc(B.clauses[k] || '—')} ${B.clauses[k] ? C.cite(B.docId, 'п. ' + k) : ''}</td></tr>`);
        return wrap(`<p>Различия редакции от ${fdate(A.from)} и действующей редакции от ${fdate(B.from)} (${rows.length} пунктов):</p><div class="table-wrap"><table class="tbl"><thead><tr><th>Пункт</th><th>Ред. ${A.id.slice(1)}</th><th>Ред. ${B.id.slice(1)}</th></tr></thead><tbody>${rows.join('')}</tbody></table></div><p class="small"><a href="#/kb/rules?a=${A.id}&b=${B.id}">Открыть детальное сравнение редакций</a></p>`);
      }
      if (!date) return wrap(`<p>Укажите дату (ДД.ММ.ГГГГ) или выберите кейс в поле «Контекст». Действующая редакция — от ${fdate(current().from)} ${C.cite(current().docId)}.</p>`);
      const r = ruleAt(date);
      return wrap(`<p>${esc(ruleNotice(date))} ${C.cite(r.docId)}${r.id !== current().id ? ' ' + C.cite(current().docId) : ''}</p><p>Редакция ${r.id.slice(1)}: ${esc(r.approvedBy)}; пороги полномочий — ${r.thresholds[0]}/${r.thresholds[1]} млн тенге; требуемые документы — ${esc(r.required.join(', '))} ${C.cite(r.docId, 'п. 4.1')}.</p>${ctx ? `<p>Кейс ${ctx.id} рассматривался по редакции ${ctx.ruleId.slice(1)}.</p>` : ''}`);
    }
    // повторные обращения / история заявителя
    if (/ранее обращ|повторн|этому заявител|по заявител|истори[яи] заявител/.test(s)) {
      let app = ctx ? ctx.applicant : null;
      if (!app) { const hit = cases().find(c => s.includes(normName(c.applicant).replace(/^(оо|оф|роо|ою|кгп|кгу|гккп|гкп|тоо) /, '').slice(0, 14))); if (hit) app = hit.applicant; }
      if (!app) { const rep = {}; cases().forEach(c => { rep[c.applicant] = (rep[c.applicant] || 0) + 1; }); const L = Object.entries(rep).filter(([, n]) => n > 1); if (!L.length) return noData(); return wrap(`<p>Заявители с повторными обращениями (${L.length}):</p><ul>${L.map(([a, n]) => `<li>${esc(a)} — ${n} обращения: ${cases().filter(c => c.applicant === a).map(c => `<a href="#/kb/case/${c.id}">${c.id}</a> (${c.result.toLowerCase()})`).join(', ')}</li>`).join('')}</ul>`); }
      const L = cases().filter(c => normName(c.applicant) === normName(app));
      if (L.length <= (ctx ? 1 : 0)) return wrap(`<p>Других обращений заявителя «${esc(app)}» в базе знаний не найдено.</p>`);
      return wrap(`<p>Обращения заявителя «${esc(app)}» (${L.length}):</p>${caseTable(L, C)}${L.some(c => c.amountPaid > 0 && !c.hasReport) ? '<p class="text-bad">По части обращений отчёт о целевом использовании не представлен.</p>' : ''}`);
    }
    // недостающие документы / вопросы / материалы для Комиссии
    if (/недостающ|не хватает|каких документ|отсутству.*документ|документ[а-я]* отсутству/.test(s) && ctx) {
      const a = assess(toTarget(ctx));
      const types = ctx.docs.map(doc).filter(Boolean).map(d => d.type);
      return wrap(`<p>Для кейса ${ctx.id} по действующей редакции Правил ${C.cite(a.rule.docId, 'п. 4.1')} требуются: ${esc(a.rule.required.join(', '))}.</p><p>${a.missing.length ? `<span class="text-bad">Отсутствуют: ${esc(a.missing.join(', '))}.</span>` : 'Все обязательные документы в базе имеются.'}</p><p class="small text-muted">Представлены: ${esc([...new Set(types)].join(', '))}.</p>`);
    }
    if (/вопрос[а-я]* (для|к) заявител|перечень вопрос/.test(s) || (/справк|материал[а-я]* (для|к) комисси|подготов/.test(s) && ctx)) {
      if (!ctx) return wrap('<p>Выберите кейс или обращение в поле «Контекст» — справка и вопросы формируются по конкретному обращению.</p>');
      const b = briefing(toTarget(ctx));
      const pickSec = /вопрос/.test(s) ? b.sections.filter(x => /^15\./.test(x.title)) : b.sections.filter(x => /^(1|2|3|4|5|6|15)\./.test(x.title));
      return { html: pickSec.map(x => `<p class="fw6">${esc(x.title)}</p>${x.html}`).join('') + `<p class="small"><a href="#" data-brief="${ctx.id}">Открыть полную аналитическую справку (15 разделов)</a></p>` + b.sources.render(), C: b.sources };
    }
    // противоречия
    if (/противореч|расхожден|несоответств/.test(s)) {
      const I = quality().filter(x => ['Расхождение сумм', 'Несоответствие дат', 'Несоответствие статусов', 'Расхождение между реестром и документами', 'Ссылка на отменённый ВНД'].includes(x.type) && (!ctx || x.caseId === ctx.id));
      if (!I.length) return wrap(`<p>Противоречий между документами${ctx ? ' кейса ' + ctx.id : ''} не выявлено.</p>`);
      return wrap(`<p>Выявлено противоречий: ${I.length}. Обе позиции приведены с датами документов.</p><ul>${I.map(x => `<li><b>${esc(x.type)}</b>${x.caseId ? ` · <a href="#/kb/case/${x.caseId}">${x.caseId}</a>` : ''}: ${esc(x.detail)} ${x.docIds.map(id => C.cite(id)).join(' ')}</li>`).join('')}</ul>`);
    }
    // аналогичные кейсы
    if (/аналогичн|похож|подобн|схож/.test(s) && !/замечани|основани|причин/.test(s)) {
      const f = parseQuery(q);
      if (ctx) {
        let sim = similar(toTarget(ctx), 10).map(x => x.c);
        sim = filterCases(sim, f);
        if (!sim.length) return noData();
        return wrap(`<p>Для кейса ${ctx.id} найдено аналогов${f.body ? ` (рассматривал орган: ${f.body})` : ''}: ${sim.length}.</p>${caseTable(sim, C)}<p class="small text-muted">Исторические решения — справочная информация; принимались по действовавшим на тот момент редакциям Правил.</p>`);
      }
      const r = search(q);
      if (!r.cases.length) return noData();
      return wrap(`<p>Найдено кейсов${f.years ? ` за ${f.years[0]}–${f.years[1]} гг.` : ''}${f.body ? `, рассмотренных органом «${f.body}»` : ''}: ${r.cases.length}.</p>${caseTable(r.cases.map(x => x.obj), C)}`);
    }
    // основания отказа
    if (/основани[а-я]* (для )?отказ|причин[а-я]* отказ/.test(s)) {
      let L = ctx ? similar(toTarget(ctx), 12).map(x => x.c) : search(q).cases.map(x => x.obj);
      if (!ctx && !L.length) L = cases();
      L = L.filter(c => c.result === 'Отказано');
      if (!L.length) return ctx ? wrap(`<p>Среди аналогов кейса ${ctx.id} отказов не найдено.</p>`) : noData();
      const g = {}; L.forEach(c => { (g[c.refusalText] = g[c.refusalText] || []).push(c); });
      return wrap(`<p>Основания отказа по ${ctx ? 'аналогичным' : 'найденным'} кейсам:</p><ul>${Object.entries(g).map(([t, cs]) => `<li><b>${esc(t)}</b>${cs[0].refusalClause ? ` (п. ${cs[0].refusalClause} Правил)` : ''} — ${cs.map(c => { const dd = c.decisions[c.decisions.length - 1]; return `<a href="#/kb/case/${c.id}">${c.id}</a>${dd ? ' ' + C.cite(dd.docId) : ''}`; }).join(', ')}</li>`).join('')}</ul><p class="small text-muted">Основания применялись по редакциям Правил, действовавшим на дату решения.</p>`);
    }
    // замечания подразделений
    if (/замечани|позици|заключени/.test(s)) {
      const f = parseQuery(q);
      const type = f.concl || (/дучр/.test(s) ? 'Заключение ДУЧР' : /риск/.test(s) ? 'Заключение подразделения по управлению рисками' : /юрид/.test(s) ? 'Юридическое заключение' : 'Заключение Службы комплаенс');
      const base = ctx ? similar(toTarget(ctx), 12).map(x => x.c).concat([ctx]) : (search(q).cases.map(x => x.obj).length ? search(q).cases.map(x => x.obj) : cases());
      const L = base.flatMap(c => c.conclusions.filter(k => k.type === type && canDoc(doc(k.docId))).map(k => ({ c, k })));
      const withRem = L.filter(x => x.k.position !== 'Поддерживает');
      if (!L.length) return noData();
      return wrap(`<p>${esc(type)}: найдено ${L.length}, из них с замечаниями или отрицательных — ${withRem.length}.</p><ul>${(withRem.length ? withRem : L).slice(0, 10).map(({ c, k }) => `<li><a href="#/kb/case/${c.id}">${c.id}</a> (${fdate(k.date)}) — <b>${esc(k.position)}</b>: ${esc(k.text)} ${C.cite(k.docId)}</li>`).join('')}</ul>`);
    }
    // история рассмотрения / представленные документы по кейсу
    if (ctx && /истори|хронолог|какие документ|представлен/.test(s)) {
      return wrap(`<p>Хронология кейса ${ctx.id}:</p><ul>${ctx.events.filter(e => !e.docId || canDoc(doc(e.docId))).map(e => `<li>${fdate(e.date)} — <b>${esc(e.stage)}</b>: ${esc(e.text)} ${e.docId ? C.cite(e.docId) : ''}</li>`).join('')}</ul>`);
    }
    // сравнительная таблица
    if (/сравнит|таблиц|сопостав/.test(s)) {
      const L = ctx ? [ctx, ...similar(toTarget(ctx), 6).map(x => x.c)] : search(q).cases.map(x => x.obj).slice(0, 10);
      if (!L.length) return noData();
      return wrap(`<div class="table-wrap"><table class="tbl"><thead><tr><th>Кейс</th><th>Заявитель</th><th>Регион</th><th class="r">Запрошено</th><th class="r">Одобрено</th><th>Орган</th><th>Решение</th><th>Правила</th></tr></thead><tbody>${L.map(c => { const dd = c.decisions[c.decisions.length - 1]; return `<tr><td><a href="#/kb/case/${c.id}">${c.id}</a></td><td class="small">${esc(c.applicant)}</td><td class="small">${esc(c.region)}</td><td class="r nowrap">${mln(c.amountRequested)}</td><td class="r nowrap">${mln(c.amountApproved)}</td><td>${esc(c.decisionBody || '—')}</td><td>${esc(c.result)} ${dd ? C.cite(dd.docId) : ''}</td><td>${c.ruleId.slice(1)}</td></tr>`; }).join('')}</tbody></table></div>`);
    }
    // решения по фильтрам / общий поиск
    const r = search(q);
    const f = r.filters;
    if (r.cases.length) {
      const L = r.cases.map(x => x.obj);
      const g = {}; L.forEach(c => { g[c.result] = (g[c.result] || 0) + 1; });
      return wrap(`<p>Найдено кейсов: <b>${L.length}</b>${f.applicantType ? `, заявитель — ${f.applicantType.toLowerCase()}` : ''}${f.region ? `, ${esc(f.region)}` : ''}${f.minAmount ? `, сумма более ${mln(f.minAmount)}` : ''}${f.years ? `, ${f.years[0]}–${f.years[1]} гг.` : ''}. Итоги: ${Object.entries(g).map(([k, v]) => `${k.toLowerCase()} — ${v}`).join(', ')}.</p>${caseTable(L.slice(0, 15), C)}${r.docs.length ? `<p class="small">Связанные документы: ${r.docs.slice(0, 6).map(x => C.cite(x.id)).join(' ')}</p>` : ''}`);
    }
    if (r.docs.length) return wrap(`<p>Найдены документы (${r.docs.length}):</p><ul>${r.docs.slice(0, 8).map(x => `<li>${esc(x.obj.title)} ${C.cite(x.id)}<div class="small text-muted">${snippet(x.obj.text, r.terms)}</div></li>`).join('')}</ul>`);
    return noData();
  }

  function reindex() { INDEX = null; return buildIndex(); }
  function addDocument(data) {
    const u = Core.user;
    if (!can('add')) throw new Core.AccessError('Добавление документов в базу знаний недоступно для вашей роли');
    if (u.role === 'DZO' && data.dzo !== u.dzo) throw new Core.AccessError('Пользователь ДЗО может добавлять документы только своего ДЗО');
    if ((data.conf || 0) > CLEAR[u.role]) throw new Core.AccessError('Нельзя установить уровень конфиденциальности выше собственного уровня доступа');
    const id = 'U' + String(KB.DOCS.filter(d => d.userAdded).length + 1).padStart(4, '0') + Date.now().toString(36).slice(-3);
    const d = Object.assign({ id, userAdded: true, addedBy: u.id, addedAt: new Date(), status: 'Действующий', pages: null }, data);
    KB.DOCS.push(d);
    if (d.caseId) { const c = kcase(d.caseId); if (c && canCase(c)) { c.docs.push(d.id); c.events.push({ date: d.date, stage: 'Документ', text: `Добавлен документ: ${d.title}`, docId: d.id }); c.events.sort((a, b) => a.date - b.date); } }
    Core.audit('Добавлен документ в базу знаний', 'База знаний', null, '', `${d.type}: ${d.title}`, d.dzo || null);
    reindex(); Core.persist();
    return d;
  }

  window.KBE = { canDoc, canCase, docs, cases, doc, kcase, can, CLEAR, tokens, search, snippet, similar, current, ruleAt, ruleById, ruleNotice, wordDiff, assess, history, quality, analytics, briefing, answer, citer, reindex, idx: () => idx(), indexedAt: () => indexedAt, addDocument, toTarget, NO_DATA, parseQuery, mln, fdate, esc };
})();

  function renderSearch(q) {

    document.querySelectorAll('[data-cf]').forEach(el => { el.oninput = el.onchange = () => { cf[el.dataset.cf] = el.value; render(); }; });

  /* ---------------- карточка кейса ---------------- */
