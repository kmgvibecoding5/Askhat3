<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KMG Social Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.min.css">
  <style>
/* ============ Tokens ============ */
:root {
  color-scheme: light;
  --bg: #F3F5F9;
  --surface: #FFFFFF;
  --surface-2: #F7F9FC;
  --surface-3: #EEF2F7;
  --border: #E2E7EF;
  --border-strong: #CFD7E3;
  --text: #0F1B2D;
  --text-2: #4D5B72;
  --muted: #8491A5;
  --navy: #0B2545;
  --navy-2: #12325C;
  --navy-text: #C9D6EA;
  --primary: #1D5FBF;
  --primary-hover: #174FA0;
  --primary-soft: #E8F0FB;
  --sky: #3FA2F7;
  --ok: #178A4E;
  --ok-soft: #E4F4EA;
  --warn: #B87800;
  --warn-soft: #FCF1D8;
  --bad: #C93838;
  --bad-soft: #FBE8E8;
  --info-soft: #E6F2FD;
  --shadow: 0 1px 2px rgba(16, 32, 64, .05), 0 1px 1px rgba(16, 32, 64, .03);
  --shadow-lg: 0 16px 48px rgba(11, 37, 69, .18), 0 2px 8px rgba(11, 37, 69, .08);
  --radius: 12px;
  --radius-sm: 8px;
  /* chart tokens */
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --c-rest: #D5DCE6;
  --c-plan: #9DB3CF;
  --st-work: #2a78d6; --st-done: #1E9E5A; --st-ctrl: #E0A100;
  --grid: #EDF0F5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0B111C; --surface: #121A28; --surface-2: #162031; --surface-3: #1B273A;
    --border: #233148; --border-strong: #2F405B;
    --text: #E6ECF5; --text-2: #A9B5C8; --muted: #74839B;
    --navy: #0A1422; --navy-2: #13233B; --navy-text: #A9B8CF;
    --primary: #4C8DF0; --primary-hover: #6AA1F3; --primary-soft: #18294A; --sky: #57B5F7;
    --ok: #3CC47A; --ok-soft: #143325; --warn: #E4AE3A; --warn-soft: #362A10; --bad: #F06B6B; --bad-soft: #3A1818; --info-soft: #152A45;
    --shadow: 0 1px 2px rgba(0,0,0,.35); --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --c-rest: #2A3850; --c-plan: #4A5F80; --st-work: #3987e5; --st-done: #2FB06A; --st-ctrl: #D29A12; --grid: #1E2A3E;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0B111C; --surface: #121A28; --surface-2: #162031; --surface-3: #1B273A;
  --border: #233148; --border-strong: #2F405B;
  --text: #E6ECF5; --text-2: #A9B5C8; --muted: #74839B;
  --navy: #0A1422; --navy-2: #13233B; --navy-text: #A9B8CF;
  --primary: #4C8DF0; --primary-hover: #6AA1F3; --primary-soft: #18294A; --sky: #57B5F7;
  --ok: #3CC47A; --ok-soft: #143325; --warn: #E4AE3A; --warn-soft: #362A10; --bad: #F06B6B; --bad-soft: #3A1818; --info-soft: #152A45;
  --shadow: 0 1px 2px rgba(0,0,0,.35); --shadow-lg: 0 16px 48px rgba(0,0,0,.5);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
  --c-rest: #2A3850; --c-plan: #4A5F80; --st-work: #3987e5; --st-done: #2FB06A; --st-ctrl: #D29A12; --grid: #1E2A3E;
}

/* ============ Base ============ */
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px; line-height: 1.45; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; overflow-x: hidden;
}
a { color: var(--primary); text-decoration: none; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -.01em; }
.num { font-variant-numeric: tabular-nums; }
.ico { display: inline-flex; width: 18px; height: 18px; flex: none; }
.ico svg { width: 100%; height: 100%; }

/* ============ Layout ============ */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 232px; flex: none; background: var(--navy); color: var(--navy-text);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 40;
}
.brand { display: flex; align-items: center; gap: 12px; padding: 20px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.07); }
.brand-mark { width: 38px; height: 38px; color: #4FB3FF; flex: none; }
.brand-mark svg { width: 100%; height: 100%; }
.brand-company { color: #fff; font-weight: 700; font-size: 15px; letter-spacing: .01em; }
.brand-system { font-size: 12px; color: #7FA6D6; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; margin-top: 1px; }
.nav { padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; flex: 1; }
.nav-sep { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: #5E7697; padding: 14px 12px 6px; }
.nav a {
  display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 8px;
  color: var(--navy-text); font-weight: 500; font-size: 13px; white-space: nowrap; transition: background .15s, color .15s;
}
.nav a:hover { background: rgba(255,255,255,.06); color: #fff; }
.nav a.active { background: var(--navy-2); color: #fff; box-shadow: inset 3px 0 0 #4FB3FF; }
.nav a .badge-count { margin-left: auto; background: rgba(214,69,69,.9); color: #fff; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 10px; }
.sidebar-foot { padding: 16px 20px 20px; border-top: 1px solid rgba(255,255,255,.07); font-size: 12px; }
.sidebar-foot-title { color: #fff; font-weight: 600; }
.sidebar-foot-sub { color: #7F93B0; margin-top: 2px; }
.sidebar-foot-ver { color: #56708F; margin-top: 8px; font-size: 11px; }
.sidebar-backdrop { display: none; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 16px;
  height: 64px; padding: 0 28px; background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
}
.icon-btn.menu-btn { display: none; }
.topbar-title { min-width: 0; flex: none; }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--text-2); }
.crumbs b { color: var(--text); font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.topbar-search { position: relative; flex: 1; max-width: 420px; margin-left: auto; }
.topbar-search .ico { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); width: 16px; height: 16px; }
.topbar-search input {
  width: 100%; height: 38px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 10px;
  padding: 0 12px 0 36px; outline: none; transition: border .15s, box-shadow .15s;
}
.topbar-search input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); background: var(--surface); }
.search-results {
  position: absolute; top: 44px; left: 0; right: 0; background: var(--surface); border: 1px solid var(--border);
  border-radius: 10px; box-shadow: var(--shadow-lg); display: none; max-height: 360px; overflow-y: auto; z-index: 50;
}
.search-results.open { display: block; }
.search-results .sr-item { display: block; padding: 9px 14px; color: var(--text); border-bottom: 1px solid var(--border); cursor: pointer; }
.search-results .sr-item:last-child { border-bottom: 0; }
.search-results .sr-item:hover { background: var(--surface-2); }
.search-results .sr-type { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.search-results .sr-empty { padding: 14px; color: var(--muted); }
.topbar-right { display: flex; align-items: center; gap: 10px; flex: none; }
.today { color: var(--text-2); font-size: 13px; white-space: nowrap; padding-right: 6px; }
.today b { color: var(--text); font-weight: 600; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  display: inline-flex; align-items: center; justify-content: center; color: var(--text-2); position: relative; flex: none;
}
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
.icon-btn .ico { width: 18px; height: 18px; }
.bell .dot { position: absolute; top: 8px; right: 9px; width: 7px; height: 7px; border-radius: 50%; background: var(--bad); border: 2px solid var(--surface); }
.profile { display: flex; align-items: center; gap: 10px; padding: 4px 6px 4px 4px; border-radius: 10px; }
.avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #1D5FBF, #0B2545); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 13px; flex: none; }
.profile-name { font-weight: 600; font-size: 13px; white-space: nowrap; }
.profile-role { font-size: 12px; color: var(--muted); white-space: nowrap; }

.content { padding: 24px; max-width: 1600px; width: 100%; margin: 0 auto; }

/* ============ Page header ============ */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
.page-head h1 { font-size: 24px; }
.page-head .sub { color: var(--text-2); margin-top: 4px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ============ Buttons ============ */
.btn {
  display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 9px;
  border: 1px solid var(--border); background: var(--surface); color: var(--text); font-weight: 500; white-space: nowrap;
  transition: background .15s, border-color .15s;
}
.btn:hover { background: var(--surface-2); border-color: var(--border-strong); }
.btn .ico { width: 16px; height: 16px; }
.btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); }
.btn-ghost { border-color: transparent; background: transparent; color: var(--text-2); }
.btn-ghost:hover { background: var(--surface-3); }
.btn-sm { height: 30px; padding: 0 10px; font-size: 13px; border-radius: 7px; }
.btn-icon { width: 40px; padding: 0; justify-content: center; }
.btn:disabled { opacity: .5; cursor: default; }

.seg { display: inline-flex; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 500; color: var(--text-2); font-size: 13px; }
.seg button.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow); }

/* ============ Cards ============ */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 18px 20px 0; flex-wrap: wrap; }
.card-head h3 { font-size: 15px; }
.card-head .hint { color: var(--muted); font-size: 12px; }
.card-body { padding: 16px 20px 20px; }
.card-body.flush { padding: 12px 0 0; }

.grid { display: grid; gap: 16px; }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin-bottom: 16px; }
.kpis.k4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpis.k6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpi { padding: 18px 20px; position: relative; overflow: hidden; cursor: default; }
.kpi.link { cursor: pointer; transition: border-color .15s, transform .15s; }
.kpi.link:hover { border-color: var(--primary); }
.kpi-label { color: var(--text-2); font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.kpi-label .ico { width: 16px; height: 16px; color: var(--muted); }
.kpi-value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 8px; font-variant-numeric: tabular-nums; }
.kpi-value small { font-size: 15px; font-weight: 600; color: var(--text-2); margin-left: 2px; }
.kpi-foot { font-size: 12px; color: var(--muted); margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.kpi-bar { height: 4px; background: var(--surface-3); border-radius: 4px; margin-top: 12px; overflow: hidden; }
.kpi-bar span { display: block; height: 100%; border-radius: 4px; }
.kpi .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; }

.cols-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
.cols-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.cols-2-1 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; }
.cols-1-2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 2fr); gap: 16px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.mb16 { margin-bottom: 16px; }
.mt16 { margin-top: 16px; }

.chart-box { position: relative; height: 280px; }
.chart-box.tall { height: 340px; }
.chart-box.short { height: 220px; }

/* ============ Legend ============ */
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--text-2); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.donut-wrap { display: grid; grid-template-columns: 180px 1fr; gap: 20px; align-items: center; }
.donut-wrap .chart-box { height: 180px; }
.donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
.donut-center b { font-size: 26px; font-weight: 700; }
.donut-center span { font-size: 12px; color: var(--muted); }
.legend-list { display: flex; flex-direction: column; gap: 10px; }
.legend-row { display: grid; grid-template-columns: 12px 1fr auto auto; gap: 10px; align-items: center; font-size: 13px; }
.legend-row i { width: 10px; height: 10px; border-radius: 3px; }
.legend-row .v { font-weight: 600; font-variant-numeric: tabular-nums; }
.legend-row .p { color: var(--muted); font-size: 12px; min-width: 38px; text-align: right; font-variant-numeric: tabular-nums; }

/* ============ Badges ============ */
.badge {
  display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 20px; font-size: 12px; font-weight: 500;
  background: var(--surface-3); color: var(--text-2); white-space: nowrap;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.badge.plain::before { display: none; }
.b-ok { background: var(--ok-soft); color: var(--ok); }
.b-warn { background: var(--warn-soft); color: var(--warn); }
.b-bad { background: var(--bad-soft); color: var(--bad); }
.b-info { background: var(--info-soft); color: var(--primary); }
.b-gray { background: var(--surface-3); color: var(--text-2); }
.risk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; white-space: nowrap; }
.risk i { width: 8px; height: 8px; border-radius: 2px; transform: rotate(45deg); }
.risk.low { color: var(--ok); } .risk.low i { background: var(--ok); }
.risk.mid { color: var(--warn); } .risk.mid i { background: var(--warn); }
.risk.high { color: var(--bad); } .risk.high i { background: var(--bad); }

/* ============ Progress ============ */
.prog { display: flex; align-items: center; gap: 8px; min-width: 92px; }
.prog-bar { flex: 1; height: 6px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.prog-bar span { display: block; height: 100%; border-radius: 6px; background: var(--primary); }
.prog-bar span.low { background: var(--bad); } .prog-bar span.mid { background: var(--warn); } .prog-bar span.full { background: var(--ok); }
.prog b { font-weight: 600; font-size: 13px; width: 38px; text-align: right; font-variant-numeric: tabular-nums; }
.big-progress { height: 14px; background: var(--surface-3); border-radius: 10px; overflow: hidden; position: relative; }
.big-progress span { display: block; height: 100%; background: linear-gradient(90deg, var(--primary), var(--sky)); border-radius: 10px; }
.big-progress .marker { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); opacity: .5; }

/* ============ Tables ============ */
.table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th {
  text-align: left; font-weight: 600; color: var(--text-2); font-size: 12px; padding: 10px 12px; background: var(--surface-2);
  border-bottom: 1px solid var(--border); border-top: 1px solid var(--border); white-space: nowrap; user-select: none; position: sticky; top: 0;
}
.tbl th.sortable { cursor: pointer; }
.tbl th.sortable:hover { color: var(--text); }
.tbl th .sort { opacity: .35; margin-left: 4px; font-size: 10px; }
.tbl th.sorted .sort { opacity: 1; color: var(--primary); }
.tbl td { padding: 11px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl tbody tr { transition: background .1s; }
.tbl tbody tr.clickable { cursor: pointer; }
.tbl tbody tr.clickable:hover { background: var(--surface-2); }
.tbl tbody tr:last-child td { border-bottom: 0; }
.tbl td.r, .tbl th.r { text-align: right; }
.tbl td.c, .tbl th.c { text-align: center; }
.tbl .t-name { font-weight: 500; color: var(--text); min-width: 220px; max-width: 380px; }
.tbl .t-sub { color: var(--muted); font-size: 12px; margin-top: 2px; }
.tbl .nowrap { white-space: nowrap; }
.tbl .muted { color: var(--muted); }
.tbl .overdue { color: var(--bad); font-weight: 600; }
.tbl-foot { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; color: var(--muted); font-size: 12px; border-top: 1px solid var(--border); flex-wrap: wrap; gap: 8px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); }

/* ============ Filters ============ */
.filters { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; padding: 16px 20px; align-items: end; }
.filters .search-field { grid-column: span 2; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field label { font-size: 12px; color: var(--muted); font-weight: 500; }
.input, .select {
  height: 36px; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; padding: 0 10px; outline: none; width: 100%; min-width: 0;
}
.input:focus, .select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
.search-field { position: relative; }
.search-field .ico { position: absolute; left: 10px; bottom: 10px; width: 16px; height: 16px; color: var(--muted); }
.search-field .input { padding-left: 32px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 20px 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 6px 4px 10px; border-radius: 16px; background: var(--primary-soft); color: var(--primary); font-size: 12px; font-weight: 500; }
.chip button { border: 0; background: transparent; color: inherit; width: 18px; height: 18px; border-radius: 50%; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
.chip button:hover { background: rgba(0,0,0,.08); }
.chip .ico { width: 12px; height: 12px; }

/* ============ Attention ============ */
.attn-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; }
.attn-col { padding: 16px 20px 18px; border-right: 1px solid var(--border); min-width: 0; }
.attn-col:last-child { border-right: 0; }
.attn-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; margin-bottom: 12px; }
.attn-title .cnt { margin-left: auto; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 10px; }
.attn-title .ico { width: 16px; height: 16px; }
.attn-item { display: block; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); margin-bottom: 8px; cursor: pointer; border: 1px solid transparent; transition: border-color .15s; }
.attn-item:hover { border-color: var(--border-strong); }
.attn-item .n { font-weight: 500; font-size: 13px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.attn-item .m { font-size: 12px; color: var(--muted); margin-top: 4px; display: flex; gap: 8px; flex-wrap: wrap; }
.attn-item .m .bad { color: var(--bad); font-weight: 500; }

/* ============ Project card ============ */
.proj-hero { padding: 22px 24px; }
.proj-hero .tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.proj-hero h1 { font-size: 22px; line-height: 1.3; max-width: 980px; }
.proj-hero .desc { color: var(--text-2); margin-top: 10px; max-width: 980px; line-height: 1.6; }
.proj-progress { display: grid; grid-template-columns: 1fr auto; gap: 8px 24px; align-items: center; margin-top: 22px; }
.proj-progress .pct { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.proj-progress .lbl { color: var(--text-2); font-size: 13px; }
.proj-metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--border); }
.proj-metrics > div { padding: 16px 24px; border-right: 1px solid var(--border); }
.proj-metrics > div:last-child { border-right: 0; }
.proj-metrics .l { font-size: 12px; color: var(--muted); }
.proj-metrics .v { font-size: 18px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.proj-metrics .s { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.dl { display: grid; grid-template-columns: 170px 1fr; gap: 0; }
.dl > div { padding: 11px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.dl > div:nth-last-child(-n+2) { border-bottom: 0; }
.dl dt, .dl .k { color: var(--muted); }
.dl .v { color: var(--text); font-weight: 500; }
.people { display: flex; flex-direction: column; gap: 12px; }
.person { display: flex; align-items: center; gap: 12px; }
.person .av { width: 36px; height: 36px; border-radius: 50%; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px; flex: none; }
.person .nm { font-weight: 500; font-size: 13px; }
.person .rl { font-size: 12px; color: var(--muted); }

/* Timeline */
.timeline { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); position: relative; padding: 8px 0 4px; }
.tl-step { position: relative; text-align: center; padding: 0 6px; }
.tl-step::before { content: ""; position: absolute; top: 15px; left: 0; right: 0; height: 2px; background: var(--border); z-index: 0; }
.tl-step:first-child::before { left: 50%; }
.tl-step:last-child::before { right: 50%; }
.tl-step.done::before { background: var(--ok); }
.tl-step.done + .tl-step.current::before, .tl-step.done + .tl-step.overdue::before { background: linear-gradient(90deg, var(--ok) 50%, var(--border) 50%); }
.tl-dot { position: relative; z-index: 1; width: 32px; height: 32px; border-radius: 50%; margin: 0 auto; display: flex; align-items: center; justify-content: center; background: var(--surface); border: 2px solid var(--border-strong); color: var(--muted); font-weight: 600; font-size: 12px; }
.tl-dot .ico { width: 16px; height: 16px; }
.tl-step.done .tl-dot { background: var(--ok); border-color: var(--ok); color: #fff; }
.tl-step.current .tl-dot { border-color: var(--primary); color: var(--primary); box-shadow: 0 0 0 5px var(--primary-soft); }
.tl-step.overdue .tl-dot { border-color: var(--bad); color: var(--bad); box-shadow: 0 0 0 5px var(--bad-soft); }
.tl-name { font-weight: 600; font-size: 13px; margin-top: 12px; }
.tl-date { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
.tl-state { font-size: 11px; margin-top: 4px; font-weight: 500; }
.tl-step.done .tl-state { color: var(--ok); }
.tl-step.current .tl-state { color: var(--primary); }
.tl-step.overdue .tl-state { color: var(--bad); }
.tl-step.todo .tl-state { color: var(--muted); }

/* Workflow */
.workflow { display: flex; align-items: stretch; gap: 0; overflow-x: auto; padding: 4px 0 8px; }
.wf-step { flex: 1 0 118px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative; padding: 0 4px; cursor: pointer; }
.wf-step::after { content: ""; position: absolute; top: 20px; left: calc(50% + 24px); right: calc(-50% + 24px); height: 2px; background: var(--border); }
.wf-step:last-child::after { display: none; }
.wf-step.passed::after { background: var(--ok); }
.wf-ico { width: 42px; height: 42px; border-radius: 12px; background: var(--surface-3); color: var(--text-2); display: flex; align-items: center; justify-content: center; transition: transform .15s; border: 1px solid var(--border); }
.wf-ico .ico { width: 20px; height: 20px; }
.wf-step.passed .wf-ico { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.wf-step.current .wf-ico { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }
.wf-step.rejected .wf-ico { background: var(--bad); color: #fff; border-color: var(--bad); }
.wf-step.sel .wf-ico { transform: translateY(-2px); box-shadow: 0 0 0 3px var(--primary); }
.wf-name { font-size: 12px; font-weight: 600; margin-top: 10px; line-height: 1.3; }
.wf-cnt { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }

/* Stepper (doc status / support) */
.stepper { display: flex; gap: 6px; flex-wrap: wrap; }
.stepper .st { flex: 1 1 100px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); font-size: 12px; min-width: 0; }
.stepper .st b { display: block; font-size: 13px; margin-top: 2px; color: var(--text); font-weight: 600; }
.stepper .st.done { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.stepper .st.current { background: var(--primary-soft); border-color: var(--primary); color: var(--primary); }
.stepper .st.rejected { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.stepper .st { color: var(--muted); }

/* Status pipeline (documents) */
.pipeline { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0; }
.pipe { position: relative; padding: 16px 18px 16px 30px; background: var(--surface); border: 1px solid var(--border); cursor: pointer; clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%, 14px 50%); margin-right: -8px; transition: background .15s; }
.pipe:first-child { clip-path: polygon(0 0, calc(100% - 14px) 0, 100% 50%, calc(100% - 14px) 100%, 0 100%); padding-left: 18px; border-radius: 10px 0 0 10px; }
.pipe:last-child { clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 14px 50%); margin-right: 0; border-radius: 0 10px 10px 0; }
.pipe:hover { background: var(--surface-2); }
.pipe.active { background: var(--primary-soft); }
.pipe .pl { font-size: 12px; color: var(--text-2); font-weight: 500; }
.pipe .pv { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
.pipe.active .pl, .pipe.active .pv { color: var(--primary); }

.cat-tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 16px 20px 0; }
.cat-tab { border: 1px solid var(--border); background: var(--surface); padding: 6px 12px; border-radius: 18px; font-size: 13px; font-weight: 500; color: var(--text-2); display: inline-flex; gap: 8px; align-items: center; }
.cat-tab span { font-size: 11px; background: var(--surface-3); color: var(--text-2); padding: 0 7px; border-radius: 10px; font-weight: 600; }
.cat-tab:hover { border-color: var(--border-strong); }
.cat-tab.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.cat-tab.active span { background: rgba(255,255,255,.18); color: #fff; }

/* ============ DZO ============ */
.dzo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 16px; }
.dzo-card { padding: 20px; cursor: pointer; transition: border-color .15s, box-shadow .15s; display: flex; flex-direction: column; gap: 16px; }
.dzo-card:hover { border-color: var(--primary); box-shadow: 0 6px 20px rgba(11,37,69,.08); }
.dzo-top { display: flex; gap: 12px; align-items: flex-start; }
.dzo-logo { width: 44px; height: 44px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex: none; letter-spacing: .02em; }
.dzo-name { font-weight: 600; font-size: 15px; }
.dzo-reg { color: var(--muted); font-size: 12px; margin-top: 2px; }
.dzo-top .risk { margin-left: auto; }
.dzo-stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 8px; }
.dzo-stats .l { font-size: 11px; color: var(--muted); }
.dzo-stats .v { font-size: 16px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.dzo-stats .v.bad { color: var(--bad); }

/* ============ Calendar ============ */
.cal-layout { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; gap: 12px; flex-wrap: wrap; }
.cal-head h3 { font-size: 17px; text-transform: capitalize; min-width: 150px; }
.cal-nav { display: flex; gap: 6px; align-items: center; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: 1px solid var(--border); }
.cal-dow { padding: 8px 10px; font-size: 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); background: var(--surface-2); }
.cal-cell { min-height: 112px; padding: 6px 6px 8px; border-right: 1px solid var(--border); border-bottom: 1px solid var(--border); cursor: pointer; min-width: 0; transition: background .1s; }
.cal-cell:nth-child(7n) { border-right: 0; }
.cal-cell:hover { background: var(--surface-2); }
.cal-cell.other { background: var(--surface-2); }
.cal-cell.other .cal-day { color: var(--muted); opacity: .6; }
.cal-cell.sel { background: var(--primary-soft); }
.cal-day { font-size: 12px; font-weight: 600; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin-bottom: 4px; }
.cal-cell.today .cal-day { background: var(--primary); color: #fff; }
.cal-ev { display: block; font-size: 11px; padding: 2px 6px; border-radius: 4px; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; background: var(--surface-3); color: var(--text); border-left: 3px solid var(--muted); }
.cal-ev.overdue { background: var(--bad-soft); color: var(--bad); font-weight: 600; }
.cal-ev.done { opacity: .6; }
.cal-more { font-size: 11px; color: var(--muted); padding-left: 4px; }
.cal-types { display: flex; gap: 8px; flex-wrap: wrap; }
.type-toggle { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 5px 10px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); }
.type-toggle i { width: 8px; height: 8px; border-radius: 50%; }
.type-toggle.off { opacity: .45; text-decoration: line-through; }
.ev-list { display: flex; flex-direction: column; gap: 8px; }
.ev-item { display: grid; grid-template-columns: 46px 1fr; gap: 12px; padding: 10px 12px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--muted); cursor: pointer; }
.ev-item:hover { background: var(--surface-3); }
.ev-item.overdue { background: var(--bad-soft); }
.ev-date { text-align: center; line-height: 1.1; }
.ev-date b { display: block; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
.ev-date span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
.ev-title { font-size: 13px; font-weight: 500; }
.ev-meta { font-size: 12px; color: var(--muted); margin-top: 2px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.ev-item.overdue .ev-title { color: var(--bad); }

/* ============ AI ============ */
.ai-fab {
  position: fixed; right: 24px; bottom: 24px; z-index: 60; display: inline-flex; align-items: center; gap: 10px;
  height: 52px; padding: 0 20px 0 16px; border-radius: 26px; border: 0; background: linear-gradient(135deg, #1D5FBF, #0B2545);
  color: #fff; font-weight: 600; box-shadow: 0 10px 28px rgba(11,37,69,.35); transition: transform .15s;
}
.ai-fab:hover { transform: translateY(-2px); }
.ai-fab .ico { width: 20px; height: 20px; }
.ai-fab.hidden { display: none; }
.ai-panel {
  position: fixed; right: 24px; bottom: 24px; width: 460px; height: min(680px, calc(100vh - 48px)); z-index: 70;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; box-shadow: var(--shadow-lg);
  display: none; flex-direction: column; overflow: hidden;
}
.ai-panel.open { display: flex; animation: pop .18s ease-out; }
@keyframes pop { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }
.ai-head { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; background: var(--navy); color: #fff; }
.ai-head-l { display: flex; align-items: center; gap: 12px; }
.ai-head-r { display: flex; gap: 6px; }
.ai-head .icon-btn { background: rgba(255,255,255,.08); border-color: transparent; color: #fff; width: 34px; height: 34px; }
.ai-head .icon-btn:hover { background: rgba(255,255,255,.16); }
.ai-avatar { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #3FA2F7, #1D5FBF); display: flex; align-items: center; justify-content: center; }
.ai-avatar .ico { width: 20px; height: 20px; }
.ai-title { font-weight: 600; }
.ai-sub { font-size: 12px; color: #9FB4D3; }
.ai-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: var(--surface-2); }
.msg { max-width: 92%; font-size: 13px; line-height: 1.5; }
.msg.user { align-self: flex-end; background: var(--primary); color: #fff; padding: 9px 13px; border-radius: 14px 14px 4px 14px; }
.msg.bot { align-self: flex-start; background: var(--surface); border: 1px solid var(--border); padding: 12px 14px; border-radius: 14px 14px 14px 4px; width: 92%; }
.msg.bot p { margin: 0 0 8px; }
.msg.bot p:last-child { margin-bottom: 0; }
.msg.bot ul { margin: 4px 0 8px; padding-left: 18px; }
.msg.bot .ai-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 8px 0; }
.msg.bot .ai-kpi { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; }
.msg.bot .ai-kpi span { display: block; font-size: 11px; color: var(--muted); }
.msg.bot .ai-kpi b { font-size: 15px; font-variant-numeric: tabular-nums; }
.msg.bot .tbl { font-size: 12px; margin: 8px 0; }
.msg.bot .tbl th { padding: 6px 8px; position: static; }
.msg.bot .tbl td { padding: 7px 8px; }
.msg.bot .tbl .t-name { min-width: 150px; }
.msg.bot .table-wrap { border: 1px solid var(--border); border-radius: 8px; margin: 8px 0; }
.msg.bot .table-wrap .tbl { margin: 0; }
.msg.bot .table-wrap .tbl th { border-top: 0; }
.msg .conclusion { border-left: 3px solid var(--primary); padding: 6px 10px; background: var(--primary-soft); border-radius: 0 6px 6px 0; margin-top: 8px; font-size: 12px; color: var(--text); }
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: blink 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
.ai-suggest { display: flex; gap: 6px; padding: 10px 12px 0; overflow-x: auto; background: var(--surface); border-top: 1px solid var(--border); scrollbar-width: none; }
.ai-suggest button { flex: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--text-2); padding: 6px 10px; border-radius: 14px; font-size: 12px; white-space: nowrap; }
.ai-suggest button:hover { border-color: var(--primary); color: var(--primary); }
.ai-input { display: flex; gap: 8px; padding: 10px 12px 12px; background: var(--surface); }
.ai-input input { flex: 1; height: 40px; border: 1px solid var(--border); border-radius: 10px; padding: 0 12px; background: var(--surface-2); outline: none; min-width: 0; }
.ai-input input:focus { border-color: var(--primary); background: var(--surface); }

/* ============ Modal ============ */
.modal-root { position: fixed; inset: 0; z-index: 90; display: none; align-items: center; justify-content: center; padding: 20px; background: rgba(8, 20, 38, .45); backdrop-filter: blur(2px); }
.modal-root.open { display: flex; }
.modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-lg); width: 100%; max-width: 760px; max-height: calc(100vh - 40px); display: flex; flex-direction: column; animation: pop .18s ease-out; }
.modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 20px 24px 16px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 18px; line-height: 1.3; }
.modal-head .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
.modal-body { padding: 20px 24px; overflow-y: auto; }
.modal-foot { padding: 14px 24px; border-top: 1px solid var(--border); display: flex; justify-content: flex-end; gap: 8px; flex-wrap: wrap; }
.section-title { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin: 20px 0 10px; }
.section-title:first-child { margin-top: 0; }
.history { display: flex; flex-direction: column; gap: 0; border-left: 2px solid var(--border); margin-left: 6px; }
.history .h { position: relative; padding: 0 0 14px 18px; font-size: 13px; }
.history .h::before { content: ""; position: absolute; left: -7px; top: 4px; width: 12px; height: 12px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ok); }
.history .h.cur::before { border-color: var(--primary); background: var(--primary); }
.history .h .d { color: var(--muted); font-size: 12px; }

/* ============ Toast ============ */
.toasts { position: fixed; top: 76px; right: 24px; z-index: 100; display: flex; flex-direction: column; gap: 8px; }
.toast { background: var(--navy); color: #fff; padding: 12px 16px; border-radius: 10px; box-shadow: var(--shadow-lg); font-size: 13px; max-width: 360px; animation: pop .2s ease-out; display: flex; gap: 10px; align-items: center; }
.toast .ico { width: 16px; height: 16px; color: #6FD39B; }

/* Misc */
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.spacer { flex: 1; }
.text-muted { color: var(--muted); }
.text-2 { color: var(--text-2); }
.text-bad { color: var(--bad); }
.text-ok { color: var(--ok); }
.fw6 { font-weight: 600; }
.small { font-size: 12px; }
.divider { height: 1px; background: var(--border); margin: 16px 0; }
.link-btn { border: 0; background: none; color: var(--primary); font-weight: 500; padding: 0; font-size: 13px; }
.link-btn:hover { text-decoration: underline; }
.bars-list { display: flex; flex-direction: column; gap: 12px; }
.bl-row .bl-top { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; gap: 8px; }
.bl-row .bl-top span:last-child { font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
.bl-track { height: 8px; background: var(--surface-3); border-radius: 6px; overflow: hidden; }
.bl-track span { display: block; height: 100%; background: var(--c1); border-radius: 6px; }
.risk-card { border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
.risk-card.high { border-left: 3px solid var(--bad); }
.risk-card.mid { border-left: 3px solid var(--warn); }
.risk-card.low { border-left: 3px solid var(--ok); }
.risk-card .rd { font-weight: 500; }
.risk-card .rm { grid-column: 1 / -1; display: flex; gap: 18px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.risk-card .rm b { color: var(--text); font-weight: 500; }
.risks-list { display: flex; flex-direction: column; gap: 10px; }
.notice { padding: 12px 14px; border-radius: 10px; background: var(--warn-soft); color: var(--warn); font-size: 13px; display: flex; gap: 10px; align-items: flex-start; }
.notice.bad { background: var(--bad-soft); color: var(--bad); }
.notice.info { background: var(--info-soft); color: var(--primary); }
.notice .ico { width: 16px; height: 16px; margin-top: 1px; }
.notice b { color: inherit; }

/* ============ Responsive ============ */
@media (max-width: 1360px) {


  .kpis.k6 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 1200px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .attn-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .attn-col:nth-child(2) { border-right: 0; }
  .attn-col:nth-child(-n+2) { border-bottom: 1px solid var(--border); }
  .cal-layout { grid-template-columns: 1fr; }
  .profile-text { display: none; }
}
@media (max-width: 1024px) {
  .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .22s ease; box-shadow: var(--shadow-lg); }
  .sidebar.open { transform: none; }
  .sidebar-backdrop.open { display: block; position: fixed; inset: 0; background: rgba(8,20,38,.45); z-index: 35; }
  .icon-btn.menu-btn { display: inline-flex; }
  .topbar { padding: 0 16px; gap: 10px; }
  .content { padding: 20px 16px; }
  .cols-2, .cols-2-1, .cols-1-2, .cols-3 { grid-template-columns: minmax(0, 1fr); }

  /* ============ Журнал изменений (аудит) ============ */
  const mln = (x) => (Math.round(x * 10) / 10).toFixed(1).replace('.', ',') + ' млн ₸';

  const WF_ACTION = { DRAFT: 'Создан проект', SUBMITTED: 'Проект отправлен на проверку', REVIEW: 'Проект взят на проверку', RETURNED: 'Проект возвращен на доработку', ACCEPTED: 'Проект принят КМГ', CONTROL: 'Проект поставлен на контроль', IMPL: 'Начата реализация', DONE: 'Проект завершен', ARCHIVE: 'Проект перемещен в архив' };
  PROJECTS.forEach(p => {

    if (p.status === 'В работе' || p.status === 'На контроле') {
      const dzoU = DZO_USER[p.dzo];

      const steps = between(2, 4);
      for (let k2 = 0; k2 < steps && pr > 5; k2++) {
        const old = Math.max(0, pr - between(4, 12));
        A(t, dzoU, 'Изменен % реализации', 'Проект', p, old + '%', pr + '%');
        pr = old; t = withTime(addDays(t, -between(12, 30)));
      }

      if (p.risk === 'Высокий') A(withTime(addDays(TODAY, -between(3, 40))), KMG_REVIEWER(p.dzo), 'Изменен уровень риска', 'Проект', p, 'Средний', 'Высокий');
      if (R() < 0.25) A(withTime(addDays(TODAY, -between(10, 80))), dzoU, 'Изменен бюджет', 'Проект', p, mln(p.budget * (0.9 + R() * 0.06)), mln(p.budget));
      if (R() < 0.2) A(withTime(addDays(TODAY, -between(10, 90))), dzoU, 'Изменены координаты', 'Проект', p, `${(p.lat - 0.02).toFixed(4)}, ${(p.lng + 0.03).toFixed(4)}`, `${p.lat.toFixed(4)}, ${p.lng.toFixed(4)}`);
      if (R() < 0.15) A(withTime(addDays(TODAY, -between(10, 90))), KMG_REVIEWER(p.dzo), 'Изменен ответственный', 'Проект', p, PEOPLE[(p.id + 4) % PEOPLE.length].short, p.resp.short);
    }

    p.risks.forEach(r => { if (r.identified > addDays(TODAY, -120)) A(withTime(r.identified), DZO_USER[p.dzo], 'Добавлен риск', 'Риск', p, '', r.text); });
  });
  const PBY = Object.fromEntries(PROJECTS.map(p => [p.id, p]));
  DOCUMENTS.forEach(dc => { if (dc.projectId && dc.date > addDays(TODAY, -60) && dc.date >= PBY[dc.projectId].wfHistory[0].at) A(withTime(dc.date), DZO_USER[dc.dzo], 'Добавлен документ', 'Документ', PBY[dc.projectId], '', dc.title); });
  USERS.forEach(u => {
    A(u.created, 'u1', 'Создан пользователь', 'Пользователь', null, '', `${u.email} (${u.role})`, u.dzo);
    if (u.status === 'Активен') A(u.lastLogin, u.id, 'Вход в систему', 'Сессия', null, '', '', u.dzo);
    else A(addDays(TODAY, -40), 'u1', 'Пользователь заблокирован', 'Пользователь', null, 'Активен', 'Заблокирован', u.dzo);

    else if (a.action === 'Проект возвращен на доработку') N(a.at, 'DZO', p, 'return', `Проект «${p.name}» возвращен на доработку`);

    else if (a.action === 'Изменен % реализации' && a.new === '100%') N(a.at, 'ALL', p, 'done', `Проект «${p.name}» достиг 100% реализации`);
    else if (a.action === 'Добавлен документ') N(a.at, 'KMG', p, 'doc', `Добавлен новый документ по проекту «${p.name}»`);

  EVENTS.filter(e => e.type === 'control' && !e.done && e.date >= TODAY && e.date <= addDays(TODAY, 14)).forEach(e => N(withTime(addDays(TODAY, -1)), 'ALL', PBY[e.projectId], 'control', `Истекает срок контрольной точки ${fmtDate(e.date)}: «${PBY[e.projectId].name}»`));
  PROJECTS.filter(p => p.overdue).slice(0, 5).forEach(p => N(withTime(addDays(p.planEnd, 1)), 'ALL', p, 'overdue', `Просрочен срок реализации проекта «${p.name}»`));
  NOTIFS.forEach(n => { if (n.at < addDays(TODAY, -3)) n.readBy = USERS.map(u => u.id); });

  /* ============ Справочники и настройки ============ */
  const DIRS = {

  const FUNDING = {

    ceo: { label: 'Фонд генеральных директоров (в рамках лимита)', short: 'ФГД', cls: 'b-warn' },

  };
  const CEO_DZO = ['omg', 'emg', 'anpz', 'pnhz'];   // участники Фонда генеральных директоров
  const byBudget = PROJECTS.slice().sort((a, b) => a.budget - b.budget);
  const ceoIds = new Set(byBudget.filter(p => CEO_DZO.includes(p.dzo) && p.budget <= 22 && p.id !== 1).slice(0, 14).map(p => p.id));
  PROJECTS.forEach(p => {
    p.funding = ceoIds.has(p.id) ? 'ceo' : (p.budget >= 35 || p.direction === 'Социальная инфраструктура') ? 'out' : 'limit';
  });
  CHARITY.forEach(c => { c.ceo = CEO_DZO.includes(c.dzo) && c.decision === 'Одобрено' && R() < 0.45; });

  // Суммы проекта в конкретном году: план (бюджет) и факт (освоение), равномерно по месяцам реализации
  function projYear(p, Y) {
    const mi = (dt) => dt.getFullYear() * 12 + dt.getMonth();
    const s = mi(p.start), e = mi(p.planEnd), now = mi(TODAY);
    const ys = Y * 12, ye = Y * 12 + 11;
    const ov = (a, b) => Math.max(0, Math.min(b, ye) - Math.max(a, ys) + 1);
    const pre = PRE_ACCEPT.includes(p.wf);
    const plan = pre ? 0 : p.budget * ov(s, e) / (e - s + 1);
    let fact = 0;
    if (!pre && p.spent > 0) {
      const fe = implStatus(p.wf) === 'Завершено' ? e : Math.max(s, now);
      fact = p.spent * ov(s, fe) / (fe - s + 1);
    }
    return { plan, fact };
  }
  const round10 = (x) => Math.max(10, Math.round(x / 10) * 10);
  const within = (p) => p.funding === 'limit' || p.funding === 'ceo';
  const charityYear = (Y, f = () => true) => {
    const L = CHARITY.filter(c => c.date.getFullYear() === Y && c.decision === 'Одобрено' && f(c));
    return { committed: L.reduce((s, c) => s + c.amount, 0), paid: L.filter(c => c.stage >= 7).reduce((s, c) => s + c.amount, 0) };
  };
  const FIN = { limits: {}, ceo: {} };
  const yFact = (Y) => PROJECTS.filter(within).reduce((s, p) => s + projYear(p, Y).fact, 0) + charityYear(Y).paid;
  // 2026 — утверждённые значения: лимит 1 274 000 000 ₸, ФГД 120 000 000 ₸ (ОМГ, ЭМГ, АНПЗ, ПНХЗ — по 30 000 000 ₸)
  const LIM = { 2024: round10(yFact(2024) / 0.97), 2025: round10(yFact(2025) / 0.9), 2026: 1274 };
  LIM[2027] = round10(LIM[2026] * 1.05);
  [2024, 2025, 2026, 2027].forEach(Y => {
    FIN.limits[Y] = { amount: LIM[Y], approvedAt: new Date(Y - 1, 11, 20), approvedBy: 'Решение Правления АО НК «КМГ»', note: Y === 2027 ? 'Проект лимита на 2027 год' : `Протокол № ${Y - 2010}/${Y - 1}` };
    const alloc = {};
    if (Y === 2026) CEO_DZO.forEach(z => { alloc[z] = 30; });
    else CEO_DZO.forEach(z => {
      const pp = PROJECTS.filter(p => p.funding === 'ceo' && p.dzo === z);
      const usePlan = pp.reduce((s, p) => s + projYear(p, Y).plan, 0) + charityYear(Y, c => c.ceo && c.dzo === z).committed;
      const a = Y === 2027 ? 30 : usePlan > 0 ? Math.round(usePlan * 1.2 + 2) : 5;
      alloc[z] = a;
    });
    const fund = Object.values(alloc).reduce((s, x) => s + x, 0);

  /* ---------------- доступ ---------------- */

    replaceArr(DOCUMENTS, ALL.documents.filter(d => hasDzo(d.dzo) && (!d.projectId || vis.has(d.projectId))));
    replaceArr(EVENTS, ALL.events.filter(e => user && (!e.dzo || hasDzo(e.dzo)) && (!e.projectId || vis.has(e.projectId))));

  // Безопасное получение проекта по ID: проверка прав выполняется всегда, независимо от того, как получен ID
  function getProject(id) {

  function can(action, p) {

      case 'editProgress': return (r === 'ADMIN' || r === 'DZO') && ['ACCEPTED', 'CONTROL', 'IMPL'].includes(wf);
      case 'edit': return can('editFull', p) || can('editProgress', p);
      case 'submit': return (r === 'DZO' || r === 'ADMIN') && ['DRAFT', 'RETURNED'].includes(wf);
      case 'review': return (r === 'KMG' || r === 'ADMIN') && ['SUBMITTED', 'REVIEW'].includes(wf);
      case 'control': return (r === 'KMG' || r === 'ADMIN') && ['ACCEPTED', 'IMPL'].includes(wf);
      case 'startImpl': return ['ACCEPTED', 'CONTROL'].includes(wf);

      case 'editRisk': return r !== 'KMG' || true;

  /* ---------------- сессия ---------------- */

  /* ---------------- аудит и уведомления ---------------- */

  /* ---------------- workflow ---------------- */
  function setWf(p, to, comment) {

  const FIELD_META = {

    region: ['Изменен регион', 'full'], direction: ['Изменено направление', 'full'], dzo: ['Изменено ДЗО', 'admin'],
    spent: ['Изменено освоение', 'progress', v => fmtMln(v)], progress: ['Изменен % реализации', 'progress', v => v + '%'], smr: ['Изменен % СМР', 'progress', v => v + '%'],
    planEnd: ['Изменен срок', 'progress', v => fmtDate(v)], risk: ['Изменен уровень риска', 'progress'], resp: ['Изменен ответственный', 'progress', v => v.short],

  function updateProject(p, patch) {
    if (!can('edit', p)) throw new AccessError();
    const full = can('editFull', p);
    let changes = 0;
    if (patch.resp && typeof patch.resp === 'string') patch.resp = personFromText(patch.resp);
    for (const [k, v] of Object.entries(patch)) {
      if (k === 'lat' || k === 'lng') continue;
      const meta = FIELD_META[k]; if (!meta) continue;
      if (meta[1] === 'full' && !full) throw new AccessError(`Поле «${meta[0].replace(/^Измен(ен|ено|ены) /, '')}» можно изменить только в статусе «Черновик» или «Возвращен на доработку»`);
      if (meta[1] === 'admin' && user.role !== 'ADMIN') continue;
      const old = p[k];
      const same = old instanceof Date ? (v instanceof Date && old.getTime() === v.getTime()) : (k === 'resp' ? old.short === v.short : old === v);
      if (same) continue;
      p[k] = v; changes++;
      const f = meta[2] || (x => x);
      audit(meta[0], 'Проект', p, old == null ? '—' : f(old), f(v));

    }

  // Импорт проектов из CSV — только администратор (проверка на уровне логики данных)
  function importProjects(rows, fileName) {

  function addDocument(p, d) {

    const doc = { id, number: `ВХ-${now().getFullYear()}/${String(3000 + id)}`, title: d.title, category: d.category, projectId: p ? p.id : null, dzo: p ? p.dzo : (user.dzo || 'kto'), date: now(), statusIdx: 0, author: shortName(user), due: addDays(now(), 10), size: d.size || '—', format: d.format || 'PDF' };

  /* ---------------- пользователи (ADMIN) ---------------- */
  const accessLabel = (u) => u.access === 'ALL' ? 'Все ДЗО' : u.access.map(z => (DZO_BY_ID[z] || { short: z }).short).join(', ');
  function createUser(data) {

    const h = Math.round(m / 60); if (h < 24) return `${h} ч назад`;
    const d = Math.round(h / 24); if (d < 30) return `${d} ${plural(d, 'день', 'дня', 'дней')} назад`;
    return fdate(dt);
  }
  function roleBadge(role) { return `<span class="badge plain ${Core.ROLE_CLS[role]}">${role}</span>`; }

  // ---------- drawer ----------
  function openDrawer({ title, sub = '', body, foot = '' }) {
    let d = document.getElementById('drawer');
    if (!d) { d = document.createElement('div'); d.id = 'drawer'; d.className = 'drawer-root'; document.body.appendChild(d); }
    d.innerHTML = `<div class="drawer"><div class="modal-head"><div><h2>${title}</h2>${sub ? `<div class="sub">${sub}</div>` : ''}</div><button class="icon-btn" data-dclose>${icon('x')}</button></div>
      <div class="drawer-body">${body}</div>${foot ? `<div class="modal-foot">${foot}</div>` : ''}</div>`;
    d.classList.add('open');
    d.querySelectorAll('[data-dclose]').forEach(b => b.onclick = closeDrawer);
    d.onclick = (e) => { if (e.target === d) closeDrawer(); };
    return d.querySelector('.drawer');
  }
  function closeDrawer() { const d = document.getElementById('drawer'); if (d) { d.classList.remove('open'); d.innerHTML = ''; } }
  function toastErr(msg) {
    const t = document.createElement('div');
    t.className = 'toast err';
    t.innerHTML = icon('alert') + `<span>${msg}</span>`;
    document.getElementById('toasts').appendChild(t);
    setTimeout(() => { t.style.transition = 'opacity .3s'; t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3600);
  }
  // выполнить действие с обработкой отказа в доступе / ошибок валидации
  function act(fn, okMsg) {
    try { const r = fn(); if (okMsg) toast(okMsg); return r === undefined ? true : r; }
    catch (e) { toastErr(e.message || 'Ошибка'); console.warn(e); return false; }
  }
  const maps = [];
  function destroyMaps() { while (maps.length) { try { maps.pop().remove(); } catch (e) { } } }

  window.UI = {
    wfBadge, wfStepper, fdatetime, ftime, ago, roleBadge, openDrawer, closeDrawer, toastErr, act, maps, destroyMaps,
    icon, hydrateIcons, money, num, pct, fdate, fdateLong, daysBetween, esc, initials, plural,
    statusBadge, riskBadge, progressBar, cssVar, palette, makeChart, destroyCharts, baseOptions, axes, barStyle,
    openModal, closeModal, toast, sortRows, RISK_ORDER, downloadCSV, TODAY
  };
})();

</script>
  <script>
/* Страницы приложения */
(function () {
  'use strict';
  const {
    PROJECTS, DZO, DZO_BY_ID, REGIONS, DIRECTIONS, STATUSES, RISKS, CHARITY, CH_STAGES, CH_DIRS,
    SUPPORT, SUP_STAGES, SUP_TYPES, DOCUMENTS, DOC_CATS, DOC_STATUSES, EVENTS, EVENT_TYPES, TODAY
  } = DB;
  const {
    icon, money, num, pct, fdate, fdateLong, daysBetween, esc, initials, plural, statusBadge, riskBadge, progressBar,
    cssVar, palette, makeChart, baseOptions, axes, barStyle, openModal, closeModal, toast, sortRows, RISK_ORDER, downloadCSV
  } = UI;

  const view = () => document.getElementById('view');
  const sum = (arr, f) => arr.reduce((s, x) => s + (typeof f === 'function' ? f(x) : x[f]), 0);
  const shortRegion = (r) => r.replace(' область', '').replace('Западно-Казахстанская', 'ЗКО');
  const countBy = (arr, key) => arr.reduce((m, x) => { const k = typeof key === 'function' ? key(x) : x[key]; m[k] = (m[k] || 0) + 1; return m; }, {});
  const monthIdx = (dt) => dt.getFullYear() * 12 + dt.getMonth();
  const MONTHS = ['янв', 'фев', 'мар', 'апр', 'май', 'июн', 'июл', 'авг', 'сен', 'окт', 'ноя', 'дек'];
  const MONTHS_FULL = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
  const go = (h) => { location.hash = h; };
  const statusColor = (s) => s === 'Завершено' ? cssVar('--st-done') : s === 'На контроле' ? cssVar('--st-ctrl') : s === 'На согласовании' ? cssVar('--st-appr') : cssVar('--st-work');

  const STATE = window.STATE = {
    reg: { q: '', region: '', dzo: '', direction: '', status: '', risk: '', period: '', sort: 'id', dir: 1 },
    ch: { q: '', direction: '', status: '', type: '', year: '', stage: null, page: 1 },
    sup: { q: '', type: '', status: '', dzo: '', category: '', page: 1 },
    doc: { q: '', cat: '', status: null, dzo: '' },
    cal: { y: TODAY.getFullYear(), m: TODAY.getMonth(), sel: new Date(TODAY), off: {} },
    an: { period: 'all' }
  };

  // ---------- aggregations ----------
  function monthly(projects, startIdx, count) {
    const plan = Array(count).fill(0), fact = Array(count).fill(0);
    const nowI = monthIdx(TODAY);
    // сезонность строительных работ: зимой освоение ниже, в конце года — пик закрытия актов
    const PW = [0.6, 0.7, 0.9, 1.05, 1.1, 1.15, 1.1, 1.1, 1.15, 1.1, 1.0, 1.3];
    const FW = [0.45, 0.6, 0.85, 1.0, 1.2, 1.1, 0.95, 1.15, 1.25, 1.05, 1.1, 1.5];
    const spread = (total, s, e, W, arr) => {
      let ws = 0; for (let i = s; i <= e; i++) ws += W[i % 12] * (1 + ((i * 7 + s) % 5 - 2) * 0.06);
      for (let i = s; i <= e; i++) if (i >= startIdx && i < startIdx + count) arr[i - startIdx] += total * W[i % 12] * (1 + ((i * 7 + s) % 5 - 2) * 0.06) / ws;
    };
    projects.forEach(p => {
      const s = monthIdx(p.start), e = monthIdx(p.planEnd);
      spread(p.budget, s, e, PW, plan);
      const fe = p.status === 'Завершено' ? e : Math.max(s, nowI);
      spread(p.spent, s, fe, FW, fact);
    });
    for (let i = 0; i < count; i++) if (startIdx + i > nowI) fact[i] = null;
    return { plan: plan.map(v => Math.round(v * 10) / 10), fact: fact.map(v => v == null ? null : Math.round(v * 10) / 10) };
  }
  function quarterize(arr) {
    const out = [];
    for (let i = 0; i < arr.length; i += 3) {
      const part = arr.slice(i, i + 3);
      out.push(part.every(v => v == null) ? null : Math.round(sum(part, v => v || 0) * 10) / 10);
    }
    return out;
  }
  function overdueDays(p) { return daysBetween(p.planEnd, TODAY); }
  function attention() {
    const active = PROJECTS.filter(p => p.status !== 'Завершено');
    return {
      overdue: active.filter(p => p.overdue).sort((a, b) => a.planEnd - b.planEnd),
      high: active.filter(p => p.risk === 'Высокий').sort((a, b) => a.progress - b.progress),
      docs: PROJECTS.filter(p => p.docsMissing),
      commission: PROJECTS.filter(p => p.commission)
    };
  }
  function dzoStats(z) {
    const ps = PROJECTS.filter(p => p.dzo === z.id);
    const ch = CHARITY.filter(c => c.dzo === z.id);
    const overdueProjects = ps.filter(p => p.overdue).length;
    const overdueRisks = sum(ps, p => p.risks.filter(r => r.status !== 'Устранён' && r.due < TODAY).length);
    const overdueCtrl = ps.filter(p => p.timeline.some(t => t.state === 'overdue')).length;
    const highActive = ps.filter(p => p.risk === 'Высокий' && p.status !== 'Завершено').length;
    const overdue = overdueProjects + overdueRisks;
    const score = highActive * 2 + overdueProjects * 2 + overdueRisks;
    const risk = score >= 9 ? 'Высокий' : score >= 3 ? 'Средний' : 'Низкий';
    const budget = sum(ps, 'budget'), spent = sum(ps, 'spent');
    const cnt = (f) => ps.filter(f).length;
    return { ps, ch, count: ps.length, budget, spent, charity: ch.length, programs: z.programs, overdue, overdueProjects, overdueCtrl, risk, highActive,
      work: cnt(p => p.status === 'В работе' || p.status === 'На контроле'), done: cnt(p => p.status === 'Завершено'), review: cnt(p => ['SUBMITTED', 'REVIEW'].includes(p.wf)), returned: cnt(p => p.wf === 'RETURNED') };
  }
  window.AGG = { monthly, attention, dzoStats, shortRegion };

  // ---------- common snippets ----------
  function kpi({ label, value, unit = '', foot = '', ico, color, bar, link }) {
    return `<div class="card kpi${link ? ' link' : ''}" ${link ? `data-go="${link}"` : ''}>
      ${color ? `<span class="accent" style="background:${color}"></span>` : ''}
      <div class="kpi-label">${ico ? icon(ico) : ''}${label}</div>
      <div class="kpi-value">${value}${unit ? `<small>${unit}</small>` : ''}</div>
      ${bar != null ? `<div class="kpi-bar"><span style="width:${bar}%;background:${color || 'var(--primary)'}"></span></div>` : ''}
      ${foot ? `<div class="kpi-foot">${foot}</div>` : ''}</div>`;
  }
  function bindGo(root) {
    root.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', (e) => {
      if (e.target.closest('a,button') && e.target.closest('[data-go]') !== el) return;
      go(el.dataset.go);
    }));
  }
  function options(list, sel, all = 'Все') {
    return `<option value="">${all}</option>` + list.map(v => {
      const [val, lab] = Array.isArray(v) ? v : [v, v];
      return `<option value="${esc(val)}" ${String(sel) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`;
    }).join('');
  }
  function donutLegend(items, total) {
    return `<div class="legend-list">${items.map(it => `<div class="legend-row"><i style="background:${it.color}"></i><span>${it.label}</span><span class="v">${it.valueLabel ?? num(it.value)}</span><span class="p">${total ? Math.round(it.value / total * 100) : 0}%</span></div>`).join('')}</div>`;
  }
  function donut(id, items, centerTop, centerSub) {
    makeChart(id, {
      type: 'doughnut',
      data: { labels: items.map(i => i.label), datasets: [{ data: items.map(i => i.value), backgroundColor: items.map(i => i.color), borderColor: cssVar('--surface'), borderWidth: 2, hoverOffset: 4 }] },
      options: Object.assign(baseOptions(), {
        cutout: '72%',
        plugins: Object.assign(baseOptions().plugins, {
          tooltip: Object.assign(baseOptions().plugins.tooltip, { callbacks: { label: (c) => ` ${c.label}: ${items[c.dataIndex].valueLabel ?? num(c.raw)}` } })
        })
      })
    });
  }
  function hbar(id, labels, data, { color, fmt = num, tick, onClick, max } = {}) {
    return makeChart(id, {
      type: 'bar',
      data: { labels, datasets: [{ data, backgroundColor: color || cssVar('--c1'), ...barStyle, maxBarThickness: 18 }] },
      options: Object.assign(baseOptions(), {
        indexAxis: 'y',
        scales: axes({ x: { grid: { color: cssVar('--grid') }, border: { display: false }, max, ticks: { color: cssVar('--text-2'), font: { size: 11 }, maxRotation: 0, callback: (v) => (tick || fmt)(v) } }, y: { grid: { display: false }, border: { color: cssVar('--grid') }, ticks: { autoSkip: false, color: cssVar('--text-2'), font: { size: 11 } } } }),
        plugins: Object.assign(baseOptions().plugins, { tooltip: Object.assign(baseOptions().plugins.tooltip, { callbacks: { label: (c) => ' ' + fmt(c.raw) } }) }),
        onClick: onClick ? (e, els) => { if (els.length) onClick(els[0].index); } : undefined,
        onHover: onClick ? (e, els) => { e.native.target.style.cursor = els.length ? 'pointer' : 'default'; } : undefined
      })
    });
  }
  function legend(items) { return `<div class="legend">${items.map(([c, l]) => `<span><i style="background:${c}"></i>${l}</span>`).join('')}</div>`; }
  const tooltipMoney = () => Object.assign(baseOptions().plugins.tooltip, { callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.raw)}` } });

  function projectRow(p, cols) {
    return `<tr class="clickable" data-go="#/project/${p.id}">${cols.map(c => `<td class="${c.cls || ''}">${c.render(p)}</td>`).join('')}</tr>`;
  }

  /* =====================================================================
     DASHBOARD
     ===================================================================== */
  function dashboard() {
    const total = PROJECTS.length;
    const st = countBy(PROJECTS, 'status');
    const budget = sum(PROJECTS, 'budget'), spent = sum(PROJECTS, 'spent');
    const a = attention();
    const upcoming = EVENTS.filter(e => e.date >= TODAY && e.date <= DB.addDays(TODAY, 21) && !e.done).slice(0, 7);
    const recentCh = CHARITY.slice(0, 5);

    view().innerHTML = `
      <div class="page-head">
        <div><h1>Сводная панель</h1><div class="sub">Мониторинг социальных проектов, благотворительной помощи и взаимодействия с ДЗО · данные на ${fdateLong(TODAY)}</div></div>
        <div class="page-actions">
          <button class="btn" id="btnReport">${icon('download')}Сводный отчёт</button>
          <a class="btn btn-primary" href="#/projects">${icon('list')}Реестр проектов</a>
        </div>
      </div>
      <div class="kpis">
        ${kpi({ label: 'Всего проектов', value: total, ico: 'folder', color: 'var(--navy-2)', foot: `в ${new Set(PROJECTS.map(p => p.region)).size} регионах · ${DZO.length} ДЗО`, link: '#/projects?reset' })}
        ${kpi({ label: 'В работе', value: st['В работе'], ico: 'clock', color: 'var(--st-work)', bar: st['В работе'] / total * 100, foot: `<span class="text-bad">${a.overdue.length} просрочено</span>`, link: '#/projects?status=В работе' })}
        ${kpi({ label: 'Завершено', value: st['Завершено'], ico: 'check', color: 'var(--st-done)', bar: st['Завершено'] / total * 100, foot: `${Math.round(st['Завершено'] / total * 100)}% портфеля`, link: '#/projects?status=Завершено' })}
        ${kpi({ label: 'На контроле', value: st['На контроле'], ico: 'eye', color: 'var(--st-ctrl)', bar: st['На контроле'] / total * 100, foot: 'приёмка и передача объектов', link: '#/projects?status=На контроле' })}
        ${kpi({ label: 'Общий бюджет', value: (budget / 1000).toFixed(2).replace('.', ','), unit: ' млрд ₸', ico: 'wallet', color: 'var(--sky)', bar: spent / budget * 100, foot: `освоено ${money(spent)} · ${Math.round(spent / budget * 100)}%`, link: '#/analytics' })}
      </div>

      <div class="cols-2 mb16">
        <div class="card"><div class="card-head"><h3>Распределение проектов по статусам</h3><span class="hint">${total} ${plural(total, 'проект', 'проекта', 'проектов')}</span></div>
          <div class="card-body"><div class="donut-wrap"><div class="chart-box"><canvas id="chStatus"></canvas><div class="donut-center"><b>${total}</b><span>проектов</span></div></div>
          <div id="stLegend"></div></div>
          <div class="divider"></div>
          <div class="row small text-2">${icon('alert')}<span>Уровень риска:</span>
            ${RISKS.map(r => `<span style="margin-left:6px">${riskBadge(r)} <b class="num">${PROJECTS.filter(p => p.risk === r && p.status !== 'Завершено').length}</b></span>`).join('')}
            <span class="text-muted">(активные проекты)</span></div>
          </div></div>
        <div class="card"><div class="card-head"><h3>Распределение проектов по регионам</h3><span class="hint">нажмите на столбец для фильтра</span></div>
          <div class="card-body"><div class="chart-box"><canvas id="chRegion"></canvas></div></div></div>
      </div>

      <div class="cols-2 mb16">
        <div class="card"><div class="card-head"><h3>Освоение бюджета по направлениям</h3><span class="hint">млн ₸</span></div>
          <div class="card-body">
            <div class="row" style="gap:24px;margin-bottom:12px">
              <div><div class="small text-muted">Бюджет</div><div class="fw6 num" style="font-size:18px">${money(budget)}</div></div>
              <div><div class="small text-muted">Освоено</div><div class="fw6 num" style="font-size:18px">${money(spent)}</div></div>
              <div><div class="small text-muted">Остаток</div><div class="fw6 num" style="font-size:18px">${money(budget - spent)}</div></div>
              <div><div class="small text-muted">Уровень освоения</div><div class="fw6 num" style="font-size:18px">${Math.round(spent / budget * 100)}%</div></div>
            </div>
            <div class="chart-box short"><canvas id="chBudget"></canvas></div>
            ${legend([[cssVar('--c1'), 'Освоено'], [cssVar('--c-rest'), 'Остаток бюджета']])}
          </div></div>
        <div class="card"><div class="card-head"><h3>Динамика реализации по месяцам, ${TODAY.getFullYear()}</h3><span class="hint">освоение, млн ₸</span></div>
          <div class="card-body"><div class="chart-box" style="height:292px"><canvas id="chMonthly"></canvas></div>
          ${legend([[cssVar('--c-plan'), 'План освоения'], [cssVar('--c1'), 'Факт освоения']])}</div></div>
      </div>

      <div class="card mb16">
        <div class="card-head"><h3>Требуют внимания</h3><span class="hint">${a.overdue.length + a.high.length + a.docs.length + a.commission.length} позиций</span></div>
        <div class="card-body flush"><div class="attn-grid" style="border-top:1px solid var(--border)">
          ${attnCol('Просроченные сроки', 'clock', 'b-bad', a.overdue, p => `<span class="bad">просрочка ${overdueDays(p)} дн.</span><span>${p.progress}%</span><span>${shortRegion(p.region)}</span>`)}
          ${attnCol('Высокий риск', 'flame', 'b-bad', a.high, p => `<span>${p.progress}% реализации</span><span>${p.dzoShort}</span><span>${p.risks.filter(r => r.status !== 'Устранён').length} откр. рисков</span>`)}
          ${attnCol('Отсутствуют документы', 'fileX', 'b-warn', a.docs, p => `<span>${esc(p.docsMissing)}</span>`)}
          ${attnCol('Требуют решения комиссии', 'gavel', 'b-info', a.commission, p => `<span>${esc(p.commission)}</span>`)}
        </div></div>
      </div>

      <div class="cols-2">
        <div class="card"><div class="card-head"><h3>Ближайшие контрольные события</h3><a class="link-btn" href="#/calendar">Календарь →</a></div>
          <div class="card-body"><div class="ev-list">${upcoming.map(evItem).join('') || '<div class="empty">Нет событий</div>'}</div></div></div>
        <div class="card"><div class="card-head"><h3>Последние обращения на благотворительность</h3><a class="link-btn" href="#/charity">Все обращения →</a></div>
          <div class="card-body flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>Организация</th><th class="r">Сумма</th><th>Статус</th></tr></thead><tbody>
          ${recentCh.map(c => `<tr class="clickable" data-ch="${c.id}"><td><div class="fw6">${esc(c.org)}</div><div class="t-sub">${c.id} · ${fdate(c.date)} · ${c.direction}</div></td><td class="r nowrap num">${money(c.amount)}</td><td>${statusBadge(c.status)}</td></tr>`).join('')}
          </tbody></table></div></div></div>
      </div>`;

    // charts
    const stItems = STATUSES.map(s => ({ label: s, value: st[s] || 0, color: statusColor(s) }));
    donut('chStatus', stItems);
    document.getElementById('stLegend').innerHTML = donutLegend(stItems, total);

    const byReg = countBy(PROJECTS, 'region');
    const regs = Object.keys(byReg).sort((x, y) => byReg[y] - byReg[x]);
    hbar('chRegion', regs.map(shortRegion), regs.map(r => byReg[r]), {
      onClick: (i) => { Object.assign(STATE.reg, blankReg(), { region: regs[i] }); go('#/projects'); }
    });

    const dirs = DIRECTIONS.map(dn => ({ d: dn, b: sum(PROJECTS.filter(p => p.direction === dn), 'budget'), s: sum(PROJECTS.filter(p => p.direction === dn), 'spent') })).sort((x, y) => y.b - x.b);
    makeChart('chBudget', {
      type: 'bar',
      data: {
        labels: dirs.map(x => x.d.replace('Поддержка уязвимых групп', 'Уязвимые группы').replace('Социальная инфраструктура', 'Соц. инфраструктура')),
        datasets: [
          { label: 'Освоено', data: dirs.map(x => Math.round(x.s * 10) / 10), backgroundColor: cssVar('--c1'), ...barStyle, maxBarThickness: 16, borderSkipped: false, borderRadius: 3, borderColor: cssVar('--surface'), borderWidth: { right: 2 } },
          { label: 'Остаток', data: dirs.map(x => Math.round((x.b - x.s) * 10) / 10), backgroundColor: cssVar('--c-rest'), ...barStyle, maxBarThickness: 16, borderSkipped: false, borderRadius: 3 }
        ]
      },
      options: Object.assign(baseOptions(), {
        indexAxis: 'y', interaction: { mode: 'index', axis: 'y', intersect: false },
        scales: { x: { stacked: true, grid: { color: cssVar('--grid') }, border: { display: false }, ticks: { font: { size: 11 } } }, y: { stacked: true, grid: { display: false }, ticks: { font: { size: 11 } } } },
        plugins: Object.assign(baseOptions().plugins, { tooltip: Object.assign(tooltipMoney(), { callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.raw)}`, footer: (items) => { const x = dirs[items[0].dataIndex]; return `Освоение: ${Math.round(x.s / x.b * 100)}% из ${money(x.b)}`; } } }) })
      })
    });

    const y = TODAY.getFullYear();
    const m = monthly(PROJECTS, y * 12, 12);
    makeChart('chMonthly', {
      type: 'bar',
      data: {
        labels: MONTHS,
        datasets: [
          { label: 'План', data: m.plan, backgroundColor: cssVar('--c-plan'), ...barStyle, maxBarThickness: 14 },
          { label: 'Факт', data: m.fact, backgroundColor: cssVar('--c1'), ...barStyle, maxBarThickness: 14 }
        ]
      },
      options: Object.assign(baseOptions(), { interaction: { mode: 'index', intersect: false }, scales: axes(), plugins: Object.assign(baseOptions().plugins, { tooltip: tooltipMoney() }) })
    });

    document.getElementById('btnReport').onclick = () => {
      downloadCSV(`KMG_Social_Hub_svodka_${fdate(TODAY)}.csv`, ['№', 'Код', 'Проект', 'Регион', 'ДЗО', 'Направление', 'Бюджет, млн ₸', 'Освоено, млн ₸', '% реализации', 'Плановое завершение', 'Статус', 'Риск'],
