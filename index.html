  <script>
/* Лимит на благотворительность, Фонд генеральных директоров (ФГД), источники финансирования */
(function () {
  'use strict';
  const { PROJECTS, CHARITY, DZO, DZO_BY_ID, FUNDING, TODAY, PRE_ACCEPT } = DB;
  const { icon, money, esc, fdate, plural, cssVar, makeChart, baseOptions, axes, barStyle, openModal, closeModal, toast, toastErr, act, destroyCharts, destroyMaps } = UI;
  const FIN = () => DB.FIN;
  const sum = (a, f) => a.reduce((s, x) => s + (typeof f === 'function' ? f(x) : x[f]), 0);
  const mi = (dt) => dt.getFullYear() * 12 + dt.getMonth();
  const curY = () => new Date().getFullYear();
  const within = (p) => p.funding === 'limit' || p.funding === 'ceo';
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const ST = (label, cls, hint) => ({ label, cls, hint: hint || '' });

  // факт освоения проекта в диапазоне месяцев [a..b] (равномерно по месяцам) — та же модель, что DB.projYear
  function pfact(p, a, b) {
    if (PRE_ACCEPT.includes(p.wf) || !(p.spent > 0)) return 0;
    const s = mi(p.start), e = mi(p.planEnd);
    const fe = DB.implStatus(p.wf) === 'Завершено' ? e : Math.max(s, mi(TODAY));
    const ov = Math.max(0, Math.min(b, fe) - Math.max(a, s) + 1);
    return p.spent * ov / (fe - s + 1);
  }
  const chYear = (Y, f = () => true) => CHARITY.filter(c => c.date.getFullYear() === Y && c.decision === 'Одобрено' && f(c));
  const expectedShare = (Y) => {
    const now = new Date();
    if (Y < now.getFullYear()) return 1;
    if (Y > now.getFullYear()) return 0;
    const start = new Date(Y, 0, 1), end = new Date(Y + 1, 0, 1);
    return (now - start) / (end - start);
  };

  /* ---------- освоение лимита на благотворительность ---------- */
  function limitStatus(Y) {
    const lim = FIN().limits[Y] ? FIN().limits[Y].amount : 0;
    const L = PROJECTS;
    const yp = (p) => DB.projYear(p, Y);
    const ceoP = L.filter(p => p.funding === 'ceo'), limP = L.filter(p => p.funding === 'limit'), outP = L.filter(p => p.funding === 'out');
    const ch = chYear(Y);
    const r = {
      Y, limit: lim,
      ceoPlan: sum(ceoP, p => yp(p).plan) + sum(ch.filter(c => c.ceo), 'amount'),
      ceoFact: sum(ceoP, p => yp(p).fact) + sum(ch.filter(c => c.ceo && c.stage >= 7), 'amount'),
      projPlan: sum(limP, p => yp(p).plan), projFact: sum(limP, p => yp(p).fact),
      chPlan: sum(ch.filter(c => !c.ceo), 'amount'), chFact: sum(ch.filter(c => !c.ceo && c.stage >= 7), 'amount'),
      outPlan: sum(outP, p => yp(p).plan), outFact: sum(outP, p => yp(p).fact),
      ceoCount: ceoP.length, limCount: limP.length, outCount: outP.length
    };
    r.committed = r.ceoPlan + r.projPlan + r.chPlan;
    r.fact = r.ceoFact + r.projFact + r.chFact;
    r.remaining = lim - r.fact;
    r.pct = lim ? r.fact / lim : 0;
    r.commitPct = lim ? r.committed / lim : 0;
    r.expected = expectedShare(Y);
    const now = curY();
    if (!lim) r.status = ST('Лимит не установлен', 'b-gray');
    else if (Y > now) r.status = ST('Запланирован', 'b-info', 'лимит на будущий год утверждён');
    else if (r.pct > 1.0001) r.status = ST('Лимит превышен', 'b-bad', `превышение на ${money(r.fact - lim)}`);
    else if (Y < now) r.status = r.pct >= 0.95 ? ST('Исполнен', 'b-ok', `освоено ${pct(r.fact, lim)}%`) : ST('Не освоен полностью', 'b-warn', `неосвоенный остаток ${money(lim - r.fact)}`);
    else if (r.commitPct > 1.0001) r.status = ST('Риск превышения', 'b-bad', `обязательства превышают лимит на ${money(r.committed - lim)}`);
    else if (r.pct < r.expected - 0.15) r.status = ST('Отставание от графика', 'b-warn', `освоено ${pct(r.fact, lim)}% при ожидаемых ${Math.round(r.expected * 100)}%`);
    else r.status = ST('В графике', 'b-ok', `освоено ${pct(r.fact, lim)}% при ожидаемых ${Math.round(r.expected * 100)}%`);
    return r;
  }

  /* ---------- ФГД по ДЗО ---------- */
  function ceoStatus(alloc, plan, fact, Y) {
    if (!alloc && (fact > 0 || plan > 0)) return ST('Без выделенного лимита', 'b-bad', 'расходы ФГД без решения КМГ');
    if (!alloc) return ST('Лимит не выделен', 'b-gray');
    if (fact > alloc + 0.001) return ST('Превышен', 'b-bad', `превышение на ${money(fact - alloc)}`);
    if (fact === 0 && plan === 0) return ST('Не использует', 'b-gray', 'нет проектов и обращений за счёт ФГД');
    if (fact >= alloc * 0.95) return ST('Освоен полностью', 'b-ok');
    if (plan > alloc + 0.001) return ST('Риск превышения', 'b-warn', `запланировано ${money(plan)} при лимите ${money(alloc)}`);
    if (Y === curY() && fact < alloc * (expectedShare(Y) - 0.35)) return ST('Слабо использует', 'b-warn', `использовано ${pct(fact, alloc)}%`);
    return ST('Использует', 'b-info');
  }
  function ceoRows(Y) {
    const cfg = FIN().ceo[Y] || { fund: 0, alloc: {} };
    const ids = [...new Set([...Object.keys(cfg.alloc), ...PROJECTS.filter(p => p.funding === 'ceo').map(p => p.dzo)])].filter(z => Core.hasDzo(z) && DZO_BY_ID[z]);
    return ids.map(z => {
      const pp = PROJECTS.filter(p => p.funding === 'ceo' && p.dzo === z && (DB.projYear(p, Y).plan > 0 || DB.projYear(p, Y).fact > 0));
      const cc = chYear(Y, c => c.ceo && c.dzo === z);
      const plan = sum(pp, p => DB.projYear(p, Y).plan) + sum(cc, 'amount');
      const fact = sum(pp, p => DB.projYear(p, Y).fact) + sum(cc.filter(c => c.stage >= 7), 'amount');
      const alloc = cfg.alloc[z] || 0;
      return { z: DZO_BY_ID[z], alloc, plan, fact, remaining: alloc - fact, pct: alloc ? fact / alloc : 0, status: ceoStatus(alloc, plan, fact, Y), projects: pp, appeals: cc };
    }).filter(r => r.alloc > 0 || r.plan > 0 || r.fact > 0).sort((a, b) => b.alloc - a.alloc || b.fact - a.fact);
  }
  function ceoSummary(Y) {
    const rows = ceoRows(Y);
    const cfg = FIN().ceo[Y] || { fund: 0, alloc: {} };
    return {
      fund: cfg.fund, allocated: sum(Object.values(cfg.alloc), x => x), used: sum(rows, 'fact'), rows,
      notUsing: rows.filter(r => r.status.label === 'Не использует'), exceeded: rows.filter(r => r.status.label === 'Превышен' || r.status.label === 'Без выделенного лимита'),
      using: rows.filter(r => r.fact > 0 && r.alloc > 0 && r.fact <= r.alloc + 0.001)
    };
  }
  const years = () => Object.keys(FIN().limits).map(Number).sort();

  /* ---------- изменения (КМГ / ADMIN) ---------- */
  function setLimit(Y, amount, note) {
    if (!Core.can('finance')) throw new Core.AccessError('Лимит на благотворительность устанавливает КМГ');
    if (!(amount > 0)) throw new Error('Укажите сумму лимита больше нуля');
    const old = FIN().limits[Y];
    FIN().limits[Y] = { amount, approvedAt: new Date(), approvedBy: Core.shortName(Core.user), note: note || (old && old.note) || '' };
    Core.audit('Изменен лимит на благотворительность', 'Лимит', null, `${Y}: ${old ? money(old.amount) : '—'}`, money(amount), null);
    Core.notify('KMG', null, 'limit', `Лимит на благотворительность на ${Y} год: ${money(amount)}`);
  }
  function setCeo(Y, fund, alloc) {
    if (!Core.can('finance')) throw new Core.AccessError('Распределение ФГД выполняет КМГ');
    const allocated = sum(Object.values(alloc), x => x);
    if (allocated > fund + 0.001) throw new Error(`Распределено по ДЗО ${money(allocated)} — больше фонда ${money(fund)}`);
    const lim = FIN().limits[Y] ? FIN().limits[Y].amount : 0;
    if (fund > lim) throw new Error(`Фонд генеральных директоров (${money(fund)}) не может превышать лимит на благотворительность (${money(lim)})`);
    const old = FIN().ceo[Y] || { fund: 0, alloc: {} };
    if (old.fund !== fund) Core.audit('Изменен фонд генеральных директоров', 'ФГД', null, `${Y}: ${money(old.fund)}`, money(fund), null);
    const all = new Set([...Object.keys(old.alloc), ...Object.keys(alloc)]);
    all.forEach(z => {
      const a = old.alloc[z] || 0, b = alloc[z] || 0;
      if (Math.abs(a - b) > 0.001) {
        Core.audit('Изменен лимит ФГД для ДЗО', 'ФГД', null, `${Y}, ${DZO_BY_ID[z].short}: ${money(a)}`, money(b), z);
        const n = DB.NOTIFS.reduce((m, x) => Math.max(m, x.id), 0) + 1;
        DB.NOTIFS.unshift({ id: n, at: new Date(), audience: 'DZO', projectId: null, dzo: z, type: 'limit', text: `КМГ ${b ? 'установил' : 'отменил'} лимит ФГД на ${Y} год: ${money(b)}`, readBy: [Core.user.id] });
      }
    });
    FIN().ceo[Y] = { fund, alloc: Object.fromEntries(Object.entries(alloc).filter(([, v]) => v > 0)) };
    Core.persist();
  }

  /* ---------- страница ---------- */
  const state = { Y: null };
  function page(params) {
    const u = Core.user;
    const ys = years();
    if (!state.Y || !ys.includes(state.Y)) state.Y = ys.includes(curY()) ? curY() : ys[ys.length - 1];
    if (params && params.get('y')) state.Y = +params.get('y');
    const Y = state.Y;
    const full = u.access === 'ALL';
    const ls = limitStatus(Y);
    const cs = ceoSummary(Y);
    const K = PH.kpi;
    const canEdit = Core.can('finance');
    const fundedY = PROJECTS.filter(p => DB.projYear(p, Y).plan > 0 || DB.projYear(p, Y).fact > 0);
    const byF = Object.keys(FUNDING).map(k => ({ k, n: fundedY.filter(p => p.funding === k).length, b: sum(fundedY.filter(p => p.funding === k), p => DB.projYear(p, Y).plan) }));
    document.getElementById('view').innerHTML = `
      <div class="page-head"><div><h1>Лимит на благотворительность и ФГД</h1><div class="sub">Освоение годового лимита, Фонд генеральных директоров и источники финансирования проектов${full ? '' : ' · в пределах доступных ДЗО'}</div></div>
        <div class="page-actions"><div class="seg" id="finY">${ys.map(y => `<button data-y="${y}" class="${y === Y ? 'active' : ''}">${y}</button>`).join('')}</div>
        ${canEdit ? `<button class="btn" id="finLim">${icon('wallet')}Лимит ${Y}</button><button class="btn btn-primary" id="finCeo">${icon('users')}Распределить ФГД</button>` : ''}</div></div>

      ${full ? `<div class="kpis k6">
        ${K({ label: `Лимит на благотворительность ${Y}`, value: money(ls.limit).replace(/ (млн|млрд) ₸/, ''), unit: ls.limit >= 1000 ? ' млрд ₸' : ' млн ₸', ico: 'wallet', color: 'var(--navy-2)', foot: FIN().limits[Y] ? `утверждён ${fdate(FIN().limits[Y].approvedAt)} · ${esc(FIN().limits[Y].approvedBy)}` : '' })}
        ${K({ label: 'Распределено (обязательства)', value: money(ls.committed).replace(' млн ₸', ''), unit: ' млн ₸', ico: 'file', color: 'var(--sky)', bar: Math.min(100, ls.commitPct * 100), foot: `${Math.round(ls.commitPct * 100)}% лимита` })}
        ${K({ label: 'Освоено', value: money(ls.fact).replace(' млн ₸', ''), unit: ' млн ₸', ico: 'trend', color: 'var(--st-done)', bar: Math.min(100, ls.pct * 100), foot: `${Math.round(ls.pct * 100)}% · ожидаемо ${Math.round(ls.expected * 100)}%` })}
        ${K({ label: 'Остаток лимита', value: money(Math.abs(ls.remaining)).replace(' млн ₸', ''), unit: ' млн ₸', ico: 'coins', color: ls.remaining < 0 ? 'var(--bad)' : 'var(--c3)', foot: ls.remaining < 0 ? '<span class="text-bad">перерасход</span>' : 'не освоено' })}
        ${K({ label: 'Статус освоения', value: `<span class="badge ${ls.status.cls}" style="font-size:14px;padding:5px 12px">${ls.status.label}</span>`, ico: 'target', color: 'var(--st-ctrl)', foot: esc(ls.status.hint) })}
        ${K({ label: 'Вне лимита (справочно)', value: money(ls.outPlan).replace(' млн ₸', ''), unit: ' млн ₸', ico: 'folder', color: 'var(--muted)', foot: `${ls.outCount} проектов · освоено ${money(ls.outFact)}` })}
      </div>` : `<div class="notice info mb16">${icon('shield')}<span>Общий лимит на благотворительность устанавливается и контролируется КМГ. Ниже показаны лимит ФГД и использование средств по доступным вам ДЗО: <b>${esc(Core.accessLabel(u))}</b>.</span></div>`}

      ${full ? `<div class="cols-2 mb16">
        <div class="card"><div class="card-head"><h3>Структура использования лимита ${Y}</h3><span class="hint">освоено / распределено, млн ₸</span></div><div class="card-body">
          <div class="big-progress" style="height:18px;display:flex;overflow:hidden">${[[ls.ceoFact, '--c4'], [ls.projFact, '--c1'], [ls.chFact, '--c5']].map(([v, c]) => `<span style="width:${ls.limit ? Math.min(100, v / ls.limit * 100) : 0}%;background:var(${c});border-radius:0"></span>`).join('')}</div>
          <div class="row small text-muted" style="justify-content:space-between;margin-top:6px"><span>0</span><span>ожидаемо к дате: ${money(ls.limit * ls.expected)}</span><span>${money(ls.limit)}</span></div>
          <div class="table-wrap mt16"><table class="tbl"><thead><tr><th>Направление использования</th><th class="r">Распределено</th><th class="r">Освоено</th><th class="r">% лимита</th></tr></thead><tbody>
            <tr><td><span class="legend"><span><i style="background:var(--c4)"></i>Фонд генеральных директоров</span></span></td><td class="r num">${money(ls.ceoPlan)}</td><td class="r num">${money(ls.ceoFact)}</td><td class="r num">${pct(ls.ceoFact, ls.limit)}%</td></tr>
            <tr><td><span class="legend"><span><i style="background:var(--c1)"></i>Проекты в рамках лимита</span></span></td><td class="r num">${money(ls.projPlan)}</td><td class="r num">${money(ls.projFact)}</td><td class="r num">${pct(ls.projFact, ls.limit)}%</td></tr>
            <tr><td><span class="legend"><span><i style="background:var(--c5)"></i>Благотворительные обращения</span></span></td><td class="r num">${money(ls.chPlan)}</td><td class="r num">${money(ls.chFact)}</td><td class="r num">${pct(ls.chFact, ls.limit)}%</td></tr>
            <tr><td class="fw6">Итого в рамках лимита</td><td class="r num fw6">${money(ls.committed)}</td><td class="r num fw6">${money(ls.fact)}</td><td class="r num fw6">${pct(ls.fact, ls.limit)}%</td></tr>
          </tbody></table></div></div></div>
        <div class="card"><div class="card-head"><h3>Освоение лимита по месяцам, ${Y}</h3><span class="hint">нарастающим итогом, млн ₸</span></div><div class="card-body"><div class="chart-box"><canvas id="finMon"></canvas></div>
          ${PH.legend([[cssVar('--c-plan'), 'Равномерный график освоения лимита'], [cssVar('--c1'), 'Фактическое освоение'], [cssVar('--bad'), 'Лимит']])}</div></div>
      </div>` : ''}

      <div class="card mb16">
        <div class="card-head"><h3>Фонд генеральных директоров ${Y}</h3><span class="hint">в рамках лимита на благотворительность · лимиты ДЗО определяет КМГ</span></div>
        <div class="card-body" style="padding-bottom:8px"><div class="row" style="gap:22px">
          ${full ? `<div><div class="small text-muted">Фонд ФГД</div><div class="fw6 num" style="font-size:18px">${money(cs.fund)}</div></div><div><div class="small text-muted">Распределено по ДЗО</div><div class="fw6 num" style="font-size:18px">${money(cs.allocated)}</div></div>` : ''}
          <div><div class="small text-muted">Использовано</div><div class="fw6 num" style="font-size:18px">${money(cs.used)}</div></div>
          <span class="badge b-info">Используют: ${cs.using.length}</span><span class="badge b-gray">Не используют: ${cs.notUsing.length}</span><span class="badge b-bad">Превысили: ${cs.exceeded.length}</span>
        </div></div>
        <div class="table-wrap"><table class="tbl"><thead><tr><th>ДЗО</th><th class="r">Лимит ФГД</th><th class="r">Запланировано</th><th class="r">Использовано</th><th>% использования</th><th class="r">Остаток</th><th>Статус</th><th class="r">Проектов / обращений</th></tr></thead><tbody>
          ${cs.rows.map(r => `<tr class="clickable" data-ceo="${r.z.id}"><td><div class="fw6">${r.z.short}</div><div class="t-sub">${esc(r.z.name)}</div></td>
            <td class="r num">${r.alloc ? money(r.alloc) : '—'}</td><td class="r num">${money(r.plan)}</td><td class="r num fw6">${money(r.fact)}</td>
            <td style="min-width:150px">${r.alloc ? `<div class="prog"><div class="prog-bar"><span class="${r.pct > 1 ? 'low' : r.pct >= 0.95 ? 'full' : ''}" style="width:${Math.min(100, r.pct * 100)}%"></span></div><b>${Math.round(r.pct * 100)}%</b></div>` : '—'}</td>
            <td class="r num ${r.remaining < 0 ? 'overdue' : ''}">${r.alloc ? money(r.remaining) : '—'}</td><td><span class="badge ${r.status.cls}" title="${esc(r.status.hint)}">${r.status.label}</span></td>
            <td class="r num">${r.projects.length} / ${r.appeals.length}</td></tr>`).join('') || '<tr><td colspan="8"><div class="empty">Лимиты ФГД на этот год не распределены</div></td></tr>'}
        </tbody></table></div>
      </div>

      <div class="cols-2">
        ${full ? `<div class="card"><div class="card-head"><h3>Лимиты на благотворительность по годам</h3></div><div class="card-body flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>Год</th><th class="r">Лимит</th><th class="r">Освоено</th><th>%</th><th>Статус</th><th>Основание</th></tr></thead><tbody>
          ${ys.map(y => { const s = limitStatus(y); return `<tr class="clickable" data-yy="${y}"><td class="fw6">${y}</td><td class="r num">${money(s.limit)}</td><td class="r num">${money(s.fact)}</td><td style="min-width:120px">${PH ? UI.progressBar(Math.round(s.pct * 100)) : ''}</td><td><span class="badge ${s.status.cls}">${s.status.label}</span></td><td class="small text-muted">${esc(FIN().limits[y].note || '')}</td></tr>`; }).join('')}
        </tbody></table></div></div></div>` : ''}
        <div class="card"><div class="card-head"><h3>Проекты по источникам финансирования, ${Y}</h3><span class="hint">нажмите для перехода в реестр</span></div><div class="card-body">
          ${byF.map(x => `<div class="bl-row" style="cursor:pointer;margin-bottom:14px" data-fund="${x.k}"><div class="bl-top"><span><span class="badge plain ${FUNDING[x.k].cls}">${FUNDING[x.k].short}</span> ${FUNDING[x.k].label}</span><span>${x.n} · ${money(x.b)}</span></div><div class="bl-track"><span style="width:${fundedY.length ? x.n / fundedY.length * 100 : 0}%;background:var(${x.k === 'ceo' ? '--c4' : x.k === 'limit' ? '--c1' : '--c-plan'})"></span></div></div>`).join('')}
          <div class="lock-note">${icon('alert')}Лимит на благотворительность включает Фонд генеральных директоров, проекты «в рамках лимита» и благотворительные обращения. Проекты «вне лимита» финансируются из иных источников (меморандумы, КСО).</div>
        </div></div>
      </div>`;

    document.querySelectorAll('#finY [data-y]').forEach(b => b.onclick = () => { state.Y = +b.dataset.y; destroyCharts(); page(); });
    document.querySelectorAll('[data-yy]').forEach(b => b.onclick = () => { state.Y = +b.dataset.yy; destroyCharts(); page(); window.scrollTo(0, 0); });
    document.querySelectorAll('[data-fund]').forEach(b => b.onclick = () => { location.hash = '#/projects?funding=' + b.dataset.fund; });
    document.querySelectorAll('[data-ceo]').forEach(tr => tr.onclick = () => ceoDetail(Y, tr.dataset.ceo));
    const lb = document.getElementById('finLim'); if (lb) lb.onclick = () => limitForm(Y);
    const cb = document.getElementById('finCeo'); if (cb) cb.onclick = () => ceoForm(Y);
    if (full) monthChart(Y, ls);
  }
  function monthChart(Y, ls) {
    const plan = [], fact = [], lim = [];
    const nowI = mi(new Date());
    for (let m = 0; m < 12; m++) {
      const endI = Y * 12 + m;
      plan.push(Math.round(ls.limit * (m + 1) / 12 * 10) / 10);
      lim.push(ls.limit);
      if (endI > nowI) { fact.push(null); continue; }
      const f = sum(PROJECTS.filter(within), p => pfact(p, Y * 12, endI)) + sum(chYear(Y, c => c.stage >= 7 && c.date <= new Date(Y, m + 1, 0)), 'amount');
      fact.push(Math.round(f * 10) / 10);
    }
    makeChart('finMon', {
      type: 'line', data: { labels: PH.MONTHS, datasets: [
        { label: 'График', data: plan, borderColor: cssVar('--c-plan'), borderDash: [5, 4], borderWidth: 2, pointRadius: 0 },
        { label: 'Факт', data: fact, borderColor: cssVar('--c1'), backgroundColor: cssVar('--c1') + '1f', fill: true, borderWidth: 2, pointRadius: 3, pointBackgroundColor: cssVar('--c1'), tension: .2 },
        { label: 'Лимит', data: lim, borderColor: cssVar('--bad'), borderWidth: 1.5, pointRadius: 0, borderDash: [2, 3] }] },
      options: Object.assign(baseOptions(), { interaction: { mode: 'index', intersect: false }, scales: axes(), plugins: Object.assign(baseOptions().plugins, { tooltip: PH.tooltipMoney() }) })
    });
  }
  function ceoDetail(Y, z) {
    const r = ceoRows(Y).find(x => x.z.id === z); if (!r) return;
    openModal({ title: `ФГД ${Y}: ${esc(r.z.name)}`, sub: `Лимит ${r.alloc ? money(r.alloc) : 'не выделен'} · использовано ${money(r.fact)} · ${r.status.label}`, width: 860, body: `
      <div class="section-title">Проекты за счёт ФГД</div>
      ${r.projects.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Проект</th><th class="r">План ${Y}</th><th class="r">Освоено ${Y}</th><th>Статус</th></tr></thead><tbody>${r.projects.map(p => `<tr class="clickable" data-go="#/project/${p.id}"><td class="t-name"><div>${esc(p.name)}</div><div class="t-sub">${p.code}</div></td><td class="r num">${money(DB.projYear(p, Y).plan)}</td><td class="r num">${money(DB.projYear(p, Y).fact)}</td><td>${UI.wfBadge(p.wf)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="text-muted small">Нет проектов</div>'}
      <div class="section-title">Благотворительные обращения за счёт ФГД</div>
      ${r.appeals.length ? `<div class="table-wrap"><table class="tbl"><thead><tr><th>Обращение</th><th class="r">Сумма</th><th>Статус</th></tr></thead><tbody>${r.appeals.map(c => `<tr><td><div class="fw6">${esc(c.org)}</div><div class="t-sub">${c.id} · ${fdate(c.date)}</div></td><td class="r num">${money(c.amount)}</td><td>${UI.statusBadge(c.status)}</td></tr>`).join('')}</tbody></table></div>` : '<div class="text-muted small">Нет обращений</div>'}`,
      foot: `<button class="btn" data-close>Закрыть</button>` });
    PH.bindGo(document.getElementById('modalRoot'));
  }
  function limitForm(Y) {
    const cur = FIN().limits[Y];
    openModal({ title: `Лимит на благотворительность на ${Y} год`, width: 520, body: `<div class="form-grid">
      <div class="field"><label>Сумма лимита, млн ₸</label><input class="input num" type="number" step="10" min="0" id="lmA" value="${cur ? cur.amount : ''}"></div>
      <div class="field"><label>Основание</label><input class="input" id="lmN" value="${esc(cur ? cur.note : '')}" placeholder="Протокол Правления №…"></div></div>
      <div class="lock-note">${icon('shield')}Изменение фиксируется в системном журнале и направляется уведомлением пользователям КМГ.</div>`,
      foot: `<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="lmS">Сохранить</button>` });
    document.getElementById('lmS').onclick = () => { if (act(() => setLimit(Y, +document.getElementById('lmA').value, document.getElementById('lmN').value.trim()), 'Лимит сохранён')) { closeModal(); destroyCharts(); page(); } };
  }
  function ceoForm(Y) {
    const cfg = FIN().ceo[Y] || { fund: 0, alloc: {} };
    const rows = ceoRows(Y);
    openModal({ title: `Распределение Фонда генеральных директоров, ${Y}`, sub: `Лимит на благотворительность ${money(FIN().limits[Y] ? FIN().limits[Y].amount : 0)} · ФГД входит в лимит`, width: 760, body: `
      <div class="field" style="max-width:260px"><label>Общий фонд ФГД, млн ₸</label><input class="input num" type="number" step="1" min="0" id="cfF" value="${cfg.fund}"></div>
      <div class="table-wrap mt16"><table class="tbl"><thead><tr><th>ДЗО</th><th class="r">Использовано ${Y}</th><th class="r">Запланировано</th><th style="width:170px">Лимит ФГД, млн ₸</th></tr></thead><tbody>
        ${DZO.map(z => { const r = rows.find(x => x.z.id === z.id); return `<tr><td><div class="fw6">${z.short}</div><div class="t-sub">${esc(z.name)}</div></td><td class="r num">${money(r ? r.fact : 0)}</td><td class="r num">${money(r ? r.plan : 0)}</td><td><input class="input num" type="number" min="0" step="0.5" data-al="${z.id}" value="${cfg.alloc[z.id] || ''}" placeholder="0"></td></tr>`; }).join('')}
      </tbody></table></div>
      <div class="row mt16" style="justify-content:space-between"><span class="small text-2" id="cfSum"></span><button class="btn btn-sm" id="cfAuto">${icon('refresh')}Предложить по плану использования</button></div>`,
      foot: `<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="cfS">Утвердить распределение</button>` });
    const upd = () => {
      const s = sum([...document.querySelectorAll('[data-al]')], i => +i.value || 0), f = +document.getElementById('cfF').value || 0;
      document.getElementById('cfSum').innerHTML = `Распределено: <b>${money(s)}</b> из ${money(f)} · ${s > f ? '<span class="text-bad">превышает фонд</span>' : `нераспределено ${money(f - s)}`}`;
    };
    document.querySelectorAll('[data-al], #cfF').forEach(i => i.oninput = upd); upd();
    document.getElementById('cfAuto').onclick = () => { document.querySelectorAll('[data-al]').forEach(i => { const r = rows.find(x => x.z.id === i.dataset.al); if (r && r.plan) i.value = Math.ceil(r.plan * 1.15); }); upd(); };
    document.getElementById('cfS').onclick = () => {
      const alloc = {}; document.querySelectorAll('[data-al]').forEach(i => { if (+i.value > 0) alloc[i.dataset.al] = +i.value; });
      if (act(() => setCeo(Y, +document.getElementById('cfF').value || 0, alloc), 'Распределение ФГД утверждено, ДЗО получат уведомления')) { closeModal(); destroyCharts(); page(); window.App && App.refreshChrome(); }
    };
  }

  /* ---------- виджет для Dashboard ---------- */
  function widget() {
    const u = Core.user, Y = curY();
    if (!DB.FIN.limits[Y]) return '';
    const cs = ceoSummary(Y);
    let left;
    if (u.access === 'ALL') {
      const ls = limitStatus(Y);
      left = `<div class="card"><div class="card-head"><h3>Лимит на благотворительность ${Y}</h3><a class="link-btn" href="#/finance">Подробнее →</a></div><div class="card-body">
        <div class="row" style="justify-content:space-between"><div><div class="small text-muted">Освоено из ${money(ls.limit)}</div><div class="fw6 num" style="font-size:22px">${money(ls.fact)} <span class="small text-2">· ${Math.round(ls.pct * 100)}%</span></div></div><span class="badge ${ls.status.cls}">${ls.status.label}</span></div>
        <div class="big-progress mt16"><span style="width:${Math.min(100, ls.pct * 100)}%"></span><i class="marker" style="left:${Math.min(100, ls.expected * 100)}%" title="Ожидаемое освоение на текущую дату"></i></div>
        <div class="row small text-muted mt16" style="justify-content:space-between"><span>Распределено: ${money(ls.committed)} (${Math.round(ls.commitPct * 100)}%)</span><span>Остаток: ${money(ls.remaining)}</span></div></div></div>`;
    } else {
      const byF = Object.keys(FUNDING).map(k => ({ k, n: PROJECTS.filter(p => p.funding === k).length, b: sum(PROJECTS.filter(p => p.funding === k), 'budget') }));
      left = `<div class="card"><div class="card-head"><h3>Источники финансирования</h3><a class="link-btn" href="#/finance">Подробнее →</a></div><div class="card-body">
        ${byF.map(x => `<div class="bl-row" style="margin-bottom:12px"><div class="bl-top"><span>${FUNDING[x.k].label}</span><span>${x.n} · ${money(x.b)}</span></div><div class="bl-track"><span style="width:${PROJECTS.length ? x.n / PROJECTS.length * 100 : 0}%;background:var(${x.k === 'ceo' ? '--c4' : x.k === 'limit' ? '--c1' : '--c-plan'})"></span></div></div>`).join('')}</div></div>`;
    }
    const rows = cs.rows.slice(0, 6);
    const right = `<div class="card"><div class="card-head"><h3>Фонд генеральных директоров ${Y}</h3><div class="row"><span class="badge b-gray">не используют: ${cs.notUsing.length}</span><span class="badge b-bad">превысили: ${cs.exceeded.length}</span></div></div><div class="card-body">
      ${rows.map(r => `<div class="bl-row" style="margin-bottom:12px"><div class="bl-top"><span><b>${r.z.short}</b> <span class="badge ${r.status.cls}" style="margin-left:6px">${r.status.label}</span></span><span>${money(r.fact)} / ${r.alloc ? money(r.alloc) : '—'}</span></div><div class="bl-track"><span style="width:${Math.min(100, r.pct * 100)}%;background:var(${r.pct > 1 || !r.alloc ? '--bad' : '--c4'})"></span></div></div>`).join('') || '<div class="empty">Лимит ФГД не выделен</div>'}
      </div></div>`;
    return `<div class="cols-2 mb16">${left}${right}</div>`;
  }

  window.Finance = { limitStatus, ceoRows, ceoSummary, years, setLimit, setCeo, page, widget, curY };
})();

</script>
  <script>
/* AI-аналитика: выводы по проекту, ход реализации, прогноз и пути решения проблем */
(function () {
  'use strict';
  const { TODAY, PRE_ACCEPT } = DB;
  const { money, fdate, daysBetween, plural } = UI;
  const DAY = 86400000;

  // База знаний: признак проблемы → меры по её решению
  const PLAYBOOK = [
    { re: /отставани|график/i, cat: 'Отставание от графика', actions: ['Запросить у подрядчика график ликвидации отставания с разбивкой по неделям и утвердить его на совещании', 'Потребовать увеличения численности рабочих или организации второй смены', 'Установить еженедельный выездной контроль технадзора и отчёт в системе'] },
    { re: /удорожани|смет|превышени/i, cat: 'Удорожание и риск превышения сметы', actions: ['Зафиксировать цены на основные материалы дополнительным соглашением с подрядчиком', 'Провести ценовой мониторинг альтернативных поставщиков', 'При подтверждении удорожания — вынести корректировку бюджета на Комиссию с расчётом'] },
    { re: /постав/i, cat: 'Задержка поставок', actions: ['Согласовать альтернативного поставщика или аналог оборудования', 'Перестроить график: выполнять независимые работы, не дожидаясь поставки', 'Включить в договор поставки штрафные санкции за просрочку'] },
    { re: /экспертиз|ПСД/i, cat: 'Проектно-сметная документация', actions: ['Направить ПСД на повторную экспертизу в приоритетном порядке', 'Назначить ответственного за снятие замечаний экспертизы с еженедельным отчётом', 'Параллельно выполнять работы, не затронутые корректировкой'] },
    { re: /акт|документ|отчётност|отчет/i, cat: 'Документы и отчётность', actions: ['Запросить недостающие документы у ДЗО / подрядчика со сроком 5 рабочих дней', 'Приостановить промежуточные платежи до предоставления подтверждающих документов', 'Загрузить документы в карточку проекта для контроля КМГ'] },
    { re: /баланс|передач/i, cat: 'Передача объекта', actions: ['Провести рабочую встречу с акиматом по порядку передачи объекта в коммунальную собственность', 'Заранее подготовить пакет документов для передачи (акты, техпаспорт, ПСД)'] },
    { re: /ввод|приёмк|приемк/i, cat: 'Ввод объекта', actions: ['Заблаговременно сформировать рабочую комиссию по приёмке', 'Составить чек-лист ввода объекта и распределить ответственных'] },
    { re: /технадзор|качеств|бетон/i, cat: 'Качество работ', actions: ['Устранить замечания технадзора до начала следующего этапа работ', 'Провести лабораторные испытания материалов и конструкций', 'Зафиксировать устранение замечаний актом'] },
    { re: /земельн|участ/i, cat: 'Земельный участок', actions: ['Эскалировать вопрос оформления участка на уровень заместителя акима', 'Подготовить альтернативный вариант размещения объекта'] },
    { re: /численност|рабочих/i, cat: 'Нехватка ресурсов подрядчика', actions: ['Потребовать от подрядчика довести численность до нормативной', 'Рассмотреть привлечение субподрядной организации'] },
    { re: /активност|аудитори|участник/i, cat: 'Низкий охват программы', actions: ['Усилить информирование целевой аудитории через акимат, школы и СМИ', 'Скорректировать формат мероприятий по обратной связи участников'] },
    { re: /целев/i, cat: 'Целевое использование средств', actions: ['Провести проверку целевого использования средств силами службы внутреннего аудита', 'Запросить подтверждающие финансовые документы'] }
  ];
  const actionsFor = (text) => { const pb = PLAYBOOK.find(x => x.re.test(text)); return pb ? pb : { cat: 'Прочие риски', actions: ['Разработать план мероприятий по снижению риска с конкретными сроками', 'Назначить ответственного и контролировать исполнение в системе'] }; };

  // Ход реализации: история изменения % реализации из журнала
  function progressHistory(p) {
    const pts = DB.AUDIT.filter(a => a.projectId === p.id && a.action === 'Изменен % реализации').map(a => ({ at: a.at, v: parseInt(a.new, 10), from: parseInt(a.old, 10) })).filter(x => isFinite(x.v)).sort((a, b) => a.at - b.at);
    return pts;
  }
  function pace(p) {
    const hist = progressHistory(p);
    const since = new Date(TODAY.getTime() - 90 * DAY);
    const recent = hist.filter(h => h.at >= since);
    let perMonth;
    if (recent.length) {
      const first = recent[0].from;
      perMonth = (p.progress - first) / 3;
    } else {
      const el = Math.max(1, (TODAY - p.start) / DAY);
      perMonth = p.progress / el * 30;
    }
    const el = Math.max(1, (TODAY - p.start) / DAY);
    const overall = p.progress / el * 30;
    return Math.max(0, Math.round(Math.max(perMonth, overall) * 10) / 10);
  }
  function forecast(p) {
    if (PRE_ACCEPT.includes(p.wf) || p.progress >= 100 || DB.implStatus(p.wf) === 'Завершено' || p.start > TODAY || (p.wf === 'ACCEPTED' && p.progress === 0)) return null;
    const pm = pace(p);
    if (pm <= 0.1) return { date: null, lag: null, pace: pm };
    const months = (100 - p.progress) / pm;
    const date = new Date(TODAY.getTime() + months * 30 * DAY);
    return { date, lag: daysBetween(p.planEnd, date), pace: pm };
  }

  /**
   * Анализ проекта → { health, tone, summary, findings[{sev,cat,title,detail,actions[]}], forecast, history, metrics }
   * sev: 3 — критично, 2 — высокая, 1 — средняя
   */
  function project(p) {
    const F = [];
    const add = (sev, cat, title, detail, actions) => F.push({ sev, cat, title, detail, actions });
    const pre = PRE_ACCEPT.includes(p.wf);
    const done = DB.implStatus(p.wf) === 'Завершено';
    const timePct = pre ? 0 : Math.max(0, Math.min(100, (TODAY - p.start) / (p.planEnd - p.start) * 100));
    const spentPct = p.budget ? p.spent / p.budget * 100 : 0;
    const fc = forecast(p);
    const hist = progressHistory(p);
    const stale = Core.daysSince(p.lastUpdate);

    if (pre) {
      if (p.wf === 'RETURNED') {
        const issues = p.review && p.review.checklist ? Object.entries(p.review.checklist).filter(([, v]) => v === 'issue').map(([k]) => ({ info: 'основная информация', budget: 'бюджет', dates: 'сроки', resp: 'ответственный', docs: 'документы', geo: 'геолокация', risks: 'риски', compliance: 'соответствие требованиям' }[k])) : [];
        add(2, 'Согласование', `Проект возвращён на доработку${p.returns > 1 ? ` (${p.returns}-й раз)` : ''}`, `Замечания КМГ: ${(p.review && p.review.comment) || '—'}${issues.length ? ` Требуют уточнения: ${issues.join(', ')}.` : ''}`,
          ['Устранить замечания по каждому пункту чек-листа и приложить подтверждающие документы', 'Перед повторной отправкой провести консультацию с проверяющим КМГ', 'Отправить проект на проверку повторно в течение 5 рабочих дней']);
      }
      if (Core.reviewLate(p)) add(2, 'Согласование', 'Нарушен нормативный срок проверки КМГ', `Срок проверки истёк ${fdate(p.reviewDue)}.`, ['Проверяющему КМГ принять решение по проекту в приоритетном порядке', 'При необходимости запросить у ДЗО недостающую информацию через комментарии']);
      if (p.wf === 'DRAFT') add(1, 'Согласование', 'Проект в черновике', 'Проект не направлен на проверку в КМГ.', ['Заполнить бюджет, сроки, геолокацию и приложить документы', 'Отправить проект на проверку в КМГ']);
    } else if (!done) {
      if (p.overdue) {
        add(3, 'Срыв сроков', `Срок реализации истёк ${daysBetween(p.planEnd, TODAY)} дн. назад`, `Плановая дата ${fdate(p.planEnd)}, выполнено ${p.progress}%.`,
          ['Вынести на Комиссию решение о продлении срока с обоснованием подрядчика', 'Применить к подрядчику штрафные санкции по договору (пеня за просрочку)', 'Утвердить график завершения работ с еженедельным контролем КМГ']);
      } else if (timePct - p.progress >= 15) {
        add(2, 'Отставание от графика', `Отставание от графика на ${Math.round(timePct - p.progress)} п.п.`, `Истекло ${Math.round(timePct)}% срока, выполнено ${p.progress}%.`, actionsFor('отставание').actions);
      } else if (timePct - p.progress >= 7) {
        add(1, 'Отставание от графика', `Небольшое отставание от графика (${Math.round(timePct - p.progress)} п.п.)`, `Истекло ${Math.round(timePct)}% срока, выполнено ${p.progress}%.`, ['Проконтролировать темп работ на ближайшем совещании', 'Запросить у подрядчика план на следующий месяц']);
      }
      if (fc && fc.date && fc.lag > 30 && !p.overdue) add(2, 'Прогноз', `Прогноз завершения — ${fdate(fc.date)}, позже плана на ${fc.lag} дн.`, `Текущий темп — ${fc.pace} п.п. в месяц; для завершения в срок нужно ≈${Math.max(0, Math.round((100 - p.progress) / Math.max(1, (p.planEnd - TODAY) / DAY / 30)))} п.п. в месяц.`,
        ['Ускорить темп работ до необходимого уровня или заранее инициировать корректировку срока', 'Пересмотреть последовательность работ, выделить критический путь']);
      if (fc && !fc.date) add(2, 'Прогноз', 'Нет динамики реализации', 'За последние 3 месяца % реализации практически не изменился.', ['Выяснить причины остановки работ на выездном совещании', 'Запросить у ДЗО актуальный статус и план возобновления работ']);
      if (spentPct - p.progress > 10) add(2, 'Финансы', `Опережающее освоение средств: ${Math.round(spentPct)}% бюджета при реализации ${p.progress}%`, `Освоено ${money(p.spent)} из ${money(p.budget)}.`, ['Провести сверку актов выполненных работ (КС-2, КС-3) с фактическим объёмом', 'Проверить обоснованность авансовых платежей', 'Приостановить авансирование до выравнивания физического и финансового освоения']);
      else if (p.progress - spentPct > 20 && p.progress > 30) add(1, 'Финансы', `Финансирование отстаёт от физического объёма (${Math.round(spentPct)}% vs ${p.progress}%)`, 'Выполненные работы оплачены не полностью.', ['Ускорить приёмку и оплату выполненных работ', 'Проверить наличие неоплаченных актов у подрядчика']);
      if (stale > 30) add(1, 'Мониторинг', `Нет актуализации данных ${stale} дн.`, `Последнее обновление ${fdate(p.lastUpdate)}.`, ['Запросить у ДЗО обновление % реализации и освоения', 'Установить ежемесячный срок актуализации данных']);
    }
    p.risks.filter(r => r.status !== 'Устранён').forEach(r => {
      const pb = actionsFor(r.text);
      const late = r.due < TODAY;
      if (r.level === 'Высокий' || late) add(r.level === 'Высокий' ? (late ? 3 : 2) : 1, pb.cat, `${r.level === 'Высокий' ? 'Риск высокого уровня' : 'Просрочено устранение риска'}: ${r.text}`, `Ответственный ${r.owner}, срок ${fdate(r.due)}${late ? ' — просрочен' : ''}.`, pb.actions);
    });
    if (p.docsMissing) add(1, 'Документы и отчётность', 'Отсутствуют документы', p.docsMissing, actionsFor('документ').actions);
    if (p.commission) {
      const next = DB.EVENTS.find(e => e.type === 'commission' && e.date >= TODAY);
      add(1, 'Решение Комиссии', `Требуется решение Комиссии: ${p.commission}`, next ? `Ближайшее заседание — ${fdate(next.date)}.` : '', ['Включить вопрос в повестку ближайшего заседания Комиссии', 'Подготовить обоснование и расчёты к заседанию']);
    }
    if (p.returns >= 2 && !pre) add(1, 'Согласование', `Проект возвращался на доработку ${p.returns} раза`, 'Высокая доля возвратов увеличивает сроки запуска.', ['Провести для ДЗО разъяснение требований к пакету документов', 'Использовать чек-лист КМГ до отправки проекта']);
    if (p.funding === 'ceo' && window.Finance) {
      const r = Finance.ceoRows(Finance.curY()).find(x => x.z.id === p.dzo);
      if (r && (r.status.label === 'Превышен' || r.status.label === 'Без выделенного лимита')) add(2, 'Лимит ФГД', `${p.dzoShort} превысило лимит Фонда генеральных директоров`, `Использовано ${money(r.fact)} при лимите ${money(r.alloc)}.`, ['Приостановить новые обязательства за счёт ФГД до решения КМГ', 'Перевести часть расходов на источник «в рамках лимита на благотворительность» по согласованию', 'Запросить у КМГ увеличение лимита ФГД с обоснованием']);
    }

    F.sort((a, b) => b.sev - a.sev);
    const weight = F.reduce((s, f) => s + [0, 6, 14, 28][f.sev], 0);
    const health = done ? 100 : Math.max(5, 100 - weight);
    const tone = F.some(f => f.sev === 3) || health < 45 ? 'bad' : health < 75 ? 'warn' : 'ok';
    const label = { bad: 'Критическое состояние', warn: 'Требует внимания', ok: 'В норме' }[tone];
    let summary;
    if (done) summary = `Проект завершён: реализация ${p.progress}%, освоено ${Math.round(spentPct)}% бюджета.`;
    else if (pre) summary = `Проект на этапе согласования (${p.wfLabel.toLowerCase()}). ${F.length ? 'Есть вопросы, требующие действий.' : 'Препятствий для согласования не выявлено.'}`;
    else summary = `Реализация ${p.progress}% при истекших ${Math.round(timePct)}% срока; освоено ${Math.round(spentPct)}% бюджета. ${fc && fc.date ? `Прогноз завершения — ${fdate(fc.date)}${fc.lag > 14 ? ` (позже плана на ${fc.lag} дн.)` : fc.lag < -14 ? ' (раньше плана)' : ' (в срок)'}.` : fc ? 'Динамики нет — прогноз невозможен.' : ''}`;
    if (!F.length && !done && !pre) F.push({ sev: 0, cat: 'Мониторинг', title: 'Проект реализуется в плановом режиме', detail: 'Существенных отклонений не выявлено.', actions: ['Продолжить ежемесячную актуализацию данных', 'Готовить документы к следующей контрольной точке заранее'] });
    return { p, health, tone, label, summary, findings: F, forecast: fc, history: hist, metrics: { timePct, spentPct, pace: pace(p) } };
  }

  // Портфель: типовые проблемы → проекты → меры
  function portfolio(list) {
    const act = list.filter(p => !['DONE', 'ARCHIVE'].includes(p.wf));
    const res = act.map(project);
    const byCat = {};
    res.forEach(r => r.findings.filter(f => f.sev > 0).forEach(f => {
      const c = byCat[f.cat] = byCat[f.cat] || { cat: f.cat, n: 0, sev: 0, projects: [], actions: f.actions };
      if (!c.projects.includes(r.p)) { c.projects.push(r.p); c.n++; }
      c.sev = Math.max(c.sev, f.sev);
    }));
    const cats = Object.values(byCat).sort((a, b) => b.sev - a.sev || b.n - a.n);
    return { res, cats, critical: res.filter(r => r.tone === 'bad').sort((a, b) => a.health - b.health), attention: res.filter(r => r.tone === 'warn') };
  }

  // HTML-блок для карточки проекта
  function card(p) {
    const a = project(p);
    const col = { bad: 'var(--bad)', warn: 'var(--warn)', ok: 'var(--ok)' }[a.tone];
    const top = a.findings.slice(0, 3);
    return `<div class="ai-card"><div class="ai-card-head"><div class="ai-avatar sm">${UI.icon('spark')}</div><div style="min-width:0"><div class="fw6">AI-анализ хода реализации</div><div class="small text-muted">выводы и рекомендации сформированы по данным системы</div></div>
        <div class="ai-health" style="--c:${col}"><b>${a.health}</b><span>индекс</span></div></div>
      <div class="ai-card-body"><div class="row" style="margin-bottom:8px"><span class="badge ${a.tone === 'bad' ? 'b-bad' : a.tone === 'warn' ? 'b-warn' : 'b-ok'}">${a.label}</span>${a.forecast && a.forecast.pace != null ? `<span class="badge plain b-gray">темп: ${a.forecast.pace} п.п./мес</span>` : ''}</div>
        <p class="small" style="margin:0 0 10px;line-height:1.55">${a.summary}</p>
        ${top.map(f => `<div class="ai-find sev${f.sev}"><div class="t">${UI.esc(f.title)}</div><ul>${f.actions.slice(0, 2).map(x => `<li>${UI.esc(x)}</li>`).join('')}</ul></div>`).join('')}
        <button class="btn btn-sm mt16" id="aiDeep">${UI.icon('spark')}Подробный анализ и пути решения</button></div></div>`;
  }

  window.Insights = { project, portfolio, card, progressHistory, forecast, pace, PLAYBOOK };
})();

</script>
  <script>
/* Импорт проектов из CSV — доступен только администратору */
(function () {
  'use strict';
  const { icon, esc, money, openModal, closeModal, toast, toastErr, act, downloadCSV } = UI;

  // Колонки файла: ключ, заголовок, обязательность, описание, пример
  const COLS = [

    ['dzo', 'ДЗО', true, 'Код ДЗО: ОМГ, ММГ, ЭМГ, КТО, АНПЗ, ПНХЗ, КБМ, ПКОП, КТМ', 'ОМГ'],

    ['funding', 'Источник финансирования', true, '«В рамках лимита» · «ФГД» (Фонд генеральных директоров, в рамках лимита) · «Вне лимита»', 'ФГД'],
    ['budget', 'Бюджет план, тенге', true, 'Плановый бюджет в тенге, целое число', '25000000'],
    ['spent', 'Бюджет факт, тенге', false, 'Фактически освоено в тенге; по умолчанию 0', '0'],
    ['progress', '% реализации', false, 'От 0 до 100; по умолчанию 0', '0'],
    ['start', 'Дата начала', false, 'ДД.ММ.ГГГГ; по умолчанию — через 45 дней', '01.11.2026'],
    ['planEnd', 'Плановая дата завершения', true, 'ДД.ММ.ГГГГ, позже даты начала', '30.09.2027'],

    ['wf', 'Статус workflow', false, 'Черновик (по умолчанию), Отправлен на проверку, На проверке в КМГ, Возвращен на доработку, Принят, На контроле, В реализации, Завершен, Архив', 'Черновик'],
    ['risk', 'Уровень риска', false, 'Низкий (по умолчанию), Средний, Высокий', 'Низкий'],
    ['lat', 'Широта', false, 'Десятичные градусы, 40–56; если пусто — центр региона', '43.34200'],
    ['lng', 'Долгота', false, 'Десятичные градусы, 46–88; если пусто — центр региона', '52.86200'],
    ['contractor', 'Подрядчик', false, 'Подрядчик или исполнитель', 'Определяется по итогам закупа'],
    ['description', 'Описание', false, 'Цель, состав работ, социальный эффект', 'Спортивный зал 24×12 м для сельской школы'],
    ['beneficiaries', 'Благополучатели', false, 'Количество человек, целое число', '450'],
    ['code', 'Код проекта', false, 'Если пусто — присваивается автоматически (СП-ГГ-NNN)', '']
  ];
  const norm = (s) => String(s || '').toLowerCase().replace(/ё/g, 'е').replace(/\*/g, '').replace(/\(.*?\)/g, '').replace(/[,;].*$/, '').replace(/\s+/g, ' ').trim();
  const ALIASES = {};
  COLS.forEach(([k, t]) => { ALIASES[norm(t)] = k; ALIASES[k.toLowerCase()] = k; });
  Object.assign(ALIASES, { 'наименование проекта': 'name', 'регион реализации': 'region', 'бюджет': 'budget', 'бюджет план': 'budget', 'бюджет факт': 'spent', 'освоено': 'spent', 'budget_plan': 'budget', 'budget_fact': 'spent', 'реализация': 'progress', 'дата завершения': 'planEnd', 'plan_end': 'planEnd', 'статус': 'wf', 'риск': 'risk', 'latitude': 'lat', 'longitude': 'lng', 'исполнитель': 'contractor', 'количество благополучателей': 'beneficiaries', 'код': 'code', 'источник': 'funding' });

  const FUND = (v) => {
    const s = norm(v);
    if (!s) return null;
    if (s === 'ceo' || s.includes('фгд') || s.includes('фонд генеральн')) return 'ceo';
    if (s === 'out' || s.includes('вне')) return 'out';
    if (s === 'limit' || s.includes('лимит')) return 'limit';
    return null;
  };
  const WF_BY_LABEL = Object.fromEntries(Object.entries(DB.WF).map(([k, w]) => [norm(w.label), k]));
  const parseNum = (v) => { const s = String(v == null ? '' : v).replace(/[\s ₸]/g, '').replace(/тенге|тг/gi, '').replace(',', '.'); return s === '' ? null : Number(s); };
  const parseDate = (v) => {
    const s = String(v || '').trim(); if (!s) return null;
    let m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/);
    if (m) { const d = new Date(+m[3], +m[2] - 1, +m[1]); return d.getDate() === +m[1] ? d : undefined; }
    m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
    return undefined;
  };
  const findDzo = (v) => {
    const s = norm(v); if (!s) return null;
    return DB.ALL.dzo.find(z => z.id === s || norm(z.short) === s || norm(z.name) === s || norm(z.name).includes(s)) || null;
  };
  const inList = (list, v) => list.find(x => norm(x) === norm(v)) || null;

  // CSV-парсер с поддержкой кавычек и переносов строк внутри полей
  function parseCSV(text) {
    text = text.replace(/^﻿/, '');
    const first = text.split(/\r?\n/)[0] || '';
    const delim = (first.match(/;/g) || []).length >= (first.match(/,/g) || []).length ? ';' : ',';
    const rows = []; let row = [], cur = '', q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += c; }
      else if (c === '"') q = true;
      else if (c === delim) { row.push(cur); cur = ''; }
      else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return { delim, rows: rows.filter(r => r.some(x => String(x).trim() !== '')) };
  }
  function decode(buf) {
    try { return { text: new TextDecoder('utf-8', { fatal: true }).decode(buf), enc: 'UTF-8' }; }
    catch (e) { return { text: new TextDecoder('windows-1251').decode(buf), enc: 'Windows-1251' }; }
  }

  function validate(parsed) {
    const [head, ...body] = parsed.rows;
    if (!head) return { error: 'Файл пуст' };
    const map = head.map(h => ALIASES[norm(h)] || null);
    const missing = COLS.filter(c => c[2] && !map.includes(c[0])).map(c => c[1]);
    if (missing.length) return { error: `В файле нет обязательных колонок: ${missing.join(', ')}. Скачайте шаблон и используйте его заголовки.` };
    const unknown = head.filter((h, i) => !map[i] && String(h).trim());
    const existing = new Set(DB.ALL.projects.map(p => norm(p.name) + '|' + p.dzo));
    const codes = new Set(DB.ALL.projects.map(p => p.code));
    const inFile = new Set();
    const Y = new Date().getFullYear();
    const out = body.map((cells, idx) => {
      const r = {}; map.forEach((k, i) => { if (k) r[k] = String(cells[i] == null ? '' : cells[i]).trim(); });
      const err = [], warn = [];
      const d = {};
      d.name = r.name; if (!d.name) err.push('не заполнено наименование');
      const z = findDzo(r.dzo); if (!z) err.push(`неизвестное ДЗО «${r.dzo || ''}»`); else d.dzo = z.id;
      d.region = inList(DB.REGIONS, r.region); if (!d.region) err.push(`регион «${r.region || ''}» нет в справочнике`);
      d.direction = inList(DB.DIRECTIONS, r.direction); if (!d.direction) err.push(`направление «${r.direction || ''}» нет в справочнике`);
      d.funding = FUND(r.funding); if (!d.funding) err.push(`источник финансирования «${r.funding || ''}» не распознан`);
      const b = parseNum(r.budget); if (!(b > 0)) err.push('бюджет план должен быть больше 0'); else d.budget = Math.round(b / 1e5) / 10;
      const s = parseNum(r.spent); if (s != null && (isNaN(s) || s < 0)) err.push('некорректный бюджет факт'); else d.spent = s ? Math.round(s / 1e5) / 10 : 0;
      if (b > 0 && s > b * 1.1) err.push('бюджет факт превышает план более чем на 10%');
      const pr = parseNum(r.progress); if (pr != null && (isNaN(pr) || pr < 0 || pr > 100)) err.push('% реализации должен быть от 0 до 100'); else d.progress = pr || 0;
      const st = parseDate(r.start); if (st === undefined) err.push(`неверная дата начала «${r.start}»`); else d.start = st || undefined;
      const en = parseDate(r.planEnd); if (!en) err.push(`неверная плановая дата завершения «${r.planEnd || ''}»`); else d.planEnd = en;
      if (d.start && d.planEnd && d.planEnd <= d.start) err.push('дата завершения раньше даты начала');
      d.resp = (r.resp || '').replace(/\s+/g, ' '); if (d.resp.split(' ').length < 2) err.push('ответственный: укажите ФИО (минимум фамилия и имя)');
      if (r.wf) { d.wf = WF_BY_LABEL[norm(r.wf)] || (DB.WF[String(r.wf).toUpperCase()] ? String(r.wf).toUpperCase() : null); if (!d.wf) err.push(`неизвестный статус «${r.wf}»`); } else d.wf = 'DRAFT';
      if (r.risk) { d.risk = inList(DB.RISKS, r.risk); if (!d.risk) err.push(`неизвестный уровень риска «${r.risk}»`); } else d.risk = 'Низкий';
      const la = parseNum(r.lat), lo = parseNum(r.lng);
      if (la != null || lo != null) { if (!(la >= 40 && la <= 56 && lo >= 46 && lo <= 88)) err.push('координаты вне территории РК'); else { d.lat = la; d.lng = lo; } }
      else warn.push('координаты не указаны — будет центр региона');
      d.contractor = r.contractor || ''; d.description = r.description || ''; d.beneficiaries = parseNum(r.beneficiaries) || 0;
      if (r.code) { if (codes.has(r.code)) err.push(`код ${r.code} уже существует`); else d.code = r.code; }
      const key = norm(d.name) + '|' + d.dzo;
      if (d.name && d.dzo && existing.has(key)) err.push('проект с таким названием уже есть у этого ДЗО');
      if (d.name && d.dzo && inFile.has(key)) err.push('дубликат строки в файле'); inFile.add(key);
      if (d.funding === 'ceo' && d.dzo) {
        const cfg = DB.FIN.ceo[d.planEnd ? Math.min(d.planEnd.getFullYear(), Y + 1) : Y] || DB.FIN.ceo[Y];
        if (!cfg || !cfg.alloc[d.dzo]) warn.push(`у ${z.short} нет лимита ФГД — проверьте источник финансирования`);
      }
      if (DB.PRE_ACCEPT.includes(d.wf) && (d.progress > 0 || d.spent > 0)) warn.push('для проекта на согласовании указаны факт или % реализации');
      return { line: idx + 2, raw: r, d, err, warn };
    });
    return { rows: out, unknown };
  }

  function template() {
    downloadCSV('KMG_Social_Hub_shablon_importa.csv', COLS.map(c => c[1] + (c[2] ? ' *' : '')), [

      ['Строительство поликлиники в пос. Аксу', 'ПНХЗ', 'Павлодарская область', 'Здравоохранение', 'Вне лимита', '310000000', '0', '0', '01.02.2027', '30.06.2028', 'Искакова Динара Бауыржановна', 'Черновик', 'Низкий', '', '', '', 'Поликлиника на 150 посещений в смену', '8000', '']

        <span class="small text-muted" id="imName">файл не выбран</span></div>

        <div class="table-wrap mt16"><table class="tbl"><thead><tr><th>Колонка</th><th>Обяз.</th><th>Формат / допустимые значения</th><th>Пример</th></tr></thead><tbody>
        ${COLS.map(c => `<tr><td class="fw6 nowrap">${c[1]}</td><td>${c[2] ? '<span class="badge b-bad">да</span>' : '<span class="muted">нет</span>'}</td><td class="small">${esc(c[3])}</td><td class="small nowrap">${esc(c[4])}</td></tr>`).join('')}
        </tbody></table></div></details>`,
      foot: `<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="imGo" disabled>Импортировать</button>` });
    document.getElementById('imTpl').onclick = template;
    let state = null, fileName = '';
    document.getElementById('imFile').onchange = async (e) => {
      const f = e.target.files[0]; if (!f) return;
      fileName = f.name;

      const sumB = ok.reduce((s, r) => s + r.d.budget, 0);
      box.innerHTML = `<div class="row"><span class="badge b-ok">Готово к импорту: ${ok.length}</span><span class="badge ${bad.length ? 'b-bad' : 'b-gray'}">С ошибками: ${bad.length}</span><span class="badge plain b-info">Бюджет план: ${money(sumB)}</span>
        ${['limit', 'ceo', 'out'].map(k => `<span class="badge plain ${DB.FUNDING[k].cls}">${DB.FUNDING[k].short}: ${ok.filter(r => r.d.funding === k).length}</span>`).join('')}</div>
        ${v.unknown.length ? `<div class="small text-muted mt16">Колонки проигнорированы: ${v.unknown.map(esc).join(', ')}</div>` : ''}
        <div class="table-wrap mt16" style="max-height:340px;overflow:auto;border:1px solid var(--border);border-radius:10px"><table class="tbl"><thead><tr><th>Строка</th><th>Проект</th><th>ДЗО</th><th>Источник</th><th class="r">План</th><th class="r">Факт</th><th>Ответственный</th><th>Статус</th><th>Проверка</th></tr></thead><tbody>
        ${v.rows.map(r => `<tr><td class="num muted">${r.line}</td><td class="t-name">${esc(r.d.name || '—')}</td><td>${r.d.dzo ? DB.DZO_BY_ID[r.d.dzo].short : '—'}</td><td>${r.d.funding ? `<span class="badge plain ${DB.FUNDING[r.d.funding].cls}">${DB.FUNDING[r.d.funding].short}</span>` : '—'}</td>
          <td class="r nowrap num">${r.d.budget ? money(r.d.budget) : '—'}</td><td class="r nowrap num">${money(r.d.spent || 0)}</td><td class="nowrap">${esc(r.d.resp || '—')}</td><td>${r.d.wf ? UI.wfBadge(r.d.wf) : '—'}</td>
          <td class="small" style="min-width:220px">${r.err.length ? `<span class="text-bad">${r.err.map(esc).join('; ')}</span>` : '<span class="text-ok fw6">OK</span>'}${r.warn.length ? `<div class="text-muted">${r.warn.map(esc).join('; ')}</div>` : ''}</td></tr>`).join('')}
        </tbody></table></div>
        ${bad.length ? `<div class="lock-note">${icon('alert')}Строки с ошибками не будут загружены. Исправьте их в файле и загрузите повторно, либо импортируйте только корректные строки.</div>` : ''}`;
      const go = document.getElementById('imGo');
      go.disabled = !ok.length; go.textContent = ok.length ? `Импортировать ${ok.length} ${UI.plural(ok.length, 'проект', 'проекта', 'проектов')}` : 'Нет строк для импорта';
    };
    document.getElementById('imGo').onclick = () => {
      if (!state) return;
      const ok = state.rows.filter(r => !r.err.length).map(r => r.d);
      const res = act(() => Core.importProjects(ok, fileName));
      if (res) { closeModal(); toast(`Импортировано проектов: ${res.length}`); window.App && App.route(); }
    };
  }

  window.Importer = { open, COLS, template, parseCSV, validate };
})();

          <div class="demo-accs">${DEMO.map(([id, role, email, lbl]) => `<button class="demo-acc" data-demo="${email}"><b>${role === 'KMG' ? 'КМГ' : role === 'ADMIN' ? 'ADMIN' : lbl.split(' · ')[0]}</b><span>${email}</span></button>`).join('')}</div>
        </div>
      </div></section></div>`;
    const err = (m) => { const e = document.getElementById('lgErr'); e.textContent = m; e.classList.toggle('show', !!m); };
    document.getElementById('lgEye').onclick = () => { const i = document.getElementById('lgPwd'); i.type = i.type === 'password' ? 'text' : 'password'; };
    document.getElementById('lgForgot').onclick = () => err('Для восстановления пароля обратитесь к администратору системы (admin@kmg.kz) или в Service Desk.');
    root.querySelectorAll('[data-demo]').forEach(b => b.onclick = () => { document.getElementById('lgEmail').value = b.dataset.demo; document.getElementById('lgPwd').value = 'demo123'; err(''); document.getElementById('loginForm').requestSubmit(); });
    document.getElementById('loginForm').onsubmit = (e) => {
      e.preventDefault();
      const email = document.getElementById('lgEmail').value, pwd = document.getElementById('lgPwd').value;
      if (!email.trim() || !pwd) { err('Введите e-mail и пароль'); return; }
      const r = Core.login(email, pwd, document.getElementById('lgRemember').checked);
      if (r.error) { err(r.error); return; }
      try { localStorage.setItem('kmg-hub-last-email', email.trim()); } catch (x) { }
      root.innerHTML = '';
      document.body.classList.remove('auth-off');
      onDone && onDone(r.user);
    };
    setTimeout(() => document.getElementById(remembered ? 'lgPwd' : 'lgEmail').focus(), 50);
  }

    view().innerHTML = `<div class="card forbidden"><div class="big">${icon('shield')}</div><h2>Доступ запрещён</h2>
      <p>${msg || 'У вашей учётной записи нет прав на просмотр этого раздела.'}<br>Роль: <b>${Core.ROLE_LABEL[U().role]}</b> · Доступ: <b>${esc(scopeText())}</b></p>
      <a class="btn btn-primary" href="#/dashboard">${icon('dashboard')}На главную</a></div>`;
  }
  function notFound(msg) {
    view().innerHTML = `<div class="card forbidden"><div class="big" style="background:var(--surface-3);color:var(--muted)">${icon('search')}</div><h2>Не найдено</h2><p>${msg || 'Запрошенный объект не существует или был удалён.'}</p><a class="btn btn-primary" href="#/projects">К реестру проектов</a></div>`;
  }

  /* =====================================================================
     ФИЛЬТРЫ (dashboard и карта)
     ===================================================================== */
  const blankF = () => ({ dzo: '', region: '', direction: '', wf: '', year: '', risk: '' });
  H().STATE.dash = H().STATE.dash || blankF();
  H().STATE.map = H().STATE.map || blankF();
  function applyF(f, list = PROJECTS) {
    return list.filter(p => (!f.dzo || p.dzo === f.dzo) && (!f.region || p.region === f.region) && (!f.direction || p.direction === f.direction) &&
      (!f.risk || p.risk === f.risk) && (!f.year || (p.start.getFullYear() <= +f.year && p.planEnd.getFullYear() >= +f.year)) &&
      (!f.wf || (f.wf === 'CHECK' ? ['SUBMITTED', 'REVIEW'].includes(p.wf) : f.wf === 'WORK' ? ['ACCEPTED', 'CONTROL', 'IMPL'].includes(p.wf) : f.wf === 'FIN' ? ['DONE', 'ARCHIVE'].includes(p.wf) : p.wf === f.wf)));
  }
  function filterBar(f, id) {
    const years = [...new Set(PROJECTS.flatMap(p => { const a = []; for (let y = p.start.getFullYear(); y <= p.planEnd.getFullYear(); y++) a.push(y); return a; }))].sort().map(String);
    const active = Object.values(f).filter(Boolean).length;
    return `<div class="card mb16"><div class="filters" id="${id}">
      ${DZO.length > 1 ? `<div class="field"><label>ДЗО</label><select class="select" data-df="dzo">${selOpts(DZO.map(z => [z.id, z.short]), f.dzo, 'Все ДЗО')}</select></div>` : ''}
      <div class="field"><label>Регион</label><select class="select" data-df="region">${selOpts([...new Set(PROJECTS.map(p => p.region))].sort().map(r => [r, shortRegion(r)]), f.region, 'Все регионы')}</select></div>
      <div class="field"><label>Направление</label><select class="select" data-df="direction">${selOpts(DIRECTIONS, f.direction, 'Все направления')}</select></div>
      <div class="field"><label>Статус</label><select class="select" data-df="wf">${selOpts([['WORK', 'В работе (все)'], ['CHECK', 'На проверке (все)'], ['FIN', 'Завершенные (все)'], ...WF_KEYS.filter(k => U().role !== 'KMG' || k !== 'DRAFT').map(k => [k, WF[k].label])], f.wf, 'Все статусы')}</select></div>
      <div class="field"><label>Год реализации</label><select class="select" data-df="year">${selOpts(years, f.year, 'Все годы')}</select></div>
      <div class="field"><label>Уровень риска</label><select class="select" data-df="risk">${selOpts(RISKS, f.risk, 'Все уровни')}</select></div>
      <div class="field f-reset"><label>&nbsp;</label><button class="btn btn-ghost" data-dreset ${active ? '' : 'disabled'}>${icon('x')}Сбросить${active ? ` (${active})` : ''}</button></div>
    </div></div>`;
  }
  function bindFilterBar(id, f, onChange) {
    const el = document.getElementById(id); if (!el) return;
    el.querySelectorAll('[data-df]').forEach(s => s.onchange = () => { f[s.dataset.df] = s.value; onChange(); });
    const r = el.querySelector('[data-dreset]'); if (r) r.onclick = () => { Object.assign(f, blankF()); onChange(); };
  }

    const cnt = (fn) => L.filter(fn).length;

        ${K({ label: 'Просрочено', value: overdue, ico: 'alert', color: 'var(--bad)', foot: overdue ? '<span class="text-bad">требуют решения</span>' : 'нарушений нет', link: '#/projects?period=overdue' })}

          <div class="card-body"><div class="donut-wrap"><div class="chart-box"><canvas id="chStatus"></canvas><div class="donut-center"><b>${L.length}</b><span>проектов</span></div></div><div id="stLegend"></div></div>

      <div class="cols-2 mb16">

          <div class="card-body flush"><div class="table-wrap"><table class="tbl"><thead><tr><th>Организация</th><th class="r">Сумма</th><th>Статус</th></tr></thead><tbody>
          ${CHARITY.slice(0, 5).map(c => `<tr class="clickable" data-ch="${c.id}"><td><div class="fw6">${esc(c.org)}</div><div class="t-sub">${c.id} · ${fdate(c.date)} · ${c.direction}</div></td><td class="r nowrap num">${money(c.amount)}</td><td>${statusBadge(c.status)}</td></tr>`).join('') || '<tr><td colspan="3"><div class="empty">Нет обращений</div></td></tr>'}
          </tbody></table></div></div></div>

    const refresh = () => rerender(dashboard);

    MapKit.projectsMap('dashMap', L, { scroll: false, activeRegion: f.region, onRegion: (name) => { f.region = f.region === name ? '' : name; refresh(); } });

        plugins: Object.assign(baseOptions().plugins, { tooltip: Object.assign(H().tooltipMoney(), { callbacks: { label: (c) => ` ${c.dataset.label}: ${money(c.raw)}`, footer: (it) => { const x = dirs[it[0].dataIndex]; return `Освоение: ${Math.round(x.s / x.b * 100)}% из ${money(x.b)}`; } } }) }) })
    });
    const m = H().monthly(portfolio, TODAY.getFullYear() * 12, 12);

  const CK = [
    ['info', 'Основная информация', 'наименование, описание, направление'],
    ['budget', 'Бюджет', 'смета и источники финансирования'],
    ['dates', 'Сроки', 'календарный план реализации'],
    ['resp', 'Ответственный', 'назначено ответственное лицо'],
    ['docs', 'Документы', 'обязательный пакет документов'],

    ['risks', 'Риски', 'идентификация и оценка рисков'],
    ['compliance', 'Соответствие требованиям', 'Политика социальных инвестиций КМГ']

  const ptab = { id: null, tab: 'overview' };
  function project(id, params) {
    const r = Core.getProject(id);
    if (r.error === 403) { forbidden('Проект относится к ДЗО, к которому у вашей учётной записи нет доступа. Попытка доступа зафиксирована в журнале.'); return null; }
    if (r.error) { notFound('Проект с таким идентификатором не найден.'); return null; }

      }).join('') || '<tr><td colspan="7"><div class="empty">Записей не найдено</div></td></tr>';
      document.getElementById('plFoot').textContent = `Записей: ${L.length} из ${all().length} · журнал ведётся автоматически по каждому действию с проектом`;

  function auditRow(a) {
    return `<div class="audit-item"><div class="when">${fdate(a.at)}<br>${UI.ftime(a.at)}</div><div class="what"><b>${esc(a.action)}</b> <span class="text-muted">· ${esc(a.object)}</span>
      <div class="by">${who(a.user)}</div>${a.old || a.new ? `<div class="chg">${a.old ? `<span class="o">${esc(a.old)}</span>${icon('arrowRight')}` : ''}<span class="n">${esc(a.new)}</span></div>` : ''}</div></div>`;
  }
  function finChart(p) {
    const s = monthIdx(p.start), e = Math.max(monthIdx(p.planEnd), p.status !== 'Завершено' && monthIdx(TODAY) > monthIdx(p.planEnd) ? monthIdx(TODAY) : 0);
    const cnt = Math.max(1, e - s + 1);
    const mm = H().monthly([p], s, cnt);
    let cp = 0, cf = 0; const labels = [], plan = [], fact = [];
    for (let i = 0; i < cnt; i++) {
      const mi = s + i; cp += mm.plan[i]; if (mm.fact[i] != null) cf += mm.fact[i];
      labels.push(MONTHS[mi % 12] + ' ' + String(Math.floor(mi / 12)).slice(2));
      plan.push(Math.round(cp * 10) / 10); fact.push(mm.fact[i] == null || DB.PRE_ACCEPT.includes(p.wf) ? null : Math.round(cf * 10) / 10);
    }
    makeChart('pFin', {
      type: 'line', data: { labels, datasets: [
        { label: 'План', data: plan, borderColor: cssVar('--c-plan'), borderWidth: 2, pointRadius: 0, borderDash: [4, 4], tension: .2 },
        { label: 'Факт', data: fact, borderColor: cssVar('--c1'), backgroundColor: cssVar('--c1') + '22', fill: true, borderWidth: 2, pointRadius: 0, tension: .2 }] },
      options: Object.assign(baseOptions(), { interaction: { mode: 'index', intersect: false }, scales: axes({ x: { ticks: { maxTicksLimit: 6, color: cssVar('--text-2'), font: { size: 10 } }, grid: { display: false } } }), plugins: Object.assign(baseOptions().plugins, { tooltip: H().tooltipMoney() }) })
    });
  }
  const isoD = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const pd = (s) => s ? new Date(s + 'T00:00:00') : null;
  function confirmBox(title, text, okLabel, cls, onOk) {

    document.getElementById('cfOk').onclick = () => { closeModal(); onOk(); };
  }

        <div class="field"><label>Бюджет (план), млн ₸ *</label><input class="input num" id="fBudget" type="number" step="0.1" min="0" value="${v.budget}" ${dis(full)}></div>

      <div class="field"><label>Бюджет (факт), млн ₸ · план ${money(p.budget)}</label><input class="input num" id="uSpent" type="number" step="0.1" min="0" value="${p.spent}"></div>
      ${p.infra ? `<div class="field"><label>% строительно-монтажных работ</label><input class="input num" id="uSmr" type="number" min="0" max="100" value="${p.smr ?? 0}"></div>` : ''}
      <div class="field"><label>Плановая дата завершения</label><input class="input" id="uEnd" type="date" value="${isoD(p.planEnd)}"></div>
      <div class="field full"><label>Комментарий к обновлению</label><textarea class="input" id="uCm" placeholder="Что сделано за период, причины отклонений"></textarea></div></div>`,
      foot: `<button class="btn" data-close>Отмена</button><button class="btn btn-primary" id="uSave">Сохранить</button>` });
    document.getElementById('uSave').onclick = () => {
      const patch = { progress: Math.max(0, Math.min(100, +document.getElementById('uProg').value)), spent: Math.max(0, +document.getElementById('uSpent').value), planEnd: pd(document.getElementById('uEnd').value) };
      const smr = document.getElementById('uSmr'); if (smr) patch.smr = Math.max(0, Math.min(100, +smr.value));
      if (patch.spent > p.budget * 1.1) { toastErr('Освоение превышает бюджет более чем на 10% — требуется корректировка бюджета'); return; }
      const n = act(() => Core.updateProject(p, patch));
      if (n === false) return;
      const cm = document.getElementById('uCm').value.trim();
      if (cm) act(() => Core.addComment(p, cm));
      if (!n) { p.lastUpdate = new Date(); p.updatedBy = U().id; Core.audit('Подтвержден статус реализации', 'Проект', p, '', `${p.progress}%`); }
      closeModal(); toast('Статус реализации обновлён'); rerender(() => project(p.id));
    };
  }

  const inboxState = { tab: 'review' };

    const returned = PROJECTS.filter(p => p.wf === 'RETURNED');
    const start = new Date(); start.setHours(0, 0, 0, 0);
    const acceptedAudit = Core.visibleAudit().filter(a => a.action === 'Проект принят КМГ');
    const acceptedToday = acceptedAudit.filter(a => a.at >= start).length;
    const acceptedIds = [...new Set(acceptedAudit.filter(a => a.at >= addDays(start, -30)).map(a => a.projectId))];
    const accepted = acceptedIds.map(id => PROJECTS.find(p => p.id === id)).filter(Boolean);

      <div class="kpis k4">
        ${K({ label: 'Новых на проверке', value: review.length, ico: 'inbox', color: 'var(--st-ctrl)', foot: `${review.filter(p => p.wf === 'SUBMITTED').length} не взяты в работу` })}
        ${K({ label: 'На доработке', value: returned.length, ico: 'refresh', color: 'var(--c2)', foot: 'у ДЗО' })}
        ${K({ label: 'Принято сегодня', value: acceptedToday, ico: 'check', color: 'var(--st-done)', foot: `${accepted.length} за 30 дней` })}
        ${K({ label: 'Просрочено', value: late.length, ico: 'alert', color: 'var(--bad)', foot: late.length ? '<span class="text-bad">нарушен срок проверки</span>' : 'нарушений нет' })}

      </div>`;

        return `<tr class="clickable" data-go="#/project/${p.id}"><td class="t-name"><div>${esc(p.name)}</div><div class="t-sub">${p.code} · ${p.region}${p.returns ? ` · возвратов: ${p.returns}` : ''}</div></td>

          <td>${wfBadge(p.wf)}</td><td class="nowrap num ${lt ? 'late' : ''}">${inboxState.tab === 'review' ? fdate(p.reviewDue) + (lt ? ` · −${daysBetween(p.reviewDue, new Date())} дн.` : '') : '—'}</td>

  const NT_ICON = { submit: ['inbox', 'warn'], return: ['refresh', 'bad'], accept: ['check', 'ok'], date: ['calendar', 'info'], done: ['target', 'ok'], doc: ['file', 'info'], control: ['clock', 'warn'], overdue: ['alert', 'bad'], comment: ['inbox', 'info'], risk: ['flame', 'bad'] };
  function notifRow(n) {
    const [ic, tone] = NT_ICON[n.type] || ['bell', 'info'];
    const unread = !n.readBy.includes(U().id);
    const p = n.projectId ? DB.ALL.projects.find(x => x.id === n.projectId) : null;
    return `<div class="notif ${unread ? 'unread' : ''}" data-nid="${n.id}"><div class="ni ${tone}">${icon(ic)}</div><div style="min-width:0"><div class="nt">${esc(n.text)}</div><div class="nm">${p ? `${p.code} · ${p.dzoShort}` : ''}</div></div><div class="nw">${ago(n.at)}</div></div>`;
  }
  function openNotif(id) {
    const n = DB.NOTIFS.find(x => x.id === id); if (!n) return;
    Core.markRead([id]);
    closeDrawer();
    if (n.projectId) { ptab.id = null; go('#/project/' + n.projectId); } else go('#/notifications');
    window.App && App.refreshChrome();
  }
  const notifState = { f: 'all' };
  function notifications() {
    const all = Core.visibleNotifs();
    const L = notifState.f === 'unread' ? all.filter(n => !n.readBy.includes(U().id)) : notifState.f === 'all' ? all : all.filter(n => n.type === notifState.f);
    const unread = all.filter(n => !n.readBy.includes(U().id)).length;
    view().innerHTML = `
      <div class="page-head"><div><h1>Уведомления</h1><div class="sub">${unread} непрочитанных · уведомления привязаны к проектам в пределах вашего доступа</div></div>

    document.querySelectorAll('[data-nid]').forEach(el => el.onclick = () => openNotif(+el.dataset.nid));
    document.getElementById('ntAll').onclick = () => { Core.markRead(); toast('Все уведомления отмечены прочитанными'); notifications(); window.App && App.refreshChrome(); };
  }
  function notifDrawer() {
    const all = Core.visibleNotifs();
    const unread = all.filter(n => !n.readBy.includes(U().id)).length;
    openDrawer({ title: 'Уведомления', sub: `${unread} непрочитанных`, body: `<div class="notif-list">${all.slice(0, 15).map(notifRow).join('') || '<div class="empty">Уведомлений нет</div>'}</div>`,
      foot: `<button class="btn" id="dnRead" ${unread ? '' : 'disabled'}>Прочитать все</button><a class="btn btn-primary" href="#/notifications" id="dnAll">Все уведомления</a>` });

      const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
      if (a !== b) { toastErr('Пароли не совпадают'); return; }
